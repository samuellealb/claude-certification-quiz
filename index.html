<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthropic Developer Foundation Study Quiz</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --panel: #ffffff;
        --border: #e3e5ea;
        --border-strong: #c8cdd6;
        --text: #14161a;
        --muted: #6b7280;
        --muted-2: #9aa1ac;
        --accent: #2563eb;
        --accent-bg: #eef4ff;
        --accent-border: #93b4f5;
        --flag: #b45309;
        --flag-bg: #fff4d6;
        --good: #16a34a;
        --good-bg: #eafbf1;
        --bad: #dc2626;
        --bad-bg: #fdecec;
        /* fixed (non-theme) fills paired with white text; kept dark enough for >=4.5:1 contrast against white in both themes */
        --accent-solid: #1d4ed8;
        --good-solid: #15803d;
        --bad-solid: #b91c1c;
        --radius: 10px;
      }

      /* Accent is deliberately brighter than light-mode blue so text/icons drawn in
         --accent stay readable when placed on top of --accent-bg (selected states). */
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --panel: #181b21;
        --border: #2a2e37;
        --border-strong: #3d434f;
        --text: #e8eaed;
        --muted: #a7aeb8;
        --muted-2: #7d8590;
        --accent: #86b6ff;
        --accent-bg: #16223d;
        --accent-border: #4d75b8;
        --flag: #fbbf24;
        --flag-bg: #3a2a07;
        --good: #4ade80;
        --good-bg: #10281c;
        --bad: #f87171;
        --bad-bg: #2f1414;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .theme-toggle:hover { border-color: var(--accent-border); }

      .shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 600;
        margin-bottom: 14px;
      }

      .title {
        font-size: clamp(1.6rem, 3vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }

      .lede {
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
        max-width: 760px;
        margin: 0 0 32px;
      }

      .lede strong { color: var(--text); font-weight: 600; }

      .domain-bars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 22px 0;
        margin-bottom: 36px;
      }

      .domain-bar-card {
        padding: 0 20px;
        border-left: 1px solid var(--border);
      }

      .domain-bar-card:first-child { border-left: none; }
      .domain-bar-pct { font-size: 1.5rem; font-weight: 700; }
      .domain-bar-name {
        font-size: 0.78rem;
        color: var(--muted);
        margin: 4px 0 12px;
        line-height: 1.4;
        min-height: 2.6em;
      }
      .domain-bar-track {
        height: 4px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .domain-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }

      .section { margin-bottom: 30px; }
      fieldset.section-group {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .section-label {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      legend.section-label { width: 100%; padding: 0; }
      .section-note {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--muted-2);
        font-size: 0.78rem;
      }
      .section.disabled { opacity: 0.45; pointer-events: none; }

      .option-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .option-grid.chips { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

      .option-card {
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel);
        /* buttons don't inherit color from the page by default; without this the text fell back to the browser's default (near-black) button color */
        color: inherit;
        border-radius: var(--radius);
        padding: 14px 16px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .option-card:hover { border-color: var(--border-strong); }
      .option-title { display: block; margin: 0 0 4px; font-size: 0.95rem; font-weight: 600; }
      .option-description { display: block; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
      .option-card.selected { border-color: var(--accent-border); background: var(--accent-bg); }

      .start-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 40px;
        margin-bottom: 40px;
      }
      .btn {
        border-radius: 8px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        padding: 12px 22px;
        font-size: 0.92rem;
      }
      .btn-primary { background: #14161a; color: #fff; }
      .btn-primary:hover { background: #26282e; }
      .btn-secondary { background: #fff; border-color: var(--border-strong); color: var(--text); }
      .start-note { color: var(--muted-2); font-size: 0.78rem; line-height: 1.6; max-width: 420px; }

      [data-theme="dark"] .btn-primary { background: #e8eaed; color: #14161a; }
      [data-theme="dark"] .btn-primary:hover { background: #ffffff; }
      [data-theme="dark"] .btn-secondary { background: var(--panel); }

      .exam-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-tag.anthropicDocs { color: #0f6b5c; border-color: #9fd6c9; background: #e8f7f3; }
      .badge-tag.modelKnowledge { color: #9a3412; border-color: #f5c6a5; background: #fff1e8; }

      [data-theme="dark"] .badge-tag.anthropicDocs { color: #8fe0cd; border-color: #2c5b52; background: #0f2e29; }
      [data-theme="dark"] .badge-tag.modelKnowledge { color: #f7bd93; border-color: #7a4224; background: #3a1d0e; }

      .timer {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .timer.low { color: var(--bad); border-color: var(--bad); }

      .progress-track {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .progress-fill { height: 100%; background: var(--accent); }

      .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 0 0 20px; }

      .answer-list { display: grid; gap: 10px; margin-bottom: 20px; }
      .answer-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--panel);
        cursor: pointer;
        font-size: 0.94rem;
        line-height: 1.5;
      }
      .answer-row:hover:not(.locked) { border-color: var(--border-strong); }
      .answer-row:focus-visible,
      .option-card:focus-visible,
      .btn:focus-visible,
      .question-text:focus-visible {
        outline: 2px solid var(--accent-solid);
        outline-offset: 2px;
      }
      .answer-row.selected { border-color: var(--accent-border); background: var(--accent-bg); }
      .answer-row.correct { border-color: #a7e2bc; background: var(--good-bg); }
      .answer-row.wrong { border-color: #f3b7b5; background: var(--bad-bg); }
      .answer-row.locked { cursor: default; }

      [data-theme="dark"] .answer-row.correct { border-color: #2f6b45; }
      [data-theme="dark"] .answer-row.wrong { border-color: #7a3c3a; }
      .answer-letter {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1.5px solid var(--border-strong);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--muted);
      }
      /* Filled (not outline) so the letter stays legible against --accent-bg in both themes; uses the *-solid tokens, not --accent/--good/--bad, because those are tuned to sit on dark panels and are too light for white text on top of them. */
      .answer-row.selected .answer-letter { border-color: var(--accent-solid); background: var(--accent-solid); color: #fff; }
      .answer-row.correct .answer-letter { border-color: var(--good-solid); background: var(--good-solid); color: #fff; }
      .answer-row.wrong .answer-letter { border-color: var(--bad-solid); background: var(--bad-solid); color: #fff; }

      .check-row { display: flex; gap: 10px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .explanation-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.88rem;
        line-height: 1.6;
        color: #1e293b;
        margin-bottom: 12px;
      }

      [data-theme="dark"] .explanation-box { background: #1f232b; color: #d7dbe0; }
      [data-theme="dark"] .docs-note-box { background: #1f232b; }
      .explanation-label {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .explanation-box.is-correct .explanation-label { color: var(--good); }
      .explanation-box.is-wrong .explanation-label { color: var(--bad); }
      .docs-note-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 20px;
      }

      .ref-list {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 20px;
        padding: 0;
      }
      .ref-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        border-radius: 999px;
        padding: 5px 12px 5px 10px;
        font-size: 0.78rem;
        font-weight: 600;
      }
      .ref-link:hover, .ref-link:focus-visible { border-color: var(--accent-border); color: var(--accent); }
      .ref-badge {
        flex-shrink: 0;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 999px;
        color: var(--muted);
        background: var(--accent-bg);
      }
      .ref-link[data-ref-type="web"] .ref-badge { color: var(--accent); }

      .scenario-context {
        margin: 20px 0;
        padding: 14px 16px;
        border: 1px solid var(--accent-border);
        border-left: 4px solid var(--accent-solid);
        border-radius: 6px;
        background: var(--accent-bg);
      }
      .scenario-context-label { margin: 0 0 4px; color: var(--accent); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      .scenario-context h3 { margin: 0; font-size: 1rem; }
      .scenario-context p:last-child { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }

      .flag-row { margin: 0 0 20px; }
      .nav-row { display: flex; justify-content: space-between; gap: 12px; }
      .exam-review { margin: 12px 0 24px; border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--panel); }
      .exam-review-heading { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
      .question-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
      .question-jump { min-height: 40px; padding: 4px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); border-radius: 6px; cursor: pointer; font: inherit; font-size: 0.8rem; }
      .question-jump.answered { background: var(--good-bg); border-color: var(--good); }
      .question-jump.flagged { border: 2px solid var(--flag); background: var(--flag-bg); color: var(--flag); font-weight: 700; }
      .question-jump.flagged:not(.answered) { background: var(--panel); font-weight: normal; }
      .question-jump.current { outline: 2px solid var(--accent-solid); outline-offset: 2px; }
      .question-jump:focus-visible { outline: 2px solid var(--accent-solid); outline-offset: 2px; }
      .flagged-label { color: var(--accent); font-weight: 600; }

      /* Exam question screen: header row + big rounded question card with a faint watermark, restyled to echo a paper-exam layout. */
      .exam-shell { position: relative; }
      .exam-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
      .exam-header-meta { display: flex; gap: 8px; flex-wrap: wrap; }
      .exam-header-right { display: flex; align-items: center; gap: 10px; }
      .exam-flag-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .exam-flag-btn:hover { border-color: var(--accent-border); }
      .exam-flag-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
      .exam-map-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .exam-map-btn:hover, .exam-map-btn[aria-expanded="true"] { border-color: var(--accent-border); }

      .exam-layout {
        --navigator-width: 280px;
        display: grid;
        grid-template-columns: var(--navigator-width) minmax(0, 860px);
        gap: 36px;
        align-items: start;
        width: min(1320px, calc(100vw - 48px));
        margin-left: 50%;
        transform: translateX(-50%);
      }
      .exam-main { min-width: 0; }
      .exam-navigator {
        --filter-height: 220px;
        position: sticky;
        top: 24px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 48px);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        overflow: hidden;
      }
      .exam-navigator-resize-handle {
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 100%;
        cursor: ew-resize;
        touch-action: none;
        z-index: 2;
      }
      .exam-navigator-resize-handle::before { content: ''; position: absolute; top: 50%; right: 3px; width: 2px; height: 40px; border-radius: 999px; background: var(--border-strong); transform: translateY(-50%); opacity: 0; transition: opacity 0.15s ease; }
      .exam-navigator:hover .exam-navigator-resize-handle::before,
      .exam-navigator-resize-handle:focus-visible::before { opacity: 1; }
      .exam-navigator-resize-handle:focus-visible { outline: 2px solid var(--accent-solid); outline-offset: -2px; }
      .exam-navigator-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
      .exam-navigator-kicker { margin: 0 0 4px; color: var(--muted-2); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .exam-navigator-head h2 { margin: 0; font-size: 1rem; line-height: 1.3; }
      .exam-navigator-close { display: none; }
      .exam-filter-list { position: relative; display: grid; flex: 0 0 var(--filter-height); gap: 2px; min-height: 0; padding: 10px 10px 18px; border-bottom: 1px solid var(--border); overflow-y: auto; }
      .exam-filter-list.is-compact { overflow-y: hidden; }
      .exam-filter-resize-handle { position: absolute; right: 0; bottom: 0; left: 0; height: 12px; cursor: ns-resize; touch-action: none; z-index: 2; }
      .exam-filter-resize-handle::before { content: ''; position: absolute; right: 50%; bottom: 3px; width: 40px; height: 2px; border-radius: 999px; background: var(--border-strong); transform: translateX(50%); opacity: 0; transition: opacity 0.15s ease; }
      .exam-filter-list:hover .exam-filter-resize-handle::before,
      .exam-filter-resize-handle:focus-visible::before { opacity: 1; }
      .exam-filter-resize-handle:focus-visible { outline: 2px solid var(--accent-solid); outline-offset: -2px; }
      .exam-filter {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        border: 0;
        border-radius: 6px;
        padding: 7px 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        text-align: left;
      }
      .exam-filter:hover { background: var(--accent-bg); color: var(--text); }
      .exam-filter.active { background: var(--accent-bg); color: var(--accent-solid); }
      .exam-filter-count { min-width: 20px; color: var(--muted-2); font-size: 0.72rem; text-align: right; }
      .exam-filter.active .exam-filter-count { color: inherit; }
      .exam-navigator-summary { display: flex; justify-content: space-between; gap: 8px; padding: 12px 18px 8px; color: var(--muted); font-size: 0.73rem; }
      .exam-navigator-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); flex: 1 1 auto; gap: 7px; min-height: 0; padding: 8px 18px 18px; overflow-y: auto; }
      .exam-navigator-grid .question-jump { min-height: 34px; border-radius: 5px; font-size: 0.76rem; }
      .exam-filter-empty { grid-column: 1 / -1; margin: 4px 0; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
      .exam-navigator-submit { margin: 0 18px 18px; border: 1px solid #14161a; border-radius: 8px; padding: 10px 12px; background: #14161a; color: #fff; cursor: pointer; font: inherit; font-size: 0.83rem; font-weight: 700; }
      .exam-navigator-submit:hover { background: #26282e; }
      [data-theme="dark"] .exam-navigator-submit { border-color: #e8eaed; background: #e8eaed; color: #14161a; }
      [data-theme="dark"] .exam-filter-list,
      [data-theme="dark"] .exam-navigator-grid { scrollbar-color: #4b5563 var(--panel); }
      [data-theme="dark"] .exam-filter-list::-webkit-scrollbar,
      [data-theme="dark"] .exam-navigator-grid::-webkit-scrollbar { width: 8px; }
      [data-theme="dark"] .exam-filter-list::-webkit-scrollbar-track,
      [data-theme="dark"] .exam-navigator-grid::-webkit-scrollbar-track { background: var(--panel); }
      [data-theme="dark"] .exam-filter-list::-webkit-scrollbar-thumb,
      [data-theme="dark"] .exam-navigator-grid::-webkit-scrollbar-thumb { border: 2px solid var(--panel); border-radius: 999px; background: #4b5563; }
      [data-theme="dark"] .exam-filter-list::-webkit-scrollbar-thumb:hover,
      [data-theme="dark"] .exam-navigator-grid::-webkit-scrollbar-thumb:hover { background: #64748b; }

      .exam-card { position: relative; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); padding: 28px 28px 24px; overflow: hidden; margin-bottom: 20px; }
      .exam-watermark {
        position: absolute;
        top: -10px;
        right: 18px;
        font-size: 4.6rem;
        font-weight: 800;
        color: var(--border);
        opacity: 0.6;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }
      [data-theme="dark"] .exam-watermark { opacity: 0.4; }
      .exam-card-meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 14px; }
      .exam-count { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-2); }
      .exam-domain { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; color: var(--accent); }
      .exam-domain::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
      .exam-card > .question-text, .exam-card > section { position: relative; z-index: 1; }

      .exam-bottom-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 64px; }
      .exam-nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border-strong);

          question: "A team is scoping a document-summarisation feature and proposes a multi-agent system from the outset, on the grounds that the problem is important enough to justify the strongest architecture available. The task itself is well defined and a single call with retrieval and a couple of in-context examples already produces acceptable output in testing. What does the guidance recommend?",

          question: "A support platform handles three clearly distinct request categories, and a single prompt tuned for one category measurably degrades the others. Most incoming requests are simple and repetitive; a minority are genuinely unusual. The team wants both better answers and a lower bill. Which pattern addresses both at once, and how?",
          options: ["Prompt chaining, because breaking each request into smaller steps makes every individual call cheaper", "Routing, because classifying the input allows both specialised prompts and sending easy requests to a cheaper model", "Parallelization by sectioning, because handling each category concurrently reduces the per-request cost", "Evaluator-optimizer, because iterating until an evaluator is satisfied avoids wasted spend on poor answers", "Orchestrator-workers, because a central model can allocate budget to each request according to its difficulty"],

          options: ["The first is parallelization and the second is evaluator-optimizer, since re-running a judgement is a feedback loop", "The first is sectioning — independent subtasks in parallel — and the second is voting, the same task run repeatedly for diverse outputs", "The first is parallelization and the second is orchestrator-workers, since a coordinator must combine the verdicts", "They are the same variation described differently, since both run several calls concurrently and aggregate", "The first is routing, because splitting by check type is a classification step applied in advance"],

          explanation: "Parallelization manifests in two variations. Sectioning breaks a task into independent subtasks run in parallel — useful because models generally perform better when each consideration is handled by a separate call, allowing focused attention on each aspect. Voting runs the same task multiple times to get diverse outputs, which suits raising confidence, and lets different vote thresholds balance false positives against false negatives. Both are parallelization; what differs is whether the parallel calls do different work or the same work.",
          sourceScenario: { n: 11, title: "Regulated Agent Delivery" },
          references: [
            { type: "local", href: "module-2.html#the-five-composable-patterns", label: "Module 2 — The five composable patterns" },
            { type: "web", href: "https://www.anthropic.com/engineering/building-effective-agents", label: "Anthropic engineering — Building effective agents" }
          ] },
        { id: "d1-28", domain: "d1", topic: "agent-patterns",
          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A code-modernisation feature must change an unpredictable number of files, and neither the count nor the nature of each change can be known until the task is read. A reviewer notes the proposed design looks structurally identical to a parallelization the team already ships. What actually distinguishes the two?",
          options: ["Parallelization aggregates results programmatically while the orchestrator pattern returns them unaggregated", "Parallelization's subtasks are defined in advance, while an orchestrator determines them at runtime from the specific input", "Parallelization requires the subtasks to be independent, while an orchestrator can only run its workers in sequence", "Parallelization uses one model for every branch, while an orchestrator must use a different model for each worker", "Parallelization is bounded by a fixed concurrency limit, while an orchestrator has no ceiling on worker count"],
          answer: 1,
          explanation: "The orchestrator-workers workflow has a central model dynamically break down the task, delegate to workers, and synthesize their results. It is topographically similar to parallelization, and the key difference is flexibility: the subtasks are not pre-defined but determined by the orchestrator from the specific input. That is exactly why it suits coding changes across an unpredictable set of files, or search tasks gathering from multiple sources — cases where you cannot enumerate the subtasks in advance.",
          sourceScenario: { n: 13, title: "Developer Productivity Platform" },
          references: [
            { type: "local", href: "module-2.html#the-five-composable-patterns", label: "Module 2 — The five composable patterns" },
            { type: "web", href: "https://www.anthropic.com/engineering/building-effective-agents", label: "Anthropic engineering — Building effective agents" }
          ] },
        { id: "d1-29", domain: "d1", topic: "agent-patterns",
          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A team wants to add an evaluator-optimizer loop to a drafting feature, where one call generates and another critiques in a loop. Before committing, it wants to know whether the pattern will actually pay for the extra calls. What two signs indicate a good fit?",
          options: ["The task has a fixed number of steps, and the generator and evaluator can share one prompt", "Responses demonstrably improve when a human articulates feedback, and the model can itself provide that feedback", "The output is schema-constrained, and the evaluator can be replaced by a code-based validator once calibrated", "The evaluator runs on a cheaper model than the generator, and the loop terminates within a fixed iteration cap", "The task is open-ended, and no evaluation criteria can be stated in advance"],
          answer: 1,
          explanation: "Evaluator-optimizer is effective when evaluation criteria are clear and iterative refinement provides measurable value. The two named signs of good fit are that model responses demonstrably improve when a human articulates their feedback, and that the model can provide that kind of feedback itself. Both have to hold: if a human's critique would not improve the draft, the loop has nothing to add, and if the model cannot produce a comparable critique, the loop cannot run unattended. Absent evaluation criteria is a sign against the pattern, not for it.",
          sourceScenario: { n: 11, title: "Regulated Agent Delivery" },
          references: [

            { type: "web", href: "https://www.anthropic.com/engineering/building-effective-agents", label: "Anthropic engineering — Building effective agents" }
          ] },
        { id: "d1-30", domain: "d1", topic: "agent-patterns",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A team adopts an agent framework to move quickly, and three months later cannot explain why a production agent chose a particular tool. Debugging keeps stalling because nobody on the team can see the prompt that was actually sent or the raw response that came back. What is the documented tradeoff, and the recommended response?",
          options: ["Frameworks add network hops that obscure timing, so the fix is to profile each layer and cache the slow ones", "Frameworks add abstraction layers that obscure the underlying prompts and responses, so start with the API directly", "Frameworks enforce their own prompt templates that cannot be inspected, so the fix is to fork the framework and instrument the fork", "Frameworks batch requests transparently, so individual prompts are unrecoverable and tracing must move to the aggregate level", "Frameworks are the recommended production default, so the difficulty indicates the team chose an unsupported one"],
          answer: 1,
          explanation: "Frameworks simplify the low-level work of calling models, defining and parsing tools, and chaining calls, which makes them genuinely useful for getting started. The cost is extra abstraction layers that obscure the underlying prompts and responses, making failures harder to debug, and a standing temptation to add complexity where a simpler setup would do. The guidance is to start with the API directly, since many of these patterns are a few lines of code, and — if a framework is adopted — to understand the code underneath it, because incorrect assumptions about what is under the hood are a common source of error.",
          sourceScenario: { n: 13, title: "Developer Productivity Platform" },
          references: [
            { type: "local", href: "module-2.html#frameworks-help-you-start-and-can-hide-what-you-need-to-debug", label: "Module 2 — Frameworks help you start and can hide what you need to debug" },

          question: "Rockford Savings is expanding its mortgage pre-qualification agent into self-employed and rental-income cases, and wants the decisions written down before implementation. The pilot has already surfaced three gaps nobody had documented: a caller whose common name matched two customer profiles, a frustrated applicant who asked for a person, and a jointly-owned-property case the underwriting policy never addressed. Which four decisions does a design document need to state concretely?",

        { id: "d2-3", domain: "d2", topic: "understanding-requirements",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A requirements review accepts the line \"the assistant should classify tickets well\" into the specification. At the first eval milestone nobody can say whether the build passed. What makes a success criterion usable?",

        { id: "d2-4", domain: "d2", topic: "understanding-requirements",

          options: ["The reviewer is right, so safety belongs in a separate qualitative annex outside the measurable criteria", "Even hazy topics can be quantified — for example, a ceiling on the share of outputs flagged for toxicity", "Safety should be expressed as a model choice rather than a metric, since capability determines the outcome", "Safety criteria should be replaced by a human sign-off step, since no automated measure is defensible", "The requirement is adequate as written, since a reviewer can judge safety case by case at the eval milestone"],

        { id: "d2-5", domain: "d2", topic: "understanding-requirements",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A specification pins a single accuracy target and nothing else. In production the feature meets that target while being too slow for its callers, too expensive at volume, and inconsistent in tone across similar requests. What does the requirement set need?",

        { id: "d2-7", domain: "d2", topic: "understanding-requirements",

          question: "A team writes its accuracy target by taking the best published benchmark figure it can find for the strongest available model and adopting it as the requirement. The build never reaches it, and each review concludes the implementation is underperforming. Which property of a good criterion has been violated?",

          question: "A hosted application sends requests directly to the Claude API, while a useful MCP server runs as a local stdio process on a developer workstation. The architect wants the API to connect to that process exactly as Claude Code does, without adding an application-side bridge or changing the server transport. Which constraint determines whether that design can work?",

          question: "One pipeline reuses the same JSON schema for structured outputs: its first call is slower, but later calls are not. Another generates a different schema for every request and sees that added latency every time. What directly accounts for the difference?",
          options: ["The first pipeline caches completed responses, so later calls return identical output without generating it", "The reused schema is small enough to validate inline, while each generated schema is too large and must be compiled remotely", "The API caches the grammar compiled from an identical schema, but each newly generated schema requires its own grammar compilation", "Structured outputs are applied after generation on the first call and during generation on later calls", "The generated schemas invalidate the prompt cache, so the added latency is from reprocessing the prompt prefix"],

          question: "Verity re-reads the same 50-page trial protocol on every extraction in a study arm, across hundreds of scanned forms and several turns per form. The protocol changes far less often than it is consulted, and the team wants to stop retransmitting its bytes inline on every call while keeping it available as a document block. Which delivery method best fits, and why?",

        { id: "d2-23", domain: "d2", topic: "claude-api-mechanics",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "An integration wraps every Claude call in its own retry loop with exponential backoff, on top of the official SDK's defaults. During a brief upstream incident the service issues far more attempts than the operations team expected, and the incident lasts longer from the caller's perspective than the outage itself. What behaviour did the team overlook?",
          options: ["The SDK retries only authentication failures, so the application loop is what produced the extra attempts", "The SDK already retries transient failures with backoff by default, so an outer loop multiplies attempts", "The SDK converts 5xx responses into successes with empty content, which is why the outer loop kept retrying", "The SDK queues retries until the connection closes, so the application loop's attempts were serialised behind it", "The SDK disables its own retries whenever the caller supplies a custom timeout, so the two layers could not have compounded"],
          answer: 1,
          explanation: "The official SDKs automatically retry transient failures — connection errors, rate limits, and 5xx server errors — with exponential backoff, twice by default, honouring the retry-after header when present. An application-level retry wrapped around an SDK call therefore multiplies attempts rather than adding one, which is what produces both the attempt count and the extended caller-visible duration. The SDK exposes max_retries to configure or disable that behaviour, so the layers can be reconciled deliberately.",
          sourceScenario: { n: 14, title: "Claims Processing API" },
          references: [

          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A streaming endpoint reports a near-perfect success rate from its HTTP status metrics, yet users report truncated and occasionally empty responses. The error handling branches entirely on status code and typed SDK exceptions. What is being missed?",
          options: ["Streamed responses report their status only once the stream closes, so the metric lags rather than misreports", "Over SSE an error can occur after the API already returned 200, so it never appears as an HTTP status", "Streaming responses always return 200 and encode the real status in a trailing header the metric ignores", "The SDK retries mid-stream failures silently, so the failures are absorbed rather than surfaced", "Truncation is reported as a 504 that the metric groups with successes because the body parsed cleanly"],
          answer: 1,
          explanation: "When receiving a streaming response over server-sent events, an error can occur after the API has returned a 200. In that case error handling does not follow the standard mechanisms at all: there is no failing status code and no typed exception to catch, because the request already succeeded at the HTTP layer. Mid-stream errors arrive as error events inside the stream, so a consumer that only inspects status codes will record those failures as successes.",

          references: [

        { id: "d2-37", domain: "d2", topic: "software-engineering-foundations",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A team has capacity to hand-grade about forty eval cases to a very high standard, or to write six hundred cases gradable automatically with slightly noisier signal. It wants the set that will actually catch a regression before release. Which does the guidance favour, and why?",

        { id: "d2-55", domain: "d2", topic: "claude-application-design",
          difficulty: "standard", sourceTier: "course",
          question: "A team compares two platforms using published latency figures measured from the provider's own benchmarking region, and selects the faster one. Users in the customer's region report the opposite experience after launch. What should the comparison have measured?",

        { id: "d3-4", domain: "d3", topic: "claude-code-operation",
          difficulty: "standard", sourceTier: "course",
          question: "After the nightly job hung on a confirmation prompt, a Kestrel tools engineer proposes running the pipeline in bypass mode so nothing can ever block on input again. Studio deny rules and hooks would still be in force, but the ordinary safety prompts and one additional file-system safeguard would be gone — on a runner that has the live physics-engine checkout mounted. What protection does bypass mode remove that other permission modes retain?",
          options: ["Deny rules from project settings, which stop applying once prompts are turned off for the session", "The requirement that a plan be approved before the agent moves from exploring to writing", "The protected-path guard, on top of every safety prompt between the agent and your live files", "Hook execution, since a hook that blocks a call would reintroduce the prompt the mode removes", "The record of tool calls, since nothing is surfaced to a person for approval any more"],

        { id: "d3-5", domain: "d3", topic: "claude-code-operation",
          difficulty: "standard", sourceTier: "course",
          question: "A Kestrel designer wants Claude Code to work through the studio's loot-table JSON files in her local checkout — reindenting them and renaming a handful of gameplay-script fields — without stopping to confirm each of the roughly two hundred files. Arbitrary shell commands, writes outside the repository, and the protected engine directories must still require review. Which case is the acceptEdits permission mode designed to support?",

          answer: 3,

        { id: "d3-6", domain: "d3", topic: "claude-code-operation",
          difficulty: "standard", sourceTier: "course",
          question: "Onboarding a new Brightline client, a consultant runs Claude Code's init command against the unfamiliar codebase and gets a starter CLAUDE.md. The draft correctly spots the two-space indentation and the alphabetized imports, but it also guesses at a release process the client abandoned last year, and it says nothing about the undocumented rule that migration files are never edited by hand. How should maintainers treat the generated file before relying on it?",
          options: ["As final, since it was generated from the very codebase it will be loaded into every session for", "As a scratch file, since durable conventions belong in scoped rules files instead", "As an initial baseline to validate, then refine down to the rules that actually change prompt outcomes", "As a starting point to extend with every new instruction the team discovers over time", "As onboarding documentation, kept separate from the constraints the agent must follow"],

        { id: "d3-7", domain: "d3", topic: "claude-code-operation",
          difficulty: "hard", sourceTier: "course",
          question: "A team is deciding whether Claude Code is the right tool for a piece of work, rather than which mode to run it in. The task is a one-line constant change in a file the engineer wrote yesterday and fully understands. What does the cost, complexity, and risk framing suggest?",
          options: ["Use Claude Code in its most permissive mode, since a one-line change carries little risk whichever tool makes it", "The overhead of exploration and planning is not repaid by a change the engineer can already make directly", "Use Claude Code in plan mode, since planning is cheap and produces a record of the change for review", "Use Claude Code with a subagent, so the main session stays free for the larger task the constant supports", "Claude Code is the right tool for any repository change, since consistency of tooling outweighs per-task overhead"],

        { id: "d4-1", domain: "d4", topic: "debugging-and-error-handling",
          difficulty: "hard", sourceTier: "course",
          question: "With constrained decoding switched on, Verity assumed every successful HTTP response could be parsed straight into an extraction record. A batch of densely annotated oncology forms instead produced incomplete, nonconforming content, and the pipeline had no branch for it — it simply re-sent the same form and prompt and got the same failure. Before blaming an unsupported schema or silent fallback, which explanation should the error path check first?",
          options: ["The schema contained an unsupported keyword, so the API accepted it but silently disabled constrained decoding", "The model refused, or generation stopped at max_tokens, before the schema-constrained object completed", "The selected model supports schema validation only for tool arguments, not final response content", "A transient grammar-cache miss caused the request to fall back to ordinary JSON generation", "Streaming divided one valid object across events, and the SDK returned only the final event as the response"],

        { id: "d4-2", domain: "d4", topic: "debugging-and-error-handling",
          difficulty: "standard", sourceTier: "course",
          question: "Lumen Labs' warehouse query tool collapses every failure into the same generic error string, so during a release-metrics run the agent cannot tell a malformed query from a missing authorization, a rate limit, or a temporarily overloaded cluster — and it retries all four identically. The team is rebuilding the retry policy to repeat only failures likely to succeed unchanged after waiting. Which pair of status codes is retriable?",

        { id: "d4-3", domain: "d4", topic: "debugging-and-error-handling",
          difficulty: "standard", sourceTier: "course",
          question: "On top of the tool's own retries, Lumen Labs wrapped every warehouse SDK call in a three-attempt loop, not realising the SDK already retries transient failures with backoff. When the cluster went down during the Thursday release cut, one logical metrics query turned into nine network attempts and the agent kept hammering the warehouse through the outage. Why is stacking the two retry layers risky unless one budget is adjusted?",

        { id: "d4-5", domain: "d4", topic: "debugging-and-error-handling",
          difficulty: "standard", sourceTier: "course",

        { id: "d5-1", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "course",
          question: "Calder Freight budgeted its migration runs from the latest instruction and the generated answer alone, and the first invoice came in several times higher. One audit turn had queried two decades of transaction history in a single call, and appending that raw result left almost no room for the migration reasoning the same turn was supposed to produce — alongside the system instructions, the running history, and forty tool definitions already riding on every request. Which content is counted toward both token cost and the context-window limit?",
          options: ["User and assistant messages plus the final response, while system and tool content are billed separately", "All tokens the model processes or generates, including system instructions, history, and tool content", "Only uncached input documents and generated text, since cache reads do not occupy the context window", "Text content in messages and XML tags, but not JSON tool definitions or tool results", "Only content sent in the messages array, because tools and system instructions use separate request fields"],

        { id: "d5-2", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "course",
          question: "On Northwind Regional's busiest snowstorm day, a disruption summary passes input validation because the prompt plus the seating-manifest payload still fits the context window. Generation then runs long enough that input and output together exhaust the window mid-investigation, before a single passenger is rebooked. The team needs to tell this apart from an oversized request rejected before generation ever starts. What response behavior should it expect?",

        { id: "d5-3", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "course",
          question: "A production classifier sets a non-default temperature to make outputs more repeatable. After moving to a newer Claude model, identical requests fail validation rather than becoming more deterministic. The team must preserve the classification behavior without relying on a sampling parameter the model no longer accepts. What changed, and which control should replace that lever?",
          options: ["Temperature is capped per model tier, so the value has to be raised into the supported range", "Temperature moved into the output configuration, so the same value works once it is relocated", "Sampling parameters are rejected whenever reasoning is enabled, so disabling reasoning restores the lever", "The newest models reject non-default sampling parameters, and behavior is steered through prompting", "Temperature applies only to streamed requests, so the parameter is invalid on a single-shot call"],
          answer: 3,
          explanation: "Sampling controls are model-dependent, and the newest Claude models do not accept non-default sampling parameters: supplying one is an error, and behavior is steered through prompting instead. Even where temperature is accepted, a low value makes output more repeatable without guaranteeing identical results across calls, which is why tests assert on properties that must hold rather than on exact text.",
          docsNote: "Doc detail named in the modules: setting temperature, top_p, or top_k on those models returns a 400 error. Confirm current parameter support in the API reference at build time, since this behavior changed between model generations.",
          references: [

          ] },
        { id: "d5-4", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A federated-query platform sizes its request budget from the model's context window alone and assumes any request that validates can also return a complete answer. A long synthesis over several stable sources is accepted by the API, runs, and then comes back cut off partway through the final report, even though the team's own token count shows the conversation nowhere near the window. What distinction does the team need to make?",
          options: ["The context window is the cap on input only, so generated text is limited by a separate quota that is not counted against it", "The context window is the total budget for the request, and maximum output is a separate, smaller cap on a single response", "The context window and the maximum output are the same ceiling, so a truncated response always means the window was exhausted", "Maximum output applies only to streamed responses, so buffering the response removes the limit that truncated the report", "The maximum output scales with the context window, so a model with a larger window always has a proportionally larger response budget"],
          answer: 1,
          explanation: "A model publishes two different ceilings. The context window is the total budget for everything the model processes, including the response it generates. Maximum output is a separate and smaller cap on what one response may produce. A request can therefore sit comfortably inside the window and still be truncated because generation reached the output cap, which is a different failure from an oversized request rejected before generation. The two do not move together either: the model with the larger window is not automatically the one with the larger response budget.",
          sourceScenario: { n: 15, title: "Enterprise Data Platform with Federated Queries" },
          references: [
            { type: "local", href: "module-1.html#context-window-and-maximum-output-are-two-separate-ceilings", label: "Module 1 — Context window and maximum output are two separate ceilings" },
            { type: "web", href: "https://platform.claude.com/docs/en/models/overview", label: "Anthropic docs — Models overview" }
          ] },
        { id: "d5-5", domain: "d5", topic: "llm-fundamentals",
          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A team carries forward a capacity spreadsheet built against an older model generation, which converted its document corpus to tokens at roughly 750k words per million tokens. Running the same corpus on a current model, ingestion jobs start overflowing well before the spreadsheet predicts, and nothing about the documents has changed. What explains the gap?",
          options: ["Tool definitions and system instructions were excluded from the original estimate, which is the entire source of the shortfall", "The tokenizer changed, so the same million tokens now holds noticeably fewer words than the older estimate assumed", "Long-context requests are billed and counted differently above a threshold, which reduces the usable window", "The newer model reserves part of the context window for reasoning, leaving less room for document text", "Unicode-heavy documents are rejected by the newer tokenizer and silently re-encoded at a higher token cost"],
          answer: 1,
          explanation: "The tokenizer introduced with Claude Opus 4.7 fits roughly 555k words into 1M tokens, where models predating it fit roughly 750k. A capacity estimate written against an older model therefore over-counts how much text will fit on a current one. The practical rule is that a token budget carried forward across a model generation must be re-measured rather than scaled, because the words-per-token ratio is a property of the tokenizer and not a constant.",
          sourceScenario: { n: 15, title: "Enterprise Data Platform with Federated Queries" },
          references: [
            { type: "local", href: "module-1.html#tokens-are-not-words-and-the-ratio-moved", label: "Module 1 — Tokens are not words, and the ratio moved" },
            { type: "web", href: "https://platform.claude.com/docs/en/models/overview", label: "Anthropic docs — Models overview" }
          ] },
        { id: "d5-6", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A regulated delivery team wants one part of its agent to answer from the model's own knowledge, with no retrieval step, and needs to state in the design document the date through which that knowledge can be relied on. The model's published specification lists two dates several months apart. Which one belongs in the design document, and why?",
          options: ["The training data cutoff, because it is the later date and therefore the more complete description of what the model saw", "The reliable knowledge cutoff, the date through which the model's knowledge is most extensive and dependable", "Whichever date is closer to the model's release, since the two figures converge once a model reaches general availability", "The training data cutoff, because the reliable knowledge cutoff describes only the evaluation set used during testing", "Either date, since the difference between them affects billing tiers rather than what the model actually knows"],
          answer: 1,
          explanation: "Models publish a training data cutoff and a reliable knowledge cutoff, and they are not the same thing. The training data cutoff is the broader range of data the model saw; the reliable knowledge cutoff is the earlier date through which that knowledge is most extensive and dependable. When a design depends on the model knowing something without retrieval, the reliable knowledge cutoff is the date to plan against. Taking the later figure because it looks more generous is exactly the mistake the two-date distinction exists to prevent.",
          sourceScenario: { n: 11, title: "Regulated Agent Delivery" },
          references: [
            { type: "local", href: "module-1.html#reliable-knowledge-cutoff-is-not-the-training-data-cutoff", label: "Module 1 — Reliable knowledge cutoff is not the training data cutoff" },
            { type: "web", href: "https://platform.claude.com/docs/en/models/overview", label: "Anthropic docs — Models overview" }
          ] },
        { id: "d5-7", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A developer-productivity platform migrates a service from a model where reasoning depth was set with a fixed token budget to a current model. The team wants to keep tuning how deeply the model reasons and is deciding what to send. What should it expect from the current model?",
          options: ["The fixed reasoning budget still applies but is now capped at a fraction of max_tokens rather than set freely", "Reasoning is adaptive and steered by an effort setting; the manual budget mode is no longer accepted", "Reasoning depth is fixed per model and cannot be tuned, so depth changes require selecting a different model", "The fixed budget is honoured when supplied and ignored otherwise, so leaving it in place is harmless", "Reasoning depth follows temperature, so the migration should map the old budget onto a temperature value"],
          answer: 1,
          explanation: "Adaptive thinking lets the model decide how much to think, steered by the effort parameter, and it is always on for some current models. The manual mode — thinking type enabled plus a fixed budget_tokens allocation — is deprecated on Claude Opus 4.6 and Claude Sonnet 4.6 and is not accepted on later models. Leaving the old parameter in a migrated request is not harmless: on the models that removed it, sending it returns an error rather than being quietly ignored.",
          docsNote: "Doc note: the exact per-model behaviour differs — some models reject the old thinking mode outright, and on several current models thinking cannot be disabled at all. Confirm the target model's specification before migrating.",
          sourceScenario: { n: 13, title: "Developer Productivity Platform" },
          references: [
            { type: "local", href: "module-1.html#adaptive-thinking-replaced-the-manual-thinking-budget", label: "Module 1 — Adaptive thinking replaced the manual thinking budget" },
            { type: "web", href: "https://platform.claude.com/docs/en/api/errors", label: "Anthropic docs — Claude API errors" }
          ] },
        { id: "d5-8", domain: "d5", topic: "llm-fundamentals",
          difficulty: "standard", sourceTier: "anthropicDocs",
          question: "A claims-processing API sends an identical request body to two different current models as part of a comparison, setting no reasoning parameters at all. The two responses differ noticeably in how much the model reasoned before answering, and the team is trying to work out what it configured differently. What is the most likely explanation?",
          options: ["Reasoning depth varies randomly between models unless an explicit effort value pins it, so the difference carries no information", "Each model carries its own default effort, so an unconfigured request reasons to different depths on different models", "The larger context window on one model automatically allocates a proportionally larger share to reasoning", "Reasoning defaults follow the usage tier, so the two models drew different defaults from the organization's tier", "Omitting the reasoning parameters disables reasoning entirely, so any observed difference must come from sampling"],
          answer: 1,
          explanation: "Each model ships its own default effort setting. Two models given the identical request with no effort specified can therefore reason to different depths before anyone configures anything. This is why a model comparison that leaves effort unset is not actually comparing like with like, and why the effort parameter is worth setting explicitly whenever the comparison is meant to isolate model capability.",

          options: ["The synchronous Messages API in a tight loop over all 5,000 records, since looping already spreads the requests over time", "The Message Batches API, trading a non-deterministic completion window for lower per-request cost on offline work", "Streaming responses for each record, since streaming reduces the total tokens billed for a large batch of similar requests", "The synchronous API with disable_parallel_tool_use set, since serializing calls is the recommended way to cut batch cost", "The Message Batches API, since it guarantees results within a fixed and predictable turnaround measured in minutes"],

          question: "A claims-processing API starts returning HTTP 429 with error type rate_limit_error. The client's retry layer backs off and retries as designed, but every attempt fails identically and the response carries no retry-after header. Traffic volume has not changed and the same requests succeeded an hour earlier. What should the team check first?",
          options: ["Whether the workspace rate limit was lowered below the organization limit, which suppresses the retry-after header", "Whether the organization reached its usage tier's monthly spending cap, which returns a 429 that retrying cannot clear", "Whether the request exceeded the endpoint's maximum byte size, which is reported as a rate limit on the direct API", "Whether an acceleration limit was triggered, which withholds retry-after until traffic returns to its previous level", "Whether the API key expired, since an expired key is reported as a rate limit rather than an authentication failure"],

          question: "A batch ingestion job dispatches its whole queue at once at the top of each minute and receives rate limit errors, even though its total request count for that minute sits well under the organization's per-minute ceiling. Spreading the same requests evenly across the minute removes the errors. Why does the burst fail?",
          options: ["Per-minute limits are enforced from the first request of each clock minute, so a burst at the boundary spans two windows", "Capacity replenishes continuously via a token bucket, so a burst can exhaust capacity before it refills", "Requests arriving in the same millisecond are deduplicated, and the discarded duplicates are reported as limit errors", "The limit applies to concurrent in-flight requests rather than to requests per minute, which a burst exceeds immediately", "Bursts trigger the acceleration limit, which applies only to organizations that have recently changed usage tier"],

          question: "A knowledge gateway sends a large, stable policy corpus as a cached prefix ahead of each short user question. Its throughput against the input-tokens-per-minute limit is far higher than the raw total input would suggest, and the team wants to understand which parts of the request are actually being metered. On most current models, which token counts are charged against ITPM?",

        { id: "d5-29", domain: "d5", topic: "model-selection-tradeoffs",

        { id: "d5-30", domain: "d5", topic: "model-selection-tradeoffs",
          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A data platform wants most of its token spend billed at a lower rate while keeping frontier capability where it matters. Two multi-model shapes are on the table: one where a cheaper model handles the work and hands genuinely hard decisions up to a more capable model, and one where a capable model plans and hands bulk work down to cheaper workers. What distinguishes them?",

        { id: "d5-31", domain: "d5", topic: "cost-and-token-management",
          difficulty: "standard", sourceTier: "course",
          question: "An application repeatedly sends the same long system instructions and tool definitions, followed by a different user request each turn. The team wants the Messages API to reuse processing for the stable prefix while leaving later content uncached. How should the request identify the cache boundary, and what content does that marker cover?",
          options: ["Set a global caching flag in the client configuration; it applies uniformly to every request the client sends", "Add a cache_control field of type ephemeral to the last block to cache; everything up to it is cached", "Add a cache_control field to the first block of the request; everything after that block is cached", "List the blocks to cache by index in a top-level cached_blocks array attached to the request", "Set ttl on the system prompt; the API infers which surrounding blocks are stable enough to cache"],
          answer: 1,
          explanation: "You turn on caching by marking a breakpoint: a cache_control field of type ephemeral placed on the last block you want cached, which caches everything up to and including that block. You can place up to four such breakpoints, and the request is processed in a fixed order — tools, then system prompt, then messages — so a breakpoint after the tools caches the tool definitions while leaving the messages dynamic.",
          docsNote: "Doc note: caching only applies above a minimum prefix length (1,024 tokens for most current models) — shorter prompts see no benefit even with a breakpoint set.",
          references: [
            { type: "local", href: "module-3.html#prompt-caching-paying-once-for-reusable-requests", label: "Module 3 — Prompt caching: paying once for reusable requests" }
          ] },
        { id: "d5-32", domain: "d5", topic: "cost-and-token-management",
          difficulty: "standard", sourceTier: "course",
          question: "A workload sends the same long system prompt and tool schema on every call, but consecutive calls in the same session can be twenty minutes apart. Under the default cache settings, what happens?",
          options: ["The cache never expires between calls, so every call after the first reads from the cache at the discounted rate", "The five-minute default window expires before the next call, so each call pays the write cost again", "The cache automatically extends its lifetime whenever the same account sends another request within the same day", "The API rejects the breakpoint because twenty minutes exceeds the maximum interval allowed between cached calls", "The cache is preserved because it is keyed to the session, not to a fixed time window"],
          answer: 1,
          explanation: "The default cache lifetime is five minutes from the last read. A twenty-minute gap between calls exceeds that window, so the cache expires and the next call writes the prefix again instead of reading it — paying the write premium with no read discount. Setting a one-hour ttl on the breakpoint fits this exact gap.",
          references: [
            { type: "local", href: "module-4.html#prompt-caching-reusing-the-work-already-done-on-a-stable-prefix", label: "Module 4 — Prompt caching: reusing the work already done on a stable prefix" }

        { id: "d5-33", domain: "d5", topic: "cost-and-token-management",
          difficulty: "standard", sourceTier: "course",
          question: "Because each Calder Freight audit turn assembles a different slice of migration history plus whatever the warehouse returns, character estimates have stopped predicting which requests will fit — the two-decade transaction query looked ordinary until it arrived. The team wants to evaluate the exact pending Messages API body before paying for inference or discovering the problem as a context-window error mid-migration. How can it measure context pressure in advance?",

          answer: 2,
          explanation: "The token-counting endpoint takes the same request body as a messages call and returns the token count without running inference. Use it in development to check that context-budget assumptions hold against real tool outputs rather than short test fixtures, and in production to gate requests that would exceed the window before they error. Characters-per-token averages are model-dependent and are not a substitute for a measurement.",

          ] },
        { id: "d5-34", domain: "d5", topic: "cost-and-token-management",
          difficulty: "hard", sourceTier: "course",
          question: "A workload can cache a long prefix, but writing that prefix costs more than ordinary input while later cache reads cost much less. One workload reuses the prefix repeatedly within its lifetime; another changes or expires it before reuse. Given those billing mechanics, when does prompt caching actually reduce total spend?",
          options: ["When the cached prefix changes rarely, since a write is billed at the same rate as ordinary input", "When the prefix is short, since the write premium scales with the number of tokens stored", "When the breakpoint sits after the user message, so the whole request including the question is reused", "When reads outnumber writes, since a write costs a premium over input and a read only a fraction", "Whenever caching is left on, since the system amortizes each write across every later request"],
          answer: 3,
          explanation: "Cache writes are billed at a premium over base input tokens while cache reads cost a fraction of standard input, so the economics only work when reads outnumber writes. That is why caching fits long, stable, frequently reused prefixes such as a fixed system prompt or a large tool schema, and why a prefix reused once an hour under the default lifetime pays the write cost again for no read benefit.",
          docsNote: "Doc detail named in the modules: writes are billed at 1.25x base input for the five-minute lifetime and 2x for the one-hour option, while reads cost roughly 0.1x. Confirm the current multipliers and the minimum cacheable prefix length before modelling cost.",

        { id: "d5-35", domain: "d5", topic: "cost-and-token-management",
          difficulty: "hard", sourceTier: "course",
          question: "A support agent considers caching a long prefix containing the current escalation policy. The token savings are attractive and the prefix clears the minimum length, but policy changes during the cache lifetime would leave later requests using an older version. What criterion should determine whether this dynamic prefix is safe to cache?",
          options: ["Whether the prefix is long enough to meet the model's minimum cacheable-token threshold", "Whether the application can tolerate the cached policy content going stale for the cache lifetime", "Whether the system uses explicit breakpoints instead of automatic prompt caching", "Whether the current request has fewer output tokens than the cached prefix has input tokens", "Whether the next request arrives within the five-minute default lifetime"],
          answer: 1,

        { id: "d5-36", domain: "d5", topic: "cost-and-token-management",
          difficulty: "hard", sourceTier: "anthropicDocs",
          question: "A knowledge gateway is throughput-bound rather than cost-bound: it sits inside its budget but keeps hitting the input-tokens-per-minute ceiling during business hours, and a rate limit increase has not yet been granted. An engineer proposes prompt caching, and a colleague objects that caching only reduces the bill and cannot change how much traffic the service can push. Who is right, and why?",

            { type: "web", href: "https://platform.claude.com/docs/en/api/rate-limits", label: "Anthropic docs — Rate limits" }

        { id: "d6-2", domain: "d6", topic: "context-engineering",
          difficulty: "standard", sourceTier: "course",
          question: "A support system answers some questions by retrieving one ranked set of chunks from a stable index. Other questions require forming follow-up queries, examining intermediate evidence, and searching again before synthesis. What fundamental difference separates the classical RAG path from the agentic-search path?",
          options: ["Classical RAG only works on text, while agentic search can retrieve from images and structured data as well", "Timing of retrieval: classical RAG matches a prebuilt index; agentic search searches at the moment of need", "Classical RAG requires a model call to retrieve, while agentic search retrieves without invoking the model at all", "Agentic search is only available inside Claude Code, while classical RAG is available only through the Messages API", "Classical RAG returns exact document matches, while agentic search always returns a summarized paraphrase"],
          answer: 1,
          explanation: "Both approaches find a relevant slice of material and generate from it; the difference is timing. Classical RAG does the indexing work upfront — chunking, embedding, and storing before any question arrives — so a query matches against a prebuilt index. Agentic search skips the upfront index and has the model search, fetch, and read on demand at the moment the question is asked.",
          references: [

        { id: "d6-3", domain: "d6", topic: "context-engineering",
          difficulty: "standard", sourceTier: "course",
          question: "A Claude Code environment connects to several MCP servers containing many tools, but most tasks use only a small subset. Loading every definition into every request would consume context before any work begins. What default mechanism limits that upfront cost while still allowing the needed tools to be found?",

        { id: "d6-4", domain: "d6", topic: "context-engineering",
          difficulty: "hard", sourceTier: "course",
          question: "Halverson Supply keeps reserve_inventory and check_location_inventory apart with an exclusion condition that says only reserve after a location check ran earlier in this conversation. On long picking shifts the client began trimming turns older than twenty messages to stay inside the window, and reservation errors climbed without a single schema change or raised exception. Why?",

          answer: 1,

          difficulty: "standard", sourceTier: "course",
          question: "Calder Freight indexes its vendor database documentation so the migration agent can look up connection-pool and isolation-level guidance mid-run. Indexed one sentence at a time, a retrieved line names a pool ceiling without saying which engine version it applies to; indexed a chapter at a time, the pooling guidance arrives buried among replication and backup material and stops ranking well against the query at all. What failure occurs at each end of the chunk-size decision?",
