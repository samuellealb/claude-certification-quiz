<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthropic Developer Foundation Study Quiz</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --panel: #ffffff;
        --border: #e3e5ea;
        --border-strong: #c8cdd6;
        --text: #14161a;
        --muted: #6b7280;
        --muted-2: #9aa1ac;
        --accent: #2563eb;
        --accent-bg: #eef4ff;
        --accent-border: #93b4f5;
        --good: #16a34a;
        --good-bg: #eafbf1;
        --bad: #dc2626;
        --bad-bg: #fdecec;
        /* fixed (non-theme) fills paired with white text; kept dark enough for >=4.5:1 contrast against white in both themes */
        --accent-solid: #1d4ed8;
        --good-solid: #15803d;
        --bad-solid: #b91c1c;
        --radius: 10px;
      }

      /* Accent is deliberately brighter than light-mode blue so text/icons drawn in
         --accent stay readable when placed on top of --accent-bg (selected states). */
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --panel: #181b21;
        --border: #2a2e37;
        --border-strong: #3d434f;
        --text: #e8eaed;
        --muted: #a7aeb8;
        --muted-2: #7d8590;
        --accent: #86b6ff;
        --accent-bg: #16223d;
        --accent-border: #4d75b8;
        --good: #4ade80;
        --good-bg: #10281c;
        --bad: #f87171;
        --bad-bg: #2f1414;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .theme-toggle:hover { border-color: var(--accent-border); }

      .shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 600;
        margin-bottom: 14px;
      }

      .title {
        font-size: clamp(1.6rem, 3vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }

      .lede {
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
        max-width: 760px;
        margin: 0 0 32px;
      }

      .lede strong { color: var(--text); font-weight: 600; }

      .domain-bars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 22px 0;
        margin-bottom: 36px;
      }

      .domain-bar-card {
        padding: 0 20px;
        border-left: 1px solid var(--border);
      }

      .domain-bar-card:first-child { border-left: none; }
      .domain-bar-pct { font-size: 1.5rem; font-weight: 700; }
      .domain-bar-name {
        font-size: 0.78rem;
        color: var(--muted);
        margin: 4px 0 12px;
        line-height: 1.4;
        min-height: 2.6em;
      }
      .domain-bar-track {
        height: 4px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .domain-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }

      .section { margin-bottom: 30px; }
      fieldset.section-group {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .section-label {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      legend.section-label { width: 100%; padding: 0; }
      .section-note {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--muted-2);
        font-size: 0.78rem;
      }
      .section.disabled { opacity: 0.45; pointer-events: none; }

      .option-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .option-grid.chips { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

      .option-card {
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel);
        /* buttons don't inherit color from the page by default; without this the text fell back to the browser's default (near-black) button color */
        color: inherit;
        border-radius: var(--radius);
        padding: 14px 16px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .option-card:hover { border-color: var(--border-strong); }
      .option-title { display: block; margin: 0 0 4px; font-size: 0.95rem; font-weight: 600; }
      .option-description { display: block; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
      .option-card.selected { border-color: var(--accent-border); background: var(--accent-bg); }

      .start-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 40px;
        margin-bottom: 40px;
      }
      .btn {
        border-radius: 8px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        padding: 12px 22px;
        font-size: 0.92rem;
      }
      .btn-primary { background: #14161a; color: #fff; }
      .btn-primary:hover { background: #26282e; }
      .btn-secondary { background: #fff; border-color: var(--border-strong); color: var(--text); }
      .start-note { color: var(--muted-2); font-size: 0.78rem; line-height: 1.6; max-width: 420px; }

      [data-theme="dark"] .btn-primary { background: #e8eaed; color: #14161a; }
      [data-theme="dark"] .btn-primary:hover { background: #ffffff; }
      [data-theme="dark"] .btn-secondary { background: var(--panel); }

      .exam-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-tag.inferred { color: #7a5400; border-color: #f0d99b; background: #fff8e6; }
      .badge-tag.judgment { color: #7c3aed; border-color: #ddd0fb; background: #f6f1fe; }
      .badge-tag.docsNote { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }

      [data-theme="dark"] .badge-tag.inferred { color: #f3d38a; border-color: #6b5a2c; background: #33290f; }
      [data-theme="dark"] .badge-tag.judgment { color: #cbb8ff; border-color: #4b3d7a; background: #241b3d; }

      .timer {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .timer.low { color: var(--bad); border-color: var(--bad); }

      .progress-track {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .progress-fill { height: 100%; background: var(--accent); }

      .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 0 0 20px; }

      .answer-list { display: grid; gap: 10px; margin-bottom: 20px; }
      .answer-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--panel);
        cursor: pointer;
        font-size: 0.94rem;
        line-height: 1.5;
      }
      .answer-row:hover:not(.locked) { border-color: var(--border-strong); }
      .answer-row:focus-visible,
      .option-card:focus-visible,
      .btn:focus-visible,
      .question-text:focus-visible {
        outline: 2px solid var(--accent-solid);
        outline-offset: 2px;
      }
      .answer-row.selected { border-color: var(--accent-border); background: var(--accent-bg); }
      .answer-row.correct { border-color: #a7e2bc; background: var(--good-bg); }
      .answer-row.wrong { border-color: #f3b7b5; background: var(--bad-bg); }
      .answer-row.locked { cursor: default; }

      [data-theme="dark"] .answer-row.correct { border-color: #2f6b45; }
      [data-theme="dark"] .answer-row.wrong { border-color: #7a3c3a; }
      .answer-letter {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1.5px solid var(--border-strong);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--muted);
      }
      /* Filled (not outline) so the letter stays legible against --accent-bg in both themes; uses the *-solid tokens, not --accent/--good/--bad, because those are tuned to sit on dark panels and are too light for white text on top of them. */
      .answer-row.selected .answer-letter { border-color: var(--accent-solid); background: var(--accent-solid); color: #fff; }
      .answer-row.correct .answer-letter { border-color: var(--good-solid); background: var(--good-solid); color: #fff; }
      .answer-row.wrong .answer-letter { border-color: var(--bad-solid); background: var(--bad-solid); color: #fff; }

      .check-row { display: flex; gap: 10px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .explanation-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.88rem;
        line-height: 1.6;
        color: #1e293b;
        margin-bottom: 12px;
      }

      [data-theme="dark"] .explanation-box { background: #1f232b; color: #d7dbe0; }
      [data-theme="dark"] .docs-note-box { background: #1f232b; }
      .explanation-label {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .explanation-box.is-correct .explanation-label { color: var(--good); }
      .explanation-box.is-wrong .explanation-label { color: var(--bad); }
      .docs-note-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 20px;
      }

      .nav-row { display: flex; justify-content: space-between; gap: 12px; }

      .score-wrap { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; margin-bottom: 32px; }
      .score-ring {
        --pct: 0;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: conic-gradient(var(--accent) calc(var(--pct) * 3.6deg), var(--border) 0);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .score-ring span {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 700;
      }
      .domain-breakdown { display: grid; gap: 10px; flex: 1; min-width: 240px; }
      .breakdown-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
      .breakdown-row .name { width: 190px; color: var(--muted); flex-shrink: 0; }
      .breakdown-row .track { flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
      .breakdown-row .fill { height: 100%; background: var(--accent); }
      .breakdown-row .num { width: 46px; text-align: right; font-weight: 600; }

      .review-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
      .review-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.78rem;
        color: var(--muted-2);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .review-question { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
      .review-line { font-size: 0.88rem; margin-bottom: 4px; }
      .review-line.correct-line { color: var(--good); }
      .review-line.wrong-line { color: var(--bad); }

      @media (max-width: 720px) {
        .domain-bars { grid-template-columns: repeat(2, 1fr); }
        .domain-bar-card:nth-child(2n) { border-left: none; }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  </head>
  <body>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    <main class="shell" id="app" aria-label="Claude certification study quiz"></main>
    <output id="srStatus" class="sr-only" aria-live="polite" aria-atomic="true"></output>

    <script>
      const srStatus = document.getElementById('srStatus');
      // Clears then re-sets so screen readers re-announce even if the message repeats
      function announce(message) {
        srStatus.textContent = '';
        requestAnimationFrame(() => { srStatus.textContent = message; });
      }

      const THEME_KEY = 'devFoundationPractice.theme.v1';

      function getPreferredTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark' || saved === 'light') return saved;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      }

      applyTheme(getPreferredTheme());
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      const DOMAINS = [
        { id: 'd1', code: 'D1', name: 'Agentic Architecture & Orchestration' },
        { id: 'd2', code: 'D2', name: 'Tool Design & MCP Integration' },
        { id: 'd3', code: 'D3', name: 'Claude Code Configuration & Workflows' },
        { id: 'd4', code: 'D4', name: 'Prompt Engineering & Structured Output' },
        { id: 'd5', code: 'D5', name: 'Context & Reliability' }
      ];

      const BADGE_LABELS = {
        unbadged: 'Unbadged',
        inferred: 'Inferred',
        judgment: 'Judgment call',
        docsNote: 'Docs note'
      };

      const ITEM_BANK = [
        // D1 — Agentic Architecture & Orchestration
        { id: 'd1-1', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'Who actually executes a tool once Claude decides to call it?',
          options: ['The model runtime executes it in Claude\'s context and appends the output', 'Your application runs the tool and returns a matching tool_result to Claude', 'The MCP client forwards it to Anthropic for execution and receives the result', 'The tool provider executes every declared tool as soon as its schema is selected', 'The SDK automatically executes every declared tool once the request is sent, without waiting for Claude to select one'],
          answer: 1,
          explanation: 'Claude only reads the schema, decides which tool fits, and asks your application to call it. Your application is responsible for execution and returning a tool_result. Some SDKs offer a Tool Runner helper that automates this loop for handlers you register, but it still runs your application code, never the model runtime.' },
        { id: 'd1-2', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What breaks if your application never returns a tool_result for a tool_use block?',
          options: ['Claude treats the missing result as an empty success and continues the same turn', 'The loop breaks because the pending tool_use never receives its required tool_result', 'The Messages API replays the tool call after its response timeout expires', 'Claude selects another registered tool that has a compatible input schema', 'The next user message implicitly closes the pending tool call and starts a fresh loop'],
          answer: 1,
          explanation: 'The agent loop is not automatic. If the tool_result step is skipped or malformed, Claude never gets the data back and the loop breaks.' },
        { id: 'd1-3', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: 'Under the worst-case-cost framework, when must a human review gate exist regardless of the active permission mode?',
          options: ['When the agent reports low confidence, even if the proposed action is read-only and reversible', 'When the permission mode would normally prompt, because review gates mirror the mode\'s default behavior', 'Whenever an action is difficult to undo or can affect a sensitive or protected path without review', 'Before any implementation begins, after which the approved plan serves as review for all later actions', 'Whenever the action uses more than one tool, because orchestration increases operational risk'],
          answer: 2,
          explanation: 'The gate is placed by asking what the worst outcome is if the action runs unchecked. High-cost, hard-to-undo, or sensitive-path actions need a human gate no matter what mode is active.' },
        { id: 'd1-4', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is the default order of Claude Code\'s workflow on an unfamiliar task?',
          options: ['Plan from the request, code the proposed change, then explore only if validation fails', 'Explore the unfamiliar codebase first, form a grounded plan, and then implement the proposed change', 'Draft the implementation, inspect neighboring code, then revise the plan before validation', 'Explore and code in parallel, then document the plan after the behavior is working', 'Plan the requested behavior, explore only its target file, then code without further approval'],
          answer: 1,
          explanation: 'Claude Code explores the codebase first, proposes a plan, and only writes or executes changes once the plan is approved.' },
        { id: 'd1-5', domain: 'd1', difficulty: 'standard', badge: 'inferred',
          question: 'A task delegated to the built-in Explore subagent ignores a rule defined in the project\'s CLAUDE.md. What is the most likely cause?',
          options: ['Built-in subagents load CLAUDE.md only when the parent explicitly quotes the relevant section in its task', 'Explore and Plan built-in subagents skip CLAUDE.md and repository state to reduce overhead', 'All delegated agents ignore project instructions unless the rule is duplicated in managed settings', 'Explore loads CLAUDE.md but gives its built-in read-only policy higher precedence than project guidance', 'Explore reads project instructions only after its first search, so early actions can miss them'],
          answer: 1,
          explanation: 'The built-in Explore and Plan subagents intentionally skip CLAUDE.md and git status to keep research fast; project rules defined there are not in their context.' },
        { id: 'd1-6', domain: 'd1', difficulty: 'standard', badge: 'inferred',
          question: 'In the systems lifecycle for a Claude application, which phase immediately follows Design?',
          options: ['Requirements', 'Build', 'Test', 'Deploy', 'Operate'],
          answer: 1,
          explanation: 'Choosing the platform, the model, and the trust boundaries is the Design phase. The lifecycle runs Requirements → Design → Build → Test → Deploy → Operate → Iterate, so Design is followed by Build, where the agent, tools, and prompts are written.' },
        { id: 'd1-7', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is a "gate" in the systems lifecycle for a Claude application?',
          options: ['A checklist used to record phase completion after work has already moved forward', 'A decision point that must be cleared before work advances to the next phase', 'A runtime permission rule that determines whether Claude may invoke a particular tool', 'A compliance review added before deployment when regulation applies, but not during earlier phases', 'A rollback boundary that restores the preceding lifecycle phase after a failed deployment'],
          answer: 1,
          explanation: 'A gate is where a regulated engagement keeps control — for example, refusing to move from design to build until a residency requirement is satisfied.' },
        { id: 'd1-8', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What most often determines which deployment platform a Claude workload runs on?',
          options: ['The provider with the lowest projected token cost after prompt caching and batch discounts', 'The customer\'s existing cloud environment, identity model, residency constraints, and compliance agreements', 'The platform whose SDK best matches the application\'s programming language and framework', 'The provider with the newest model snapshot, unless a required region is unavailable there', 'The deployment target used by the reference implementation from which the workload was derived'],
          answer: 1,
          explanation: 'The deployment platform decision is usually shaped by where the customer already trusts and operates — their cloud, identity, and compliance agreements.' },
        { id: 'd1-9', domain: 'd1', difficulty: 'standard', badge: 'docsNote',
          question: 'Why pin a full model snapshot ID instead of a moving alias like "sonnet" in production?',
          options: ['A snapshot keeps token pricing fixed for the lifetime of the deployment, while aliases follow current pricing', 'It prevents an upstream model update from silently becoming an untracked change to production behavior', 'A snapshot preserves prompt-cache entries across schema changes that would invalidate an alias-based cache', 'It allows streaming and tool use to share one model identifier without separate compatibility checks', 'It guarantees the snapshot remains available in every region supported by the moving alias'],
          answer: 1,
          explanation: 'An unpinned deployment makes every upstream model update an untracked change to your output; pinning makes the update a deliberate, reviewable choice.',
          docsNote: 'Doc detail named in the modules: for Claude 4.6 and later, the model ID alone pins to a snapshot; earlier models require the ID plus a date suffix — confirm the current convention before shipping.' },
        { id: 'd1-10', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is an "accelerator" in the context of packaging Claude solutions for reuse?',
          options: ['A deployment profile that routes difficult requests to a higher-capability model tier', 'A packaged solution that lets a future engagement start from a working foundation', 'A managed runtime that scales MCP servers and Claude API calls as one deployment unit', 'A reusable cache of prompts, tool results, and evaluation outputs shared across customer environments', 'A benchmark suite used to identify which model tier completes an engagement fastest'],
          answer: 1,
          explanation: 'An accelerator separates engagement-specific code from the reusable core and exposes the rest as documented, parameterized configuration.' },
        { id: 'd1-11', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: 'A team wants to contribute an entire multi-component customer application to the Claude Cookbook. What is the most likely outcome?',
          options: ['It is accepted if customer-specific configuration is removed and every component has integration tests', 'It stalls in review because the Cookbook favors focused, reviewable patterns over full applications', 'It is redirected unchanged to a dedicated full-application section after licensing and security review', 'It is split during review into independent examples, with maintainers taking ownership of the extracted patterns', 'It is accepted as an accelerator but excluded from Cookbook navigation until independently maintained'],
          answer: 1,
          explanation: 'Matching the contribution to the channel matters: a full application is a mismatch for a repository designed around one clearly reviewable pattern.' },
        { id: 'd1-12', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'Which requirement primarily constrains the deployment infrastructure rather than defining application behavior?',

        { id: 'd3-15', domain: 'd3', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-8', domain: 'd5', difficulty: 'standard', badge: 'docsNote',

        { id: 'd5-9', domain: 'd5', difficulty: 'hard', badge: 'inferred',

        ,{ id: 'd5-10', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-11', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-12', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-13', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-14', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'Some incoming queries are single-fact lookups against a stable corpus; others need several rounds of search across changing sources, and traffic is a genuine mix of both. What is the recommended way to route each query to the right retrieval strategy?',
          options: ['Always use iterative search across rounds, since it is a superset of what a single fetch can answer', 'Always use a static fetch-once index, since adding iteration only increases cost and latency', 'Use one small, cheap model call to classify the query and route it to fetch-once or iterative search', 'Let the retrieval index decide, since a well-organized index automatically shortcuts multi-part questions', 'Ask the user to pick a mode before submitting the query, since the query type is not reliably inferable'],
          answer: 2,
          explanation: 'A cheap classification call is a router: it reads the query and picks the retrieval path. The router earns its cost whenever traffic is genuinely mixed. Defaulting everything to iterative search inflates cost and latency on lookups a single fetch could answer, while defaulting everything to a static index gives shallow answers on questions that need several passes.' },
        { id: 'd5-15', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'An eval shows your current default model failing on the hardest cases in your production traffic, and the cost of a wrong answer on those cases is high. What does this justify, and on what basis?',
          options: ['Stepping up a model tier, using that eval score as the justification rather than a general sense that a bigger model is safer', 'Stepping down a model tier, since a failure on hard cases suggests the current model is already miscalibrated for the task', 'Rewriting the prompt with more few-shot examples first, and only reconsidering the model if that fails to close the gap', 'Switching every request in the system to the most capable available model, regardless of whether other request types were failing', 'Leaving the model choice unchanged and raising the retry budget, since retries can recover an answer the model tier got wrong'],
          answer: 0,
          explanation: 'Step up a tier when an eval shows the current model failing on the hardest cases your traffic contains and the cost of a wrong answer is high. The eval is the instrument in both directions — a model change is promoted on a measured score against your cases, not on a general impression that a larger model is inherently safer.' },
        { id: 'd5-16', domain: 'd5', difficulty: 'recall', badge: 'unbadged',
          question: 'What three metrics should be logged for every call to make a cost or latency problem traceable to a specific step, rather than visible only as a total on the monthly invoice?',

          answer: 1,
          explanation: 'Observability for a Claude system means instrumenting three metrics per call: input and output token usage, latency, and error rate. With those three recorded for every call, a cost or latency problem becomes a row you can sort and trace to a specific step or request type, instead of a mystery on the invoice.' },
        { id: 'd5-17', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'An application wraps all fetched web content in delimiters and instructs the model to treat everything inside them as data, never as commands. Is this sufficient to stop prompt injection?',
          options: ['Yes, because the delimiters give the model a structural marker that separates trusted from untrusted tokens', 'No — delimiters are a soft boundary the model can still be argued out of; the reliable boundary is what the agent is allowed to do, enforced through access control', 'Yes, as long as the delimited content is also passed through a profanity filter before it reaches the model', 'No, because delimiters only work for user-supplied text and have no effect on content fetched from tools', 'Yes, because model training guarantees injected instructions inside delimiters are always refused'],
          answer: 1,
          explanation: 'The model receives one single stream of tokens with no structural marker separating trusted from untrusted content. Delimiters and model-level training reduce risk but remain probabilistic and are not guaranteed — the reliable boundary is not in the wording of the prompt but in what actions and access the agent has, which is why the defense also has to constrain and log consequential actions regardless of what the untrusted content says.' },
        { id: 'd5-18', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: 'A nightly job classifies 5,000 records with no user waiting on the result, and cost matters more than turnaround time. Which pattern fits, and why?',
          options: ['The synchronous Messages API in a tight loop over all 5,000 records, since looping already spreads the requests over time', 'The Message Batches API, since it trades a non-deterministic completion window for a lower per-request cost on offline work', 'Streaming responses for each record, since streaming reduces the total tokens billed for a large batch of similar requests', 'The synchronous API with disable_parallel_tool_use set, since serializing calls is the recommended way to cut batch cost', 'The Message Batches API, since it guarantees results within a fixed and predictable turnaround measured in minutes'],
          answer: 1,
          explanation: 'The Message Batches API is for exactly this shape of work: no user waiting, and cost is the priority. It trades latency for cost — batch processing is non-deterministic and can take time to complete, in exchange for a lower per-token price than the same calls made synchronously. Looping over the synchronous API is not batching: it produces the same number of calls and runs into the same rate limits.' },

        // D1 — Agentic Architecture & Orchestration (expansion)
        { id: 'd1-13', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: "A task's exact steps can be written out in code, its inputs come from a known set, and each step needs its own guardrail. Which pattern fits, and what would the alternative cost here?",
          options: ["A workflow, because an agent would add behavioral complexity and context cost without adding capability", "An agent, because a registered toolset constrains its actions more tightly than branching logic does", "An agent, because enumerated steps are the easiest case for a model to sequence reliably", "A workflow, because model non-determinism makes any model call unsuitable for a step that needs a guardrail", "Either pattern, because the choice only affects cost once traffic reaches production volume"],
          answer: 0,
          explanation: "A workflow is the right call when the steps can be enumerated in code, the inputs are well constrained, and step-level guardrails matter. Reaching for an agent there adds behavioral complexity, expanded context cost, and more failure surface without adding capability. The mirrored mistake also exists: a workflow where the path cannot be enumerated breaks the first time an input falls outside the path." },
        { id: 'd1-14', domain: 'd1', difficulty: 'standard', badge: 'docsNote',

          answer: 1,
          explanation: "Managed Agent sessions are stateful and stored server-side, which is why they are not currently eligible for Zero Data Retention or a HIPAA Business Associate Agreement. A PHI or ZDR requirement rules the path out no matter how well it fits operationally, and the work routes to the Agent SDK or a raw loop on a covered configuration instead. The governing constraint picks the path before convenience gets a say.",
          docsNote: "Doc detail named in the modules: Managed Agents is a public beta whose endpoints require a dated beta header, and its retention and eligibility statements should be re-confirmed against Anthropic's data-retention documentation before committing." },
        { id: 'd1-15', domain: 'd1', difficulty: 'standard', badge: 'docsNote',
          question: "A skill that loads correctly in the Claude Code CLI does nothing when the same project is driven through the Agent SDK. What is the most likely cause?",
          options: ["The SDK strips skill frontmatter, so a skill has to be re-registered as a tool before it can load", "The SDK resolves skills only from an installed plugin, so a project directory is never scanned", "Whether filesystem sources such as skills and CLAUDE.md load is a configuration the SDK expects you to set", "Skills load in the SDK only while the session runs under the same permission mode as the CLI", "The SDK loads skills lazily and discards any whose description did not match the very first prompt"],
          answer: 2,
          explanation: "In the Agent SDK, whether filesystem-based configuration such as CLAUDE.md and skills loads at all is controlled by the setting-sources configuration. The common surprise is a skill that worked in Claude Code doing nothing under the SDK because that configuration was never set, so the source directory was never read. Set it explicitly to the sources you intend rather than relying on a default.",
          docsNote: "Doc detail named in the modules: the key is settingSources in TypeScript and setting_sources in Python, for example the user, project, and local sources to match CLI behavior, or an empty list to run isolated on what you pass programmatically. Confirm current default behavior against the Agent SDK reference at build time." },
        { id: 'd1-16', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: "An agent finishes the work it was asked to do and keeps issuing further tool calls beyond what the request needed. Which part of the loop wiring is missing?",
          options: ["A narrower system prompt, since tool selection quality is what determines when a loop terminates", "A lower retry cap, since the loop reads the remaining retry budget as its stopping criterion", "A human-in-the-loop checkpoint, which is the mechanism that ends a turn once a plan is approved", "An explicit exit condition, since the loop otherwise keeps requesting calls rather than volunteering to stop", "Parallel tool calling turned off, since concurrent calls prevent the loop from recognising completion"],
          answer: 3,
          explanation: "The agent loop runs until it receives a stop condition, so without explicit exit conditions it keeps requesting tool calls beyond what the task requires. Defining when done means done belongs in the wiring rather than being left to the model to volunteer. A scoped system prompt and a review checkpoint improve routing and oversight, but neither is a stopping criterion." },
        { id: 'd1-17', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: "An agent's routing has become erratic since the team registered every tool it might eventually need. What is the recommended correction?",
          options: ["Keep the full tool set and lengthen each description until the overlaps are resolved", "Keep the full tool set but force one call per turn so a wrong choice cannot compound", "Split the tools across several subagents so each one reasons over a smaller surface", "Replace the registered tools with one general-purpose tool that accepts a free-text instruction", "Cut back to the minimum set the task requires and add tools only where a capability gap is confirmed"],
          answer: 4,
          explanation: "Over-tooling is the more common failure in production agents: selection quality degrades as the tool surface grows, and registering tools just in case is what grows it. Start from the minimum set the task requires and add a tool only when a specific capability gap is confirmed. Longer descriptions, serialized calls, and fanning the same surface out across subagents all leave the oversized surface in place." },
        { id: 'd1-18', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: "Which risk does a human-in-the-loop checkpoint placed immediately after the agent's planning step address?",
          options: ["A plan that is wrong in a way that produces the wrong outcome even when every step executes correctly", "An irreversible write reaching a customer system before anyone has seen the value being changed", "A tool result that comes back empty, flagged as an error, or outside expected bounds", "A loop that never terminates because no explicit stopping criterion was ever defined for it", "A context window that fills before the agent has finished the task it was given"],
          answer: 0,
          explanation: "A checkpoint after planning catches an incorrect plan, a medium-risk failure where each step runs exactly as designed and the outcome is still wrong. A checkpoint before a destructive call is what guards irreversible writes, and a checkpoint on unexpected output is what catches error flags, empty results, and out-of-bounds values." },
        { id: 'd1-19', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: "In Anthropic's reported analysis of its orchestrator-worker research system, what accounted for most of the pattern's performance advantage?",
          options: ["A larger effective context, because the lead agent holds every subagent's full transcript at once", "Token usage, because the architecture mainly buys more parallel computation", "The lead agent's model tier, because coordination quality dominates once subtasks are assigned", "Reduced latency, because the compilation step begins before the slowest subagent returns", "Shared memory between subagents, which removes the duplicated reading a single agent would do"],
          answer: 1,
          explanation: "Anthropic's analysis found that token usage accounts for most of the performance variance: the pattern works primarily because it buys more parallel computation, at roughly fifteen times the tokens of a normal chat interaction. That is also why it is a poor fit for tightly coupled work such as coding, where each step depends on the previous one and cannot be explored in parallel." },
        { id: 'd1-20', domain: 'd1', difficulty: 'hard', badge: 'inferred',
          question: "An assistant tested in single long sessions is deployed into many short sessions whose state accumulates, and by the fourth session the injected history fills most of the budget before the first tool call. Which memory scope fits the production shape?",
          options: ["In-context memory on a larger model, since a bigger window absorbs the accumulated history", "Stateless sessions, since state that outgrows one window should not cross a session boundary", "External storage, with history persisted and only the relevant subset injected at session start", "In-context memory plus pruning each turn, since pruning removes accumulated history at no cost", "Summarized memory regenerated every turn, since a fresh summary keeps the window from growing"],
          answer: 2,
          explanation: "Many short sessions carrying state across each boundary is the shape external storage is for: history is written to a database and only the relevant subset is read back at session start. In-context memory is the simplest pattern to write, which is why it fails earliest on this shape, and a stateless design would drop the state the follow-up work depends on. The refactor costs about an hour under production pressure and about twenty minutes as a deliberate design decision." },
        { id: 'd1-21', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: "A team is packaging the eval that proved its agent works so a later engagement can reuse it. What does correct packaging of that asset type require?",
          options: ["The rubric alone, since each new team should assemble a dataset from its own customer's traffic", "A frozen score from the original engagement, so later runs compare against a published number", "The loop structure and system prompt, so the eval can be re-derived from the agent it was written for", "The graded dataset and judge rubric shipped together, with thresholds and dataset paths parameterized", "A report of the last run, since an eval is evidence of past behavior rather than a reusable asset"],
          answer: 3,
          explanation: "An eval suite bundles the graded test set and the judge rubric, and correct packaging ships them together so a new team can run them in its own context. What gets parameterized are the thresholds and dataset paths that change per customer or environment, while the rubric logic, the meaning of the scores, and the pinned baseline get documented. The same suite then becomes the promotion gate at deployment rather than a one-time test." },
        { id: 'd1-22', domain: 'd1', difficulty: 'recall', badge: 'unbadged',
          question: "Beyond code that does one thing, what else makes a contribution something a maintainer can actually verify?",
          options: ["A benchmark against comparable implementations, plus a maintainer already assigned to own it", "A migration guide for existing users, plus the engagement context the code was written for", "Integration tests for every component, plus the customer configuration the code ran against", "A description of the behavior in the submission, since a reviewer reconstructs the rest from the code", "A runnable example, a test that proves the behavior, and a short statement of the assumptions"],
          answer: 4,
          explanation: "The bar is set by what the reviewer has to check. Four things make verification possible: code that does one thing, an example that shows it running so nobody has to build a harness, a test that proves the result without reproducing the reasoning, and a short statement of the assumptions so the first failure is not the maintainer's problem. A written description of the behavior is not a substitute for a runnable example and a test." },
        { id: 'd1-23', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: "A multi-component application scopes every component tightly except one internal service that kept its original broad credentials. How should that be read?",

        // D2 — Tool Design & MCP Integration (expansion)
        { id: 'd2-11', domain: 'd2', difficulty: 'standard', badge: 'unbadged',
          question: "What is the recommended length for a tool description, and what goes wrong at each extreme?",

          answer: 1,
          explanation: "Three to four sentences per tool, covering what it does, when Claude should reach for it, and what it returns, with examples of valid inputs where format matters. Too short and there is not enough signal to distinguish the tool from others, so Claude guesses. Too long and the trigger conditions get buried under detail Claude does not reference at decision time." },
        { id: 'd2-12', domain: 'd2', difficulty: 'hard', badge: 'judgment',
          question: "Two tools do similar things, and each round of disambiguating language has to grow longer to keep them apart. What does that signal?",
          options: ["That the input schemas should diverge, since parameter types are what break a tie between descriptions", "That the exclusion conditions belong in the system prompt, where they apply before selection begins", "That the tools should be merged into one tool with a type parameter rather than separated by more text", "That one tool should be withdrawn and its behavior folded into the surrounding application code", "That parallel tool calling should be disabled so a wrong choice cannot compound within one turn"],
          answer: 2,
          explanation: "Exclusion conditions resolve most wrong-tool selection, but they stop paying off when two tools genuinely overlap and the descriptions have to keep growing to keep them apart. At that point the right move is to merge them into a single tool with a type parameter. Diverging the schemas helps little, because routing weighs name and description first with parameter types only as a secondary signal." },
        { id: 'd2-13', domain: 'd2', difficulty: 'standard', badge: 'inferred',

        { id: 'd2-14', domain: 'd2', difficulty: 'recall', badge: 'unbadged',
          question: "Which MCP configuration scope puts the server definition in a file at the repository root so every clone picks it up?",
          options: ["Local scope, which stores the entry under the current project's path in your personal configuration", "User scope, which stores the definition in your personal settings and applies it across all your projects", "Enterprise scope, which deploys the definition through a centrally managed administrator configuration", "Session scope, which registers the definition for the current session and discards it on exit", "Project scope, which writes the definition to a file committed at the root of the repository"],
          answer: 4,
          explanation: "Project scope writes the server configuration to a file at the repository root, and once that file is committed everyone who clones the repository gets the same server automatically. Local scope keeps a per-project entry in your personal configuration, user scope makes a server available across all of your own projects without sharing it, and enterprise scope pushes servers to the whole organization through managed configuration." },
        { id: 'd2-15', domain: 'd2', difficulty: 'standard', badge: 'unbadged',
          question: "A team connects a broad MCP server but wants only its read-only tools running without a prompt. How is that expressed, and what happens when an allow and a deny rule both match a tool?",
          options: ["Name individual tools in the rules, and a deny on one tool overrides an allow covering the server", "Allow the server as a whole and rely on the model to avoid the write-capable tools it does not need", "Allow the server and add a post-execution hook, since permission rules cannot address a single tool", "Name individual tools in the rules, and the more specific allow rule wins over the broader deny", "Connect the server twice under different names, allowing one instance and denying the other"],
          answer: 0,
          explanation: "A permission rule can name an individual MCP tool by its server and tool name, so an allow on one tool lets it run without a prompt while every other tool on the same server still prompts. Precedence runs deny first, so a deny on a write-capable tool blocks it regardless of an allow rule covering the server, and rule specificity does not reverse that order." },
        { id: 'd2-16', domain: 'd2', difficulty: 'hard', badge: 'docsNote',
          question: "Reaching an MCP server through the API connector, what is the difference between turning a tool off in the toolset configuration and denying it with a permission rule?",
          options: ["Nothing in effect; the toolset setting is the API spelling of the same governance control", "The toolset setting decides whether the model sees the tool at all, while the rule decides whether an exposed tool may run", "The toolset setting blocks execution at the server, while the rule only removes the tool from the model's context", "The toolset setting applies to read-only tools and the rule to write-capable tools on the same server", "The toolset setting delays the definition until first use, while the rule removes it from the request entirely"],
          answer: 1,
          explanation: "The per-tool enabled flag in the toolset is a context-cost and scope control: it lets you register a server while exposing only the tools you want the model to see. A permission rule is a governance control that decides whether a tool the model can already see is allowed to run. The two are often used together, and deferred loading is a third, separate setting that addresses upfront context cost rather than visibility.",
          docsNote: "Doc detail named in the modules: the toolset object also carries a defer_loading boolean inside its default configuration or a per-tool entry, and the connector requires its own dated beta header. Verify the exact field names and header value against the documentation before publishing." },
        { id: 'd2-17', domain: 'd2', difficulty: 'standard', badge: 'unbadged',
          question: "How does Claude Code keep the tool definitions from several connected MCP servers from consuming the context window up front?",
          options: ["It loads every definition once and holds it outside the window for the rest of the session", "It reduces each definition to its name and parameter list until the tool is first invoked", "It defers the definitions by default and uses a search step to load only the tools a task calls for", "It loads definitions from the server with the fewest tools first and stops at the window limit", "It loads definitions only from servers configured at project scope and defers every other scope"],
          answer: 2,
          explanation: "By default Claude Code defers MCP tool definitions rather than loading them upfront, then discovers and loads only the tools the current task needs. An opt-in mode loads definitions upfront while they fit within roughly a tenth of the context window and defers only beyond that limit. Either way, connecting only the servers a task needs is what keeps each request lean, because every connected server adds to the pool of definitions the model has to account for." },
        { id: 'd2-18', domain: 'd2', difficulty: 'standard', badge: 'unbadged',
          question: "An application built on the Claude API needs to reach a local stdio MCP server. What is the constraint?",
          options: ["The connector reaches it once the server is registered at user scope on the calling machine", "The connector reaches it once the stdio transport is upgraded to the legacy event-stream transport", "The connector reaches any server whose tools are allowlisted in the toolset configuration", "The connector supports HTTP-exposed servers only, so a stdio server means managing the client yourself", "The connector reaches it provided the request carries the beta header the connector requires"],
          answer: 3,
          explanation: "Only HTTP-exposed servers are supported through the API's MCP connector. A stdio server runs as a subprocess of its client, so reaching one means managing the MCP client connection yourself through the SDK, or using a client such as Claude Code or Claude Desktop instead. The connector's beta header and its tool allowlisting are separate concerns that do not change the transport limitation." },
        { id: 'd2-19', domain: 'd2', difficulty: 'standard', badge: 'unbadged',
          question: "An API key was committed inline in a shared MCP configuration file. Why is rotating the key not sufficient on its own?",
          options: ["Because rotation invalidates the configuration format and every teammate must re-register the server", "Because the server caches the original credential until the connection is explicitly re-established", "Because rotation applies only to credentials issued through a browser-based sign-in flow", "Because a committed value is read at launch, so the new key is ignored until the file is rewritten", "Because the committed value remains in repository history, which a later commit cannot clean up"],
          answer: 4,
          explanation: "Rotation is the only real response to a leaked credential, but it cannot undo the exposure of a value that has entered repository history, because overwriting the file in a later commit does not remove the earlier copies. That is why the configuration holds only a variable reference while the value lives in an environment variable or a secret store, and why a credential read by name rotates without touching the code that uses it." },
        { id: 'd2-20', domain: 'd2', difficulty: 'recall', badge: 'unbadged',
          question: "What distinguishes a templated MCP resource from a direct one?",
          options: ["A templated resource puts a parameter in its address, while a direct resource has a fixed address", "A templated resource is generated on demand by the server, while a direct resource is read from disk", "A templated resource is fetched by the model through a tool call, while a direct resource is injected", "A templated resource carries a pre-written instruction, while a direct resource carries raw data", "A templated resource is refreshed every turn, while a direct resource is read once per session"],
          answer: 0,
          explanation: "Both are read-only data the client fetches by address and places into context directly, rather than having the model call a tool to go get it. A direct resource has a fixed address for data that takes no parameters, such as a list of available documents, while a templated resource puts a parameter in the address, such as a document address that takes a document identifier. A pre-written instruction template is a prompt, which is a third thing the server exposes." },
        { id: 'd2-21', domain: 'd2', difficulty: 'hard', badge: 'inferred',
          question: "Two tools are kept apart by exclusion conditions that reference what happened earlier in the session, and routing degrades once the application starts trimming old turns. Why?",
          options: ["Trimming rewrites the tool definitions, so the exclusion sentences no longer reach the model", "The conditions can only be evaluated against conversation history, so dropped turns silently remove the signal", "Trimming reorders the remaining turns, so tool calls and their results no longer pair correctly", "Exclusion conditions are cached with the prefix, so trimming invalidates them until the cache is rewritten", "The model reads exclusion conditions only on the first turn, so later turns route on the name alone"],
          answer: 1,
          explanation: "An exclusion condition such as only use this if the other tool was called earlier in this conversation relies on the complete history being passed in every request. When prior turns are truncated or dropped, Claude cannot evaluate the condition and the routing logic fails silently rather than raising an error. The definitions themselves are unchanged, which is what makes this failure hard to spot from the schema alone." },

        // D3 — Claude Code Configuration & Workflows (expansion)
        { id: 'd3-16', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "What does a bypass permission mode remove that every other Claude Code mode keeps in place?",
          options: ["Deny rules from project settings, which stop applying once prompts are turned off for the session", "The requirement that a plan be approved before the agent moves from exploring to writing", "The protected-path guard, on top of every safety prompt between the agent and your live files", "Hook execution, since a hook that blocks a call would reintroduce the prompt the mode removes", "The record of tool calls, since nothing is surfaced to a person for approval any more"],
          answer: 2,
          explanation: "A bypass mode removes every safety prompt between the agent and your live files and, unlike the other modes, also removes the protected-path guard, which is why it belongs only on an isolated machine. Deny rules and hooks are enforcement layers that still apply: an enterprise-level deny rule in particular holds even when a bypass mode is set." },
        { id: 'd3-17', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "Which case is acceptEdits built for?",
          options: ["A change to a security-relevant file, where the agent's own review stands in for a human one", "Exploration of an unfamiliar codebase, where nothing should be written until a plan is approved", "An unattended automated step, where no person is available to answer a prompt at all", "Low-stakes reversible work, such as a formatting fix confined to the working directory", "A destructive shell command whose blast radius was reviewed once earlier in the session"],
          answer: 3,
          explanation: "Letting low-stakes, reversible actions through without a gate is exactly what acceptEdits is for: a formatting fix or an edit confined to the working directory carries little cost if it is wrong, so prompting on each one buys oversight you do not need and slows the work. Read-only exploration before any edit is plan mode's job, and actions that are hard to undo or reach a sensitive path still need a gate whichever mode is active." },
        { id: 'd3-18', domain: 'd3', difficulty: 'hard', badge: 'docsNote',
          question: "A rules instruction file sits in a subdirectory of the project's rules folder and has no paths field in its frontmatter. When does it load?",
          options: ["Only when Claude Code works with files inside that subdirectory, which acts as an implicit scope", "Never, because a rules file with no paths field is skipped as an incomplete definition", "On first reference, once a prompt mentions a topic matching the file's name or its headings", "Only in sessions started from that subdirectory, since the working directory selects the rule set", "Unconditionally at launch, with the same priority as CLAUDE.md, wherever the file happens to sit"],
          answer: 4,
          explanation: "Scoping comes from the frontmatter, not from file placement: a rules file with no paths glob loads unconditionally at launch with the same priority as CLAUDE.md, no matter where it sits inside the rules directory. Subdirectories there are organizational only. Narrow, path-specific guidance is what the paths field is for, so a scoped rule enters context only when Claude is working with matching files.",
          docsNote: "Doc detail named in the modules: the scope is a paths glob in the file's YAML frontmatter, for example a pattern covering the SQL files under a database module. Confirm the current frontmatter field names against the Claude Code documentation before relying on them." },
        { id: 'd3-19', domain: 'd3', difficulty: 'recall', badge: 'unbadged',
          question: "Which hook event fits injecting extra context or validating a request before any work on it begins?",
          options: ["UserPromptSubmit, which runs when a prompt is submitted and before the model processes it", "SessionStart, which runs once when a session begins or resumes, before any prompt arrives", "PreToolUse, which runs before each tool call and can block the call it inspects", "Notification, which runs when Claude Code needs permission or has been idle for a period", "Stop, which runs when the model has finished responding and the turn is about to end"],
          answer: 0,
          explanation: "UserPromptSubmit runs at submission, before the model processes the prompt, which is the point where context can be injected or the request validated. SessionStart is for initializing state before the session's first prompt, PreToolUse gates individual tool calls, and Stop belongs to end-of-turn work such as notifications, cleanup, or committing an audit log." },
        { id: 'd3-20', domain: 'd3', difficulty: 'standard', badge: 'inferred',
          question: "A team wants required services confirmed reachable and environment variables validated before the agent starts working on anything. Which mechanism fits?",
          options: ["A line in CLAUDE.md instructing the agent to run the checks before it does anything else", "A SessionStart hook, which runs when a session starts or resumes and can initialize or validate state", "A pre-tool hook matched to every tool, so the checks run ahead of the first action taken", "A skill whose description matches setup work, so it loads when the session's first prompt arrives", "A rules file scoped to the configuration paths where the services are defined"],
          answer: 1,
          explanation: "SessionStart runs when a session starts or resumes, which is where state initialization, environment-variable validation, and reachability checks belong. A CLAUDE.md instruction is followed most of the time rather than every time, and a pre-tool hook fires per tool call rather than once at startup. That difference between a convention and a deterministic, enforced step is the whole point of using a hook." },
        { id: 'd3-21', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "What is the right way to treat the CLAUDE.md that the init command generates?",
          options: ["As final, since it was generated from the very codebase it will be loaded into every session for", "As a scratch file, since durable conventions belong in scoped rules files instead", "As a baseline to validate, then refine down to the rules that actually change prompt outcomes", "As a starting point to extend with every new instruction the team discovers over time", "As onboarding documentation, kept separate from the constraints the agent must follow"],
          answer: 2,
          explanation: "The init command scans the codebase and generates a starter CLAUDE.md, and the generated file is a good baseline that should be validated before use. Refine it down to the rules that control the outcome of your prompts: testing commands, framework conventions, paths the agent should not touch, and style decisions that differ from defaults. Extending it with every new instruction is the growth pattern that dilutes the rules that matter most." },
        { id: 'd3-22', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "Two installed plugins each ship a command with the same name. Why is there no collision, and what follows for the plugin author?",
          options: ["The plugin installed first keeps the plain name, so install order becomes part of the interface", "Commands are deduplicated at install time, so the second plugin's command is silently skipped", "Commands are matched by description rather than by name, so identical names never conflict", "Commands are prefixed with the plugin's name, so renaming the plugin renames every command it ships", "Commands are namespaced by marketplace, so two plugins collide only within the same catalog"],
          answer: 3,
          explanation: "Plugin commands are namespaced automatically, with the plugin's name as the prefix, which is why two plugins can both ship a command of the same name. The consequence for an author is that the plugin name is part of the interface: it prefixes every command shipped, so renaming the plugin renames all of them at once." },
        { id: 'd3-23', domain: 'd3', difficulty: 'hard', badge: 'docsNote',
          question: "An administrator wants a particular marketplace available to every developer without each one running an add command. What does the managed allowlist setting accomplish on its own?",
          options: ["It registers the marketplace for all users, since an allowlisted source is added at first launch", "It installs every plugin published in that marketplace across the organization automatically", "It lets users add the marketplace but blocks any plugin that is not already approved", "It replaces the official marketplace, which is otherwise available whenever Claude Code starts", "It gates which sources users may add, so registering it for everyone needs a second setting"],
          answer: 4,
          explanation: "A managed marketplace allowlist restricts where plugins may come from; it does not register marketplaces on users' behalf. Pushing a marketplace to everyone without an add command means pairing the allowlist with the managed setting that declares extra known marketplaces. Because managed settings sit above user and project settings in the hierarchy, what is deployed there takes priority and cannot be overridden.",
          docsNote: "Doc detail named in the modules: pair the allowlist with extraKnownMarketplaces in managed settings, and check the reference layer for the exact setting names before deploying organization-wide." },
        { id: 'd3-24', domain: 'd3', difficulty: 'hard', badge: 'unbadged',
          question: "A plugin installs correctly on a teammate's machine, but the guardrail its author relied on locally is not in effect there. What is the most likely reason?",
          options: ["The deny rule or hook was part of the author's own configuration and was never listed in the bundle", "Managed settings on that machine outrank the plugin, so none of its components load at all", "Plugin hooks register lazily, so a guardrail applies only after its first matching tool call", "The components installed at user scope, where guardrails do not apply to project work", "The teammate's permission mode auto-approves the actions the guardrail was written to stop"],
          answer: 0,
          explanation: "A plugin carries only the components it bundles. A deny rule or hook the author depended on locally does not travel unless it is explicitly listed as part of the bundle, so the skills and commands install while the protection they assumed does not. Hard-coded absolute paths in a skill or hook command are the other thing most likely to install correctly for the author and break for everyone else." },
        { id: 'd3-25', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "A skill whose steps shell out to a local command works in Claude Code and fails when the same skill is invoked through the Messages API. What explains it?",
          options: ["The frontmatter description is matched differently on the API, so the body never loads", "On the API the steps run inside Anthropic's code execution container rather than on your machine", "The API loads only the skill's frontmatter, so instructions in the body are never executed", "The API runs skills under the session's permission mode, which denies shell access by default", "The API requires a skill to be bundled in a plugin before its steps can reach a filesystem"],
          answer: 1,
          explanation: "What changes across runtimes is where the steps run and what they are allowed to touch, not the file itself. Invoked through the Messages API, a skill runs inside Anthropic's code execution container, so anything assuming local files or local commands behaves differently there. The portability rule that follows is to keep a skill's steps inside what the runtime is guaranteed to provide, or document the dependency explicitly." },
        { id: 'd3-26', domain: 'd3', difficulty: 'standard', badge: 'unbadged',
          question: "A workflow should run only when a developer calls it explicitly, never because the model judged it relevant. How is that expressed in current Claude Code?",
          options: ["Put the procedure in the legacy commands directory, which has no description to match against", "Omit the description from the skill's frontmatter so there is nothing for the model to match on", "Ship it as a skill with model invocation disabled in the frontmatter, invoked by name when needed", "Register it as a custom subagent, since a subagent runs only when a task is delegated to it", "Add a pre-tool hook that blocks the skill unless the prompt contains its exact name"],
          answer: 2,
          explanation: "Skills are the recommended format for both explicit and automatic invocation: you call one directly by name, or Claude loads it when its description matches the task. Setting the frontmatter flag that disables model invocation is what keeps a workflow explicit-only. The older commands directory still works but is a legacy path, and omitting the description degrades matching rather than preventing invocation reliably." },

        // D4 — Prompt Engineering & Structured Output (expansion)
        { id: 'd4-12', domain: 'd4', difficulty: 'standard', badge: 'unbadged',
          question: "In a classification prompt that pairs a fixed label set with worked examples, what job do the XML tags do?",
          options: ["They declare the output schema, so the response is validated against the tagged structure", "They raise the weight of the tagged text, so it is treated as higher priority than untagged text", "They separate cached content from dynamic content, so the examples can be reused across calls", "They mark where each example ends and the next begins, so examples are not read as instructions", "They compress the examples, so a longer example set costs fewer tokens per call"],
          answer: 3,
          explanation: "Three techniques do distinct work in that prompt. The system prompt sets the output contract of exactly one label from a fixed set and nothing else, the few-shot pairs show the exact casing and format rather than describing them, and the tags mark where each example ends so Claude does not read them as part of the instruction. Validating a response against a schema is what structured outputs do, which is a separate mechanism." },
        { id: 'd4-13', domain: 'd4', difficulty: 'standard', badge: 'inferred',
          question: "A smaller model keeps missing the required output structure on a task a more capable model handles with no examples at all. What does that say about the two levers?",
          options: ["Model choice supersedes example count, so the smaller model should be dropped from consideration", "Examples help only a capable model, because a smaller model cannot generalize from a pattern", "The example set should be replaced with a longer written description, which costs fewer tokens", "Examples should be added on every call regardless, since their token cost is paid only once", "Adding examples can let the cheaper model do the job, so the two decisions are worth making together"],
          answer: 4,
          explanation: "Prompting mode and model choice are related levers: a more capable model often succeeds zero-shot where a smaller one needs a few examples to match the structure, so adding examples can let a cheaper model do the job. Each example costs tokens on every call and consumes context budget, so the discipline is to try the simplest model and the fewest examples that meet your eval, then add capability or examples only where the eval says you need them." },
        { id: 'd4-14', domain: 'd4', difficulty: 'hard', badge: 'unbadged',
          question: "A classification prompt has grown to several paragraphs about categories and edge cases. Accuracy is unchanged, but each call now returns over two thousand characters and latency has risen sharply. What is the mechanism?",
          options: ["The model calibrates response length and style to the input, so a long unfocused prompt yields long unfocused output", "The longer prompt exhausts the output budget, so the response is padded until the limit is reached", "Each added instruction is restated in the response, which is how the model confirms it followed them", "The extra input tokens push the request past the caching threshold, so every call is reprocessed", "Longer prompts raise the effective reasoning depth, which is billed as additional output tokens"],
          answer: 0,
          explanation: "This is an engineering failure distinct from the diagnostic one that usually precedes it: the model calibrates response length and style to match the input, so a verbose prompt induces verbose output and a latency regression with no accuracy gain. The fix is the same structural move either way, an output constraint naming the exact format plus an example covering the ambiguous case, but recognizing the two failures separately matters because this one can appear even after the first is resolved." },
        { id: 'd4-15', domain: 'd4', difficulty: 'standard', badge: 'unbadged',
          question: "A prompt produces clean output on every tested input and breaks on an unusual field nobody anticipated. Which fix matches that failure type?",
          options: ["A more specific system prompt, since the behavioral contract was too vague to hold across turns", "A constraint naming the variant, or an example covering it, closing the gap the test inputs missed", "A rewording of the existing instructions, since the prompt already covers the case imprecisely", "A second call that re-checks the first response, since one pass cannot cover unanticipated input", "A lower sampling temperature, since variation in the input is amplified by variation in generation"],
          answer: 1,
          explanation: "Clean output on tested inputs that breaks on a variant means the prompt handles the happy path and has no rule for the case the parser breaks on. Naming the variant in the constraint, or adding an example that covers it, closes the gap the narrow test set never exposed. Scope drift across turns is the failure an underspecified system prompt produces, and rewording never supplies a missing structural piece." },
        { id: 'd4-16', domain: 'd4', difficulty: 'hard', badge: 'docsNote',
          question: "One pipeline enables JSON structured outputs and sees added latency on its first call that does not recur. Another generates a fresh schema per request and pays that latency every time. What accounts for the difference?",
          options: ["The first pipeline's responses are cached, so identical outputs return without being generated", "The first pipeline's schema is small enough to validate inline, while a larger schema is compiled remotely", "The schema is compiled into a grammar before generation, and a compiled grammar is reused for a period after last use", "Structured outputs are applied after generation on the first call and during generation thereafter", "The second pipeline invalidates the prompt cache, and the latency is the prefix being reprocessed"],
          answer: 2,
          explanation: "The API compiles your schema into a grammar before it can constrain output, and that compilation adds latency on the first call for a given schema. Steady traffic on a stable schema pays the cost once, while a workload that changes schemas constantly pays it repeatedly. That is separate from the other standing cost of the feature, the injected format description that raises the input token count on every call.",
          docsNote: "Doc detail named in the modules: compiled grammars are cached for 24 hours from last use. Confirm the current window and the exact output configuration parameter shape against the documentation before shipping." },
        { id: 'd4-17', domain: 'd4', difficulty: 'standard', badge: 'docsNote',
          question: "Reasoning is enabled on a current model and the response carries a thinking block whose content is empty. What is happening?",
          options: ["The request asked for more reasoning than the model needed, so nothing was written to the block", "The block is redacted because its reasoning was encrypted for safety review before return", "The model answered without reasoning, and the empty block records that thinking was skipped", "Thinking content is omitted from responses by default, and a readable summary has to be requested", "Reasoning content appears only once the conversation contains at least one tool result"],
          answer: 3,
          explanation: "On the newest models the thinking block's content is omitted by default, so the block arrives with empty text unless summarized display is requested. That setting controls visibility only; the reasoning still happens and is billed the same either way. The block also still has to be returned to the API unchanged on the next turn of a tool-use conversation, empty content included.",
          docsNote: "Doc detail named in the modules: request summarized display when you need to show the reasoning, and confirm the current thinking defaults for your model at build time, since per-model defaults differ." },
        { id: 'd4-18', domain: 'd4', difficulty: 'standard', badge: 'unbadged',
          question: "Where does enabling reasoning pay off in an agentic loop, and how should it be budgeted?",
          options: ["On every tool call, budgeted per call, because each result has to be re-reasoned before the next step", "On the final synthesis step only, because the earlier steps are mechanical tool invocations", "On the first call of each session, because that reasoning is reused across the remaining turns", "Nowhere, because a loop that reasons between calls cannot return its thinking blocks unchanged", "On the planning step, budgeted for that step, because reasoning before a plan reduces wrong-tool selection"],
          answer: 4,
