<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthropic Developer Foundation Study Quiz</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --panel: #ffffff;
        --border: #e3e5ea;
        --border-strong: #c8cdd6;
        --text: #14161a;
        --muted: #6b7280;
        --muted-2: #9aa1ac;
        --accent: #2563eb;
        --accent-bg: #eef4ff;
        --accent-border: #93b4f5;
        --good: #16a34a;
        --good-bg: #eafbf1;
        --bad: #dc2626;
        --bad-bg: #fdecec;
        /* fixed (non-theme) fills paired with white text; kept dark enough for >=4.5:1 contrast against white in both themes */
        --accent-solid: #1d4ed8;
        --good-solid: #15803d;
        --bad-solid: #b91c1c;
        --radius: 10px;
      }

      /* Accent is deliberately brighter than light-mode blue so text/icons drawn in
         --accent stay readable when placed on top of --accent-bg (selected states). */
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --panel: #181b21;
        --border: #2a2e37;
        --border-strong: #3d434f;
        --text: #e8eaed;
        --muted: #a7aeb8;
        --muted-2: #7d8590;
        --accent: #86b6ff;
        --accent-bg: #16223d;
        --accent-border: #4d75b8;
        --good: #4ade80;
        --good-bg: #10281c;
        --bad: #f87171;
        --bad-bg: #2f1414;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        border: 1px solid var(--border-strong);
        background: var(--panel);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .theme-toggle:hover { border-color: var(--accent-border); }

      .shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 600;
        margin-bottom: 14px;
      }

      .title {
        font-size: clamp(1.6rem, 3vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }

      .lede {
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
        max-width: 760px;
        margin: 0 0 32px;
      }

      .lede strong { color: var(--text); font-weight: 600; }

      .domain-bars {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 22px 0;
        margin-bottom: 36px;
      }

      .domain-bar-card {
        padding: 0 20px;
        border-left: 1px solid var(--border);
      }

      .domain-bar-card:first-child { border-left: none; }
      .domain-bar-pct { font-size: 1.5rem; font-weight: 700; }
      .domain-bar-name {
        font-size: 0.78rem;
        color: var(--muted);
        margin: 4px 0 12px;
        line-height: 1.4;
        min-height: 2.6em;
      }
      .domain-bar-track {
        height: 4px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .domain-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }

      .section { margin-bottom: 30px; }
      fieldset.section-group {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .section-label {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-2);
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      legend.section-label { width: 100%; padding: 0; }
      .section-note {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--muted-2);
        font-size: 0.78rem;
      }
      .section.disabled { opacity: 0.45; pointer-events: none; }

      .option-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .option-grid.chips { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

      .option-card {
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel);
        /* buttons don't inherit color from the page by default; without this the text fell back to the browser's default (near-black) button color */
        color: inherit;
        border-radius: var(--radius);
        padding: 14px 16px;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .option-card:hover { border-color: var(--border-strong); }
      .option-title { display: block; margin: 0 0 4px; font-size: 0.95rem; font-weight: 600; }
      .option-description { display: block; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
      .option-card.selected { border-color: var(--accent-border); background: var(--accent-bg); }

      .start-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 40px;
        margin-bottom: 40px;
      }
      .btn {
        border-radius: 8px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        padding: 12px 22px;
        font-size: 0.92rem;
      }
      .btn-primary { background: #14161a; color: #fff; }
      .btn-primary:hover { background: #26282e; }
      .btn-secondary { background: #fff; border-color: var(--border-strong); color: var(--text); }
      .start-note { color: var(--muted-2); font-size: 0.78rem; line-height: 1.6; max-width: 420px; }

      [data-theme="dark"] .btn-primary { background: #e8eaed; color: #14161a; }
      [data-theme="dark"] .btn-primary:hover { background: #ffffff; }
      [data-theme="dark"] .btn-secondary { background: var(--panel); }

      .exam-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-tag.inferred { color: #7a5400; border-color: #f0d99b; background: #fff8e6; }
      .badge-tag.judgment { color: #7c3aed; border-color: #ddd0fb; background: #f6f1fe; }
      .badge-tag.docsNote { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }

      [data-theme="dark"] .badge-tag.inferred { color: #f3d38a; border-color: #6b5a2c; background: #33290f; }
      [data-theme="dark"] .badge-tag.judgment { color: #cbb8ff; border-color: #4b3d7a; background: #241b3d; }

      .timer {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .timer.low { color: var(--bad); border-color: var(--bad); }

      .progress-track {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .progress-fill { height: 100%; background: var(--accent); }

      .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 0 0 20px; }

      .answer-list { display: grid; gap: 10px; margin-bottom: 20px; }
      .answer-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: var(--panel);
        cursor: pointer;
        font-size: 0.94rem;
        line-height: 1.5;
      }
      .answer-row:hover:not(.locked) { border-color: var(--border-strong); }
      .answer-row:focus-visible,
      .option-card:focus-visible,
      .btn:focus-visible,
      .question-text:focus-visible {
        outline: 2px solid var(--accent-solid);
        outline-offset: 2px;
      }
      .answer-row.selected { border-color: var(--accent-border); background: var(--accent-bg); }
      .answer-row.correct { border-color: #a7e2bc; background: var(--good-bg); }
      .answer-row.wrong { border-color: #f3b7b5; background: var(--bad-bg); }
      .answer-row.locked { cursor: default; }

      [data-theme="dark"] .answer-row.correct { border-color: #2f6b45; }
      [data-theme="dark"] .answer-row.wrong { border-color: #7a3c3a; }
      .answer-letter {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1.5px solid var(--border-strong);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--muted);
      }
      /* Filled (not outline) so the letter stays legible against --accent-bg in both themes; uses the *-solid tokens, not --accent/--good/--bad, because those are tuned to sit on dark panels and are too light for white text on top of them. */
      .answer-row.selected .answer-letter { border-color: var(--accent-solid); background: var(--accent-solid); color: #fff; }
      .answer-row.correct .answer-letter { border-color: var(--good-solid); background: var(--good-solid); color: #fff; }
      .answer-row.wrong .answer-letter { border-color: var(--bad-solid); background: var(--bad-solid); color: #fff; }

      .check-row { display: flex; gap: 10px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .explanation-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.88rem;
        line-height: 1.6;
        color: #1e293b;
        margin-bottom: 12px;
      }

      [data-theme="dark"] .explanation-box { background: #1f232b; color: #d7dbe0; }
      [data-theme="dark"] .docs-note-box { background: #1f232b; }
      .explanation-label {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .explanation-box.is-correct .explanation-label { color: var(--good); }
      .explanation-box.is-wrong .explanation-label { color: var(--bad); }
      .docs-note-box {
        border-left: 3px solid var(--border-strong);
        background: #f6f7f9;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 20px;
      }

      .nav-row { display: flex; justify-content: space-between; gap: 12px; }

      .score-wrap { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; margin-bottom: 32px; }
      .score-ring {
        --pct: 0;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: conic-gradient(var(--accent) calc(var(--pct) * 3.6deg), var(--border) 0);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .score-ring span {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 700;
      }
      .domain-breakdown { display: grid; gap: 10px; flex: 1; min-width: 240px; }
      .breakdown-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
      .breakdown-row .name { width: 190px; color: var(--muted); flex-shrink: 0; }
      .breakdown-row .track { flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
      .breakdown-row .fill { height: 100%; background: var(--accent); }
      .breakdown-row .num { width: 46px; text-align: right; font-weight: 600; }

      .review-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
      .review-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.78rem;
        color: var(--muted-2);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .review-question { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
      .review-line { font-size: 0.88rem; margin-bottom: 4px; }
      .review-line.correct-line { color: var(--good); }
      .review-line.wrong-line { color: var(--bad); }

      @media (max-width: 720px) {
        .domain-bars { grid-template-columns: repeat(2, 1fr); }
        .domain-bar-card:nth-child(2n) { border-left: none; }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  </head>
  <body>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    <main class="shell" id="app" aria-label="Claude certification study quiz"></main>
    <output id="srStatus" class="sr-only" aria-live="polite" aria-atomic="true"></output>

    <script>
      const srStatus = document.getElementById('srStatus');
      // Clears then re-sets so screen readers re-announce even if the message repeats
      function announce(message) {
        srStatus.textContent = '';
        requestAnimationFrame(() => { srStatus.textContent = message; });
      }

      const THEME_KEY = 'devFoundationPractice.theme.v1';

      function getPreferredTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark' || saved === 'light') return saved;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
      }

      function toggleTheme() {
        const current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      }

      applyTheme(getPreferredTheme());
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      const DOMAINS = [
        { id: 'd1', code: 'D1', name: 'Agentic Architecture & Orchestration' },
        { id: 'd2', code: 'D2', name: 'Tool Design & MCP Integration' },
        { id: 'd3', code: 'D3', name: 'Claude Code Configuration & Workflows' },
        { id: 'd4', code: 'D4', name: 'Prompt Engineering & Structured Output' },
        { id: 'd5', code: 'D5', name: 'Context & Reliability' }
      ];

      const BADGE_LABELS = {
        unbadged: 'Unbadged',
        inferred: 'Inferred',
        judgment: 'Judgment call',
        docsNote: 'Docs note'
      };

      const ITEM_BANK = [
        // D1 — Agentic Architecture & Orchestration
        { id: 'd1-1', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'Who actually executes a tool once Claude decides to call it?',
          options: ['The model runtime executes it in Claude\'s context and appends the output', 'Your application runs the tool and returns a matching tool_result to Claude', 'The MCP client forwards it to Anthropic for execution and receives the result', 'The tool provider executes every declared tool as soon as its schema is selected', 'The SDK automatically executes every declared tool once the request is sent, without waiting for Claude to select one'],
          answer: 1,
          explanation: 'Claude only reads the schema, decides which tool fits, and asks your application to call it. Your application is responsible for execution and returning a tool_result. Some SDKs offer a Tool Runner helper that automates this loop for handlers you register, but it still runs your application code, never the model runtime.' },
        { id: 'd1-2', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What breaks if your application never returns a tool_result for a tool_use block?',
          options: ['Claude treats the missing result as an empty success and continues the same turn', 'The loop breaks because the pending tool_use never receives its required tool_result', 'The Messages API replays the tool call after its response timeout expires', 'Claude selects another registered tool that has a compatible input schema', 'The next user message implicitly closes the pending tool call and starts a fresh loop'],
          answer: 1,
          explanation: 'The agent loop is not automatic. If the tool_result step is skipped or malformed, Claude never gets the data back and the loop breaks.' },
        { id: 'd1-3', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: 'Under the worst-case-cost framework, when must a human review gate exist regardless of the active permission mode?',
          options: ['When the agent reports low confidence, even if the proposed action is read-only and reversible', 'When the permission mode would normally prompt, because review gates mirror the mode\'s default behavior', 'Whenever an action is difficult to undo or can affect a sensitive or protected path without review', 'Before any implementation begins, after which the approved plan serves as review for all later actions', 'Whenever the action uses more than one tool, because orchestration increases operational risk'],
          answer: 2,
          explanation: 'The gate is placed by asking what the worst outcome is if the action runs unchecked. High-cost, hard-to-undo, or sensitive-path actions need a human gate no matter what mode is active.' },
        { id: 'd1-4', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is the default order of Claude Code\'s workflow on an unfamiliar task?',
          options: ['Plan from the request, code the proposed change, then explore only if validation fails', 'Explore the unfamiliar codebase first, form a grounded plan, and then implement the proposed change', 'Draft the implementation, inspect neighboring code, then revise the plan before validation', 'Explore and code in parallel, then document the plan after the behavior is working', 'Plan the requested behavior, explore only its target file, then code without further approval'],
          answer: 1,
          explanation: 'Claude Code explores the codebase first, proposes a plan, and only writes or executes changes once the plan is approved.' },
        { id: 'd1-5', domain: 'd1', difficulty: 'standard', badge: 'inferred',
          question: 'A task delegated to the built-in Explore subagent ignores a rule defined in the project\'s CLAUDE.md. What is the most likely cause?',
          options: ['Built-in subagents load CLAUDE.md only when the parent explicitly quotes the relevant section in its task', 'Explore and Plan built-in subagents skip CLAUDE.md and repository state to reduce overhead', 'All delegated agents ignore project instructions unless the rule is duplicated in managed settings', 'Explore loads CLAUDE.md but gives its built-in read-only policy higher precedence than project guidance', 'Explore reads project instructions only after its first search, so early actions can miss them'],
          answer: 1,
          explanation: 'The built-in Explore and Plan subagents intentionally skip CLAUDE.md and git status to keep research fast; project rules defined there are not in their context.' },
        { id: 'd1-6', domain: 'd1', difficulty: 'standard', badge: 'inferred',
          question: 'In the systems lifecycle for a Claude application, which phase immediately follows Design?',
          options: ['Requirements', 'Build', 'Test', 'Deploy', 'Operate'],
          answer: 1,
          explanation: 'Choosing the platform, the model, and the trust boundaries is the Design phase. The lifecycle runs Requirements → Design → Build → Test → Deploy → Operate → Iterate, so Design is followed by Build, where the agent, tools, and prompts are written.' },
        { id: 'd1-7', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is a "gate" in the systems lifecycle for a Claude application?',
          options: ['A checklist used to record phase completion after work has already moved forward', 'A decision point that must be cleared before work advances to the next phase', 'A runtime permission rule that determines whether Claude may invoke a particular tool', 'A compliance review added before deployment when regulation applies, but not during earlier phases', 'A rollback boundary that restores the preceding lifecycle phase after a failed deployment'],
          answer: 1,
          explanation: 'A gate is where a regulated engagement keeps control — for example, refusing to move from design to build until a residency requirement is satisfied.' },
        { id: 'd1-8', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What most often determines which deployment platform a Claude workload runs on?',
          options: ['The provider with the lowest projected token cost after prompt caching and batch discounts', 'The customer\'s existing cloud environment, identity model, residency constraints, and compliance agreements', 'The platform whose SDK best matches the application\'s programming language and framework', 'The provider with the newest model snapshot, unless a required region is unavailable there', 'The deployment target used by the reference implementation from which the workload was derived'],
          answer: 1,
          explanation: 'The deployment platform decision is usually shaped by where the customer already trusts and operates — their cloud, identity, and compliance agreements.' },
        { id: 'd1-9', domain: 'd1', difficulty: 'standard', badge: 'docsNote',
          question: 'Why pin a full model snapshot ID instead of a moving alias like "sonnet" in production?',
          options: ['A snapshot keeps token pricing fixed for the lifetime of the deployment, while aliases follow current pricing', 'It prevents an upstream model update from silently becoming an untracked change to production behavior', 'A snapshot preserves prompt-cache entries across schema changes that would invalidate an alias-based cache', 'It allows streaming and tool use to share one model identifier without separate compatibility checks', 'It guarantees the snapshot remains available in every region supported by the moving alias'],
          answer: 1,
          explanation: 'An unpinned deployment makes every upstream model update an untracked change to your output; pinning makes the update a deliberate, reviewable choice.',
          docsNote: 'Doc detail named in the modules: for Claude 4.6 and later, the model ID alone pins to a snapshot; earlier models require the ID plus a date suffix — confirm the current convention before shipping.' },
        { id: 'd1-10', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'What is an "accelerator" in the context of packaging Claude solutions for reuse?',
          options: ['A deployment profile that routes difficult requests to a higher-capability model tier', 'A packaged solution that lets a future engagement start from a working foundation', 'A managed runtime that scales MCP servers and Claude API calls as one deployment unit', 'A reusable cache of prompts, tool results, and evaluation outputs shared across customer environments', 'A benchmark suite used to identify which model tier completes an engagement fastest'],
          answer: 1,
          explanation: 'An accelerator separates engagement-specific code from the reusable core and exposes the rest as documented, parameterized configuration.' },
        { id: 'd1-11', domain: 'd1', difficulty: 'hard', badge: 'judgment',
          question: 'A team wants to contribute an entire multi-component customer application to the Claude Cookbook. What is the most likely outcome?',
          options: ['It is accepted if customer-specific configuration is removed and every component has integration tests', 'It stalls in review because the Cookbook favors focused, reviewable patterns over full applications', 'It is redirected unchanged to a dedicated full-application section after licensing and security review', 'It is split during review into independent examples, with maintainers taking ownership of the extracted patterns', 'It is accepted as an accelerator but excluded from Cookbook navigation until independently maintained'],
          answer: 1,
          explanation: 'Matching the contribution to the channel matters: a full application is a mismatch for a repository designed around one clearly reviewable pattern.' },
        { id: 'd1-12', domain: 'd1', difficulty: 'standard', badge: 'unbadged',
          question: 'Which requirement primarily constrains the deployment infrastructure rather than defining application behavior?',

        { id: 'd3-15', domain: 'd3', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-4', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-5', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-6', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-7', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-8', domain: 'd5', difficulty: 'standard', badge: 'docsNote',

          answer: 1,

        { id: 'd5-9', domain: 'd5', difficulty: 'hard', badge: 'inferred',

        ,{ id: 'd5-10', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: 'A tool fails during an agent loop. How should the application expose that failure to Claude?',

        { id: 'd5-11', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: 'When a service returns a retry-after value with a retriable error, how should retry timing be chosen?',
          options: ['Ignore it and always use exponential backoff so every service follows one client policy', 'Retry immediately once, then apply the header only if the immediate attempt also fails', 'Use the retry-after value first and fall back to exponential backoff when it is absent', 'Add the retry-after value to the next exponential delay to create a conservative combined wait', 'Treat any response with retry-after as terminal because the service has rejected the request'],
          answer: 2,

        { id: 'd5-12', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: 'A workload sends the same long system prompt and tool schema on every call, but consecutive calls in the same session can be twenty minutes apart. Under the default cache settings, what happens?',

        { id: 'd5-13', domain: 'd5', difficulty: 'standard', badge: 'unbadged',

        { id: 'd5-14', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'Some incoming queries are single-fact lookups against a stable corpus; others need several rounds of search across changing sources, and traffic is a genuine mix of both. What is the recommended way to route each query to the right retrieval strategy?',

          answer: 2,
          explanation: 'A cheap classification call is a router: it reads the query and picks the retrieval path. The router earns its cost whenever traffic is genuinely mixed. Defaulting everything to iterative search inflates cost and latency on lookups a single fetch could answer, while defaulting everything to a static index gives shallow answers on questions that need several passes.' },
        { id: 'd5-15', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'An eval shows your current default model failing on the hardest cases in your production traffic, and the cost of a wrong answer on those cases is high. What does this justify, and on what basis?',
          options: ['Stepping up a model tier, using that eval score as the justification rather than a general sense that a bigger model is safer', 'Stepping down a model tier, since a failure on hard cases suggests the current model is already miscalibrated for the task', 'Rewriting the prompt with more few-shot examples first, and only reconsidering the model if that fails to close the gap', 'Switching every request in the system to the most capable available model, regardless of whether other request types were failing', 'Leaving the model choice unchanged and raising the retry budget, since retries can recover an answer the model tier got wrong'],
          answer: 0,
          explanation: 'Step up a tier when an eval shows the current model failing on the hardest cases your traffic contains and the cost of a wrong answer is high. The eval is the instrument in both directions — a model change is promoted on a measured score against your cases, not on a general impression that a larger model is inherently safer.' },
        { id: 'd5-16', domain: 'd5', difficulty: 'recall', badge: 'unbadged',
          question: 'What three metrics should be logged for every call to make a cost or latency problem traceable to a specific step, rather than visible only as a total on the monthly invoice?',
          options: ['Model name, prompt length, and the number of tool definitions loaded for that call', 'Input and output token usage, latency, and error rate, recorded per call', 'Total daily spend, average latency across the whole system, and the overall error count', 'Cache hit rate, retry count, and the number of concurrent sessions active at call time', 'The system prompt version, the SDK version, and the region the request was routed to'],
          answer: 1,
          explanation: 'Observability for a Claude system means instrumenting three metrics per call: input and output token usage, latency, and error rate. With those three recorded for every call, a cost or latency problem becomes a row you can sort and trace to a specific step or request type, instead of a mystery on the invoice.' },
        { id: 'd5-17', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: 'An application wraps all fetched web content in delimiters and instructs the model to treat everything inside them as data, never as commands. Is this sufficient to stop prompt injection?',

          answer: 1,
          explanation: 'The model receives one single stream of tokens with no structural marker separating trusted from untrusted content. Delimiters and model-level training reduce risk but remain probabilistic and are not guaranteed — the reliable boundary is not in the wording of the prompt but in what actions and access the agent has, which is why the defense also has to constrain and log consequential actions regardless of what the untrusted content says.' },
        { id: 'd5-18', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: 'A nightly job classifies 5,000 records with no user waiting on the result, and cost matters more than turnaround time. Which pattern fits, and why?',
          options: ['The synchronous Messages API in a tight loop over all 5,000 records, since looping already spreads the requests over time', 'The Message Batches API, since it trades a non-deterministic completion window for a lower per-request cost on offline work', 'Streaming responses for each record, since streaming reduces the total tokens billed for a large batch of similar requests', 'The synchronous API with disable_parallel_tool_use set, since serializing calls is the recommended way to cut batch cost', 'The Message Batches API, since it guarantees results within a fixed and predictable turnaround measured in minutes'],

          explanation: 'The Message Batches API is for exactly this shape of work: no user waiting, and cost is the priority. It trades latency for cost — batch processing is non-deterministic and can take time to complete, in exchange for a lower per-token price than the same calls made synchronously. Looping over the synchronous API is not batching: it produces the same number of calls and runs into the same rate limits.' }
      ];

      DOMAINS.forEach((d) => {
        d.count = ITEM_BANK.filter((i) => i.domain === d.id).length;
        d.hardCount = ITEM_BANK.filter((i) => i.domain === d.id && i.difficulty === 'hard').length;
      });
      const TOTAL_ITEMS = ITEM_BANK.length;
      const TOTAL_HARD = ITEM_BANK.filter((i) => i.difficulty === 'hard').length;
      DOMAINS.forEach((d) => { d.pct = Math.round((d.count / TOTAL_ITEMS) * 100); });

      const HISTORY_KEY = 'devFoundationPractice.itemHistory.v1';

      function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); }
        catch { return {}; }
      }

      function recordAnswer(itemId, correct) {
        const history = loadHistory();
        const entry = history[itemId] || { seen: 0, correct: 0 };
        entry.seen += 1;
        if (correct) entry.correct += 1;
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ ...history, [itemId]: entry }));
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function materialize(item, answerSlot) {
        const distractorOrder = shuffle(item.options.map((_, idx) => idx).filter((idx) => idx !== item.answer));
        const order = distractorOrder.slice();
        order.splice(answerSlot, 0, item.answer);
        return {
          ...item,
          options: order.map((idx) => item.options[idx]),
          answer: answerSlot
        };
      }

      function materializeBalanced(items) {
        const answerSlots = shuffle(items.map((_, idx) => idx % 5));
        return items.map((item, idx) => materialize(item, answerSlots[idx]));
      }

      function completeAnswerBlocks(items) {
        return items.slice(0, items.length - (items.length % 5));
      }

      function stratifiedDraw(bank, total) {
        let result = [];
        DOMAINS.forEach((d) => {
          const share = Math.max(1, Math.round((d.count / bank.length) * total));
          const domainItems = shuffle(bank.filter((i) => i.domain === d.id));
          result = result.concat(domainItems.slice(0, Math.min(share, domainItems.length)));
        });
        return result;
      }

      const EXAM_FORM_SIZE = Math.min(30, TOTAL_ITEMS);
      const EXAM_FORM_MINUTES = EXAM_FORM_SIZE * 2;

      const config = {
        form: 'studySet',
        domainFocus: 'all',
        difficulty: 'mixed',
        evidentiary: 'allBadged',
        itemSelection: 'preferUnseen',
        feedback: 'perItem',
        clock: 'timed'
      };

      const state = { view: 'config', attempt: null };
      // Answer idx to focus after the next renderExam() rebuild, set by keyboard nav
      let pendingAnswerFocus = null;

      function buildPool() {
        let pool = ITEM_BANK.slice();

        if (config.form === 'examForm') {
          pool = stratifiedDraw(ITEM_BANK, EXAM_FORM_SIZE);
        } else {
          if (config.domainFocus !== 'all') {
            pool = pool.filter((i) => i.domain === config.domainFocus);
          }
          if (config.evidentiary === 'guideOnly') {
            pool = pool.filter((i) => i.badge === 'unbadged' || i.badge === 'docsNote');
          }

          if (config.form === 'hardDrill') {
            const hardItems = pool.filter((i) => i.difficulty === 'hard');
            const standardItems = shuffle(pool.filter((i) => i.difficulty !== 'hard'));
            const target = Math.max(10, hardItems.length);
            pool = hardItems.concat(standardItems).slice(0, Math.min(target, pool.length));
          } else if (config.form === 'studySet') {
            if (config.difficulty === 'standard') {
              // 'standard' includes recall-tier items; only hard items are excluded
              pool = pool.filter((i) => i.difficulty !== 'hard');
            } else if (config.difficulty === 'hardWeighted') {
              const hardItems = pool.filter((i) => i.difficulty === 'hard');
              const standardItems = pool.filter((i) => i.difficulty !== 'hard');
              pool = hardItems.concat(standardItems);
            }
          }
        }

        const history = loadHistory();
        if (config.itemSelection === 'preferUnseen') {
          pool = pool.slice().sort((a, b) => (history[a.id]?.seen || 0) - (history[b.id]?.seen || 0));
        }

        return shuffle(pool);
      }

      const app = document.getElementById('app');

      function formatClock(totalSeconds) {
        const m = Math.floor(Math.max(0, totalSeconds) / 60);
        const s = Math.max(0, totalSeconds) % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }

      function renderConfig() {
        const disabledStudyOnly = config.form === 'examForm';

        const domainBars = [...DOMAINS].sort((a, b) => b.pct - a.pct);

          { key: 'mixed', title: 'Mixed', desc: 'Roughly a fifth hard items, matching the overall bank' },
          { key: 'hardWeighted', title: 'Hard-weighted', desc: 'Every hard item available, topped up with standard' }

          { key: 'allBadged', title: 'All items, badged', desc: 'Inferred and judgment-call items are labelled in place' },

        const itemSelectionCards = [
          { key: 'preferUnseen', title: 'Prefer unseen', desc: 'Draw items you have not answered before, when available' },
          { key: 'fullyRandom', title: 'Fully random', desc: 'Ignore attempt history' }
        ];

        const feedbackCards = [
          { key: 'perItem', title: 'Check per item', desc: 'Nothing is revealed on selection; check answer whenever you choose to, per item' },

        ];

        const clockCards = [
          { key: 'timed', title: 'Timed', desc: 'Counts down, auto-submits at zero' },
          { key: 'untimed', title: 'Untimed', desc: 'Counts up, no cutoff' }

        const renderCards = (cards, groupKey, selectedKey) => cards.map((c) => `
          <button type="button" class="option-card ${selectedKey === c.key ? 'selected' : ''}" data-group="${groupKey}" data-key="${c.key}" aria-pressed="${selectedKey === c.key}">

            <span class="option-description">${c.desc}</span>

        const renderChips = (cards, groupKey, selectedKey) => cards.map((c) => `

        let startLabel = 'Start study set';
        if (config.form === 'examForm') startLabel = 'Start exam form';
        else if (config.form === 'hardDrill') startLabel = 'Start hard drill';

        app.innerHTML = `

              a <strong>Docs note</strong> records the exact detail named in the modules. <strong>Unbadged</strong> means the modules state the answer

          <section class="section" role="region" aria-label="Domain coverage">

            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="domainFocusSectionHeading" class="section-label">Domain focus <span class="section-note">study modes only — exam forms always follow the full blueprint</span></legend>
              <div class="option-grid chips">${renderChips(domainChips, 'domainFocus', config.domainFocus)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledStudyOnly ? 'disabled' : ''}" role="region" aria-label="Difficulty settings">
            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="difficultySectionHeading" class="section-label">Difficulty mix</legend>
              <div class="option-grid">${renderCards(difficultyCards, 'difficulty', config.difficulty)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledStudyOnly ? 'disabled' : ''}" role="region" aria-label="Evidentiary basis settings">
            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="evidenceSectionHeading" class="section-label">Evidentiary basis</legend>
              <div class="option-grid">${renderCards(evidentiaryCards, 'evidentiary', config.evidentiary)}</div>
            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Item selection settings">
            <fieldset class="section-group">
              <legend id="selectionSectionHeading" class="section-label">Item selection</legend>
              <div class="option-grid">${renderCards(itemSelectionCards, 'itemSelection', config.itemSelection)}</div>
            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Feedback settings">
            <fieldset class="section-group">
              <legend id="feedbackSectionHeading" class="section-label">Feedback</legend>

            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Clock settings">

              <legend id="clockSectionHeading" class="section-label">Clock</legend>
              <div class="option-grid">${renderCards(clockCards, 'clock', config.clock)}</div>
            </fieldset>
          </section>

          <section class="start-row" role="region" aria-label="Start attempt">
            <button id="startBtn" class="btn btn-primary" type="button">${startLabel}</button>
            <div class="start-note">
              Item and option order are shuffled on every attempt. Scores and per-item history persist between sittings in this browser; nothing leaves this device.
            </div>
          </section>
        `;

        app.querySelectorAll('.option-card[data-group]').forEach((btn) => {
          btn.addEventListener('click', () => {
            config[btn.dataset.group] = btn.dataset.key;
            renderConfig();
          });
        });

        document.getElementById('startBtn').addEventListener('click', startAttempt);
      }

      function startAttempt() {
        const rawPool = completeAnswerBlocks(buildPool());
        const pool = materializeBalanced(rawPool);

        const totalSeconds = config.clock === 'timed' ? pool.length * 120 : 0;

        state.attempt = {
          pool,
          index: 0,
          answers: new Array(pool.length).fill(null),
          checked: new Array(pool.length).fill(false),
          startedAt: Date.now(),
          remainingSeconds: totalSeconds,
          elapsedSeconds: 0,
          timerId: null,
          autoSubmitted: false
        };

        state.view = 'exam';
        renderExam();

        if (config.clock === 'timed' || config.clock === 'untimed') {
          state.attempt.timerId = setInterval(tickTimer, 1000);
        }
      }

      function tickTimer() {
        const a = state.attempt;
        if (!a) return;

        if (config.clock === 'timed') {
          a.remainingSeconds -= 1;
          if (a.remainingSeconds <= 0) {
            a.remainingSeconds = 0;
            a.autoSubmitted = true;
            clearInterval(a.timerId);
            announce('Time expired. Attempt submitted.');
            finishAttempt();
            return;
          }
        } else {
          a.elapsedSeconds += 1;
        }

        const timerEl = document.getElementById('timerDisplay');
        if (timerEl) {
          timerEl.textContent = config.clock === 'timed' ? formatClock(a.remainingSeconds) : formatClock(a.elapsedSeconds);
          timerEl.classList.toggle('low', config.clock === 'timed' && a.remainingSeconds <= 30);
        }
      }

      function selectAnswer(idx) {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = idx;
        renderExam();
      }

      function checkAnswer() {
        const a = state.attempt;
        if (a.checked[a.index] || a.answers[a.index] === null) return;
        const item = a.pool[a.index];
        a.checked[a.index] = true;
        const isCorrect = a.answers[a.index] === item.answer;
        recordAnswer(item.id, isCorrect);
        announce(isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`);
        renderExam();
      }

      function clearSelection() {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = null;
        renderExam();
      }

      function goNext() {
        const a = state.attempt;
        if (a.index < a.pool.length - 1) {
          a.index += 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
        } else {
          finishAttempt();
        }
      }

      function goPrev() {
        const a = state.attempt;
        if (a.index > 0) {
          a.index -= 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
        }
      }

      function finishAttempt() {
        const a = state.attempt;
        a.pool.forEach((item, idx) => {
          if (!a.checked[idx]) recordAnswer(item.id, a.answers[idx] === item.answer);
        });
        if (a.timerId) clearInterval(a.timerId);
        state.view = 'results';
        renderResults();
      }

      // Descriptor for whatever currently has focus, used to restore it after an innerHTML rebuild
      function captureFocusTarget() {
        if (pendingAnswerFocus !== null) {
          const idx = pendingAnswerFocus;
          pendingAnswerFocus = null;
          return { idx };
        }
        const activeEl = document.activeElement;
        if (!activeEl) return null;
        if (activeEl.classList && activeEl.classList.contains('answer-row')) {
          return { idx: Number(activeEl.dataset.idx) };
        }
        if (activeEl.id) return { id: activeEl.id };
        return null;
      }

      function restoreFocusTarget(focusTarget) {
        if (!focusTarget) return;
        if (focusTarget.idx !== undefined) {
          const row = app.querySelector(`.answer-row[data-idx="${focusTarget.idx}"]`) || app.querySelector('.answer-row[tabindex="0"]');
          if (row) row.focus();
        } else if (focusTarget.id) {
          const el = document.getElementById(focusTarget.id) || document.getElementById('nextBtn') || document.getElementById('questionHeading');
          if (el) el.focus();
        }
      }

      // Arrow keys move+select (roving tabindex), Home/End jump to the ends, Space/Enter select the focused option
      function resolveAnswerKeyIdx(e, idx, last) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') return idx === last ? 0 : idx + 1;
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') return idx === 0 ? last : idx - 1;
        if (e.key === 'Home') return 0;
        if (e.key === 'End') return last;
        if (e.key === ' ' || e.key === 'Enter') return idx;
        return null;
      }

      function renderAnswerRows(item, selected, checked, locked) {
        const tabbableIdx = selected !== null ? selected : 0;
        return item.options.map((opt, idx) => {
          const letter = String.fromCodePoint(65 + idx);
          const classes = ['answer-row'];
          if (locked) classes.push('locked');
          if (selected === idx) classes.push('selected');
          if (checked && idx === item.answer) classes.push('correct');
          if (checked && selected === idx && idx !== item.answer) classes.push('wrong');
          return `
            <div class="${classes.join(' ')}" data-idx="${idx}" role="radio" tabindex="${idx === tabbableIdx ? '0' : '-1'}" aria-checked="${selected === idx}" aria-label="Option ${letter}: ${opt}"${locked ? ' aria-disabled="true"' : ''}>
              <div class="answer-letter">${letter}</div>
              <div>${opt}</div>
            </div>
          `;
        }).join('');
      }

      function renderExplanationMarkup(item, selected, checked) {
        if (!checked) return '';
        const isCorrect = selected === item.answer;
        const headerText = isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`;
        const docsNoteMarkup = item.docsNote ? `<div class="docs-note-box"><strong>${item.docsNote}</strong></div>` : '';
        return `
          <section role="region" aria-label="Answer feedback">
            <div class="explanation-box ${isCorrect ? 'is-correct' : 'is-wrong'}" role="status" aria-live="polite" aria-atomic="true">
              <div class="explanation-label">${headerText}</div>
              <div>${item.explanation}</div>
            </div>
            ${docsNoteMarkup}
          </section>
        `;
      }

      function renderTimerMarkup(a) {
        if (config.clock === 'timed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time remaining">${formatClock(a.remainingSeconds)}</div>`;
        }
        if (config.clock === 'untimed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time elapsed">${formatClock(a.elapsedSeconds)}</div>`;
        }
        return '';
      }

      function renderCheckRowMarkup(manualMode, checked, selected) {
        if (!manualMode || checked) return '';
        const disabledAttr = selected === null ? 'disabled' : '';
        return `
          <div class="check-row">
            <button id="checkBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Check answer</button>
            <button id="clearBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Clear selection</button>
          </div>
        `;
      }

      function bindExamEvents(item, locked) {
        app.querySelectorAll('.answer-row').forEach((row) => {
          row.addEventListener('click', () => {
            if (locked) return;
            selectAnswer(Number(row.dataset.idx));
          });
        });

        app.querySelector('.answer-list').addEventListener('keydown', (e) => {
          const row = e.target.closest('.answer-row');
          if (!row || locked) return;
          const idx = Number(row.dataset.idx);
          const nextIdx = resolveAnswerKeyIdx(e, idx, item.options.length - 1);
          if (nextIdx === null) return;
          e.preventDefault();
          pendingAnswerFocus = nextIdx;
          selectAnswer(nextIdx);
        });

        document.getElementById('prevBtn').addEventListener('click', goPrev);
        document.getElementById('nextBtn').addEventListener('click', goNext);
        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn) checkBtn.addEventListener('click', checkAnswer);
        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearSelection);
      }

      function renderExam() {
        const a = state.attempt;
        const item = a.pool[a.index];
        const domain = DOMAINS.find((d) => d.id === item.domain);
        const selected = a.answers[a.index];
        const manualMode = config.feedback === 'perItem';
        const checked = manualMode && a.checked[a.index];
        const locked = checked;

        const focusTarget = captureFocusTarget();

        const badgeClass = item.badge === 'unbadged' ? '' : item.badge;
        const answerRows = renderAnswerRows(item, selected, checked, locked);
        const explanationMarkup = renderExplanationMarkup(item, selected, checked);
        const timerMarkup = renderTimerMarkup(a);
        const checkRowMarkup = renderCheckRowMarkup(manualMode, checked, selected);

        app.innerHTML = `
          <section role="region" aria-label="Question ${a.index + 1} of ${a.pool.length}">
            <h1 id="questionRegionHeading" class="sr-only">Question ${a.index + 1} of ${a.pool.length}</h1>
            <div class="eyebrow">${domain.code} · ${domain.name}</div>
            <div class="exam-topbar">
              <span class="badge-tag ${badgeClass}">${BADGE_LABELS[item.badge]}</span>
              <div style="display:flex; align-items:center; gap:14px;">
                <span style="color:var(--muted-2); font-size:0.85rem;">Item ${a.index + 1} of ${a.pool.length}</span>
                ${timerMarkup}
              </div>
            </div>

            <div class="progress-track" role="progressbar" aria-valuenow="${a.index + 1}" aria-valuemin="1" aria-valuemax="${a.pool.length}" aria-valuetext="Question ${a.index + 1} of ${a.pool.length}"><div class="progress-fill" style="width:${((a.index + 1) / a.pool.length) * 100}%"></div></div>

            <h2 id="questionHeading" class="question-text" tabindex="-1">${item.question}</h2>

            <section role="region" aria-label="Answer options">
              <div class="answer-list" role="radiogroup" aria-labelledby="questionHeading">${answerRows}</div>
            </section>

            ${explanationMarkup}
          </section>

          <nav class="nav-row" aria-label="Question navigation">
            <div class="check-row">
              <button id="prevBtn" class="btn btn-secondary" type="button" ${a.index === 0 ? 'disabled' : ''}>Previous</button>
              <button id="nextBtn" class="btn btn-primary" type="button">${a.index === a.pool.length - 1 ? 'Finish' : 'Next'}</button>
            </div>
            ${checkRowMarkup}
          </nav>
        `;

        bindExamEvents(item, locked);
        restoreFocusTarget(focusTarget);
      }

      // Builds a text-based (selectable) PDF via jsPDF, loaded from CDN in <head>,
      // styled to echo the live results page: colored text, bordered cards, and bar graphics.
      function exportResultsToPdf(a, correctCount, total, pct, byDomain) {
        if (!window.jspdf) {
          alert('PDF export could not load. Check your internet connection and try again.');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'letter' });
        const marginX = 48;
        const marginBottom = 48;
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const maxWidth = pageWidth - marginX * 2;
        let y = 56;

        // Palette mirrors the light-theme CSS custom properties so the PDF reads like the live page.
        const COLOR = {
          text: [20, 22, 26],
          muted: [107, 114, 128],
          muted2: [154, 161, 172],
          accent: [37, 99, 235],
          accentSolid: [29, 78, 216],
          accentBg: [238, 244, 255],
          good: [22, 163, 74],
          goodSolid: [21, 128, 61],
          goodBg: [234, 251, 241],
          bad: [220, 38, 38],
          badSolid: [185, 28, 28],
          badBg: [253, 236, 236],
          border: [227, 229, 234],
          borderStrong: [200, 205, 214],
        };

        const ensureSpace = (needed) => {
          if (y + needed > pageHeight - marginBottom) {
            doc.addPage();
            y = 56;
          }
        };

        const setFont = (size, bold) => {
          doc.setFontSize(size);
          doc.setFont('helvetica', bold ? 'bold' : 'normal');
        };

        const measure = (text, size, width, bold) => {
          setFont(size, bold);
          return doc.splitTextToSize(String(text), width);
        };

        const writeLines = (text, size, opts = {}) => {
          setFont(size, opts.bold);
          doc.setTextColor(...(opts.color || COLOR.text));
          const lines = doc.splitTextToSize(String(text), opts.width || maxWidth);
          const lh = size * 1.4;
          lines.forEach((line) => {
            ensureSpace(lh);
            doc.text(line, opts.x || marginX, y);
            y += lh;
          });
          doc.setTextColor(...COLOR.text);
        };

        // A rounded horizontal meter bar, matching .progress-track/.domain-bar-track visuals.
        const drawBar = (x, barY, w, h, pctValue, fillColor) => {
          const r = h / 2;
          doc.setFillColor(...COLOR.border);
          doc.roundedRect(x, barY, w, h, r, r, 'F');
          const fillW = Math.max(h, (w * Math.min(100, Math.max(0, pctValue))) / 100);
          doc.setFillColor(...fillColor);
          doc.roundedRect(x, barY, fillW, h, r, r, 'F');
        };

        // ---- Header ----
        writeLines('Anthropic Developer Foundation Study Quiz', 16, { bold: true });
        writeLines(`Results \u00b7 ${new Date().toLocaleString()}`, 10, { color: COLOR.muted });
        y += 10;

        // ---- Score summary ----
        writeLines('SCORE SUMMARY', 9, { bold: true, color: COLOR.muted2 });
        y += 4;
        ensureSpace(34);
        setFont(28, true);
        doc.setTextColor(...COLOR.accentSolid);
        doc.text(`${pct}%`, marginX, y + 22);
        setFont(12, true);
        doc.setTextColor(...COLOR.text);
        doc.text(`${correctCount} / ${total} correct`, marginX + 90, y + 18);
        y += 34;
        drawBar(marginX, y, maxWidth, 8, pct, COLOR.accent);
        y += 26;

        byDomain.forEach((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          ensureSpace(30);
          setFont(9.5, false);
          doc.setTextColor(...COLOR.muted);
          doc.text(`${d.code} \u00b7 ${d.name}`, marginX, y);
          setFont(9.5, true);
          doc.setTextColor(...COLOR.text);
          doc.text(`${d.correct}/${d.attempted} (${domainPct}%)`, marginX + maxWidth, y, { align: 'right' });
          y += 8;
          drawBar(marginX, y, maxWidth, 6, domainPct, COLOR.accent);
          y += 20;
        });

        y += 10;
        writeLines('ITEM-BY-ITEM REVIEW', 9, { bold: true, color: COLOR.muted2 });
        y += 6;

        // ---- Review cards ----
        const pad = 14;
        const innerWidth = maxWidth - pad * 2;

        a.pool.forEach((item, idx) => {
          const domain = DOMAINS.find((dm) => dm.id === item.domain);
          const selected = a.answers[idx];
          const isCorrect = selected === item.answer;
          const selectedText = selected !== null ? `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}` : 'No answer';
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;

          const headLine = `${domain.code} \u00b7 ${BADGE_LABELS[item.badge]} \u00b7 item ${idx + 1}`;
          const statusLine = isCorrect ? 'Correct' : 'Incorrect';
          const questionLines = measure(item.question, 11.5, innerWidth, true);
          const yourAnswerLines = measure(`Your answer: ${selectedText}`, 10, innerWidth, false);
          const correctAnswerLines = !isCorrect ? measure(`Correct answer: ${correctText}`, 10, innerWidth, false) : [];
          const explanationLines = measure(item.explanation, 10, innerWidth, false);
          const docsNoteLines = item.docsNote ? measure(item.docsNote, 10, innerWidth, false) : [];

          const lh11 = 11.5 * 1.4;
          const lh10 = 10 * 1.4;
          const cardHeight =
            pad +
            10 * 1.3 + 8 +
            questionLines.length * lh11 + 8 +
            yourAnswerLines.length * lh10 +
            correctAnswerLines.length * lh10 +
            (explanationLines.length ? explanationLines.length * lh10 + 6 : 0) +
            (docsNoteLines.length ? docsNoteLines.length * lh10 + 4 : 0) +
            pad;

          // Keep a whole card together: if it can't fit on the remainder of the page, start a fresh page.
          if (y + cardHeight > pageHeight - marginBottom && cardHeight <= pageHeight - marginBottom - 56) {
            doc.addPage();
            y = 56;
          }

          const cardTop = y;
          let cy = y + pad;

          setFont(8.5, true);
          doc.setTextColor(...COLOR.muted2);
          doc.text(headLine.toUpperCase(), marginX + pad, cy);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          doc.text(statusLine, marginX + maxWidth - pad, cy, { align: 'right' });
          cy += 8 + 8;

          setFont(11.5, true);
          doc.setTextColor(...COLOR.text);
          questionLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh11; });
          cy += 4;

          setFont(10, false);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          yourAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });

          if (!isCorrect) {
            doc.setTextColor(...COLOR.goodSolid);
            correctAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (explanationLines.length) {
            cy += 6;
            setFont(10, false);
            doc.setTextColor(...COLOR.text);
            explanationLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (docsNoteLines.length) {
            cy += 4;
            setFont(10, false);
            doc.setTextColor(...COLOR.muted);
            docsNoteLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          doc.setDrawColor(...COLOR.border);
          doc.setLineWidth(1);
          doc.roundedRect(marginX, cardTop, maxWidth, cardHeight, 6, 6, 'S');
          doc.setTextColor(...COLOR.text);

          y = cardTop + cardHeight + 10;
        });

        doc.save(`quiz-results-${new Date().toISOString().slice(0, 10)}.pdf`);
      }

      function renderResults() {
        const a = state.attempt;
        const total = a.pool.length;
        const correctCount = a.pool.reduce((acc, item, idx) => acc + (a.answers[idx] === item.answer ? 1 : 0), 0);
        const pct = Math.round((correctCount / total) * 100) || 0;

        const byDomain = DOMAINS.map((d) => {
          const items = a.pool.map((item, idx) => ({ item, idx })).filter(({ item }) => item.domain === d.id);
          const correct = items.reduce((acc, { item, idx }) => acc + (a.answers[idx] === item.answer ? 1 : 0), 0);
          return { ...d, attempted: items.length, correct };
        }).filter((d) => d.attempted > 0);

        const breakdownMarkup = byDomain.map((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          return `
            <div class="breakdown-row">
              <div class="name">${d.code} · ${d.name}</div>
              <div class="track"><div class="fill" style="width:${domainPct}%"></div></div>
              <div class="num">${d.correct}/${d.attempted}</div>
            </div>
          `;
        }).join('');

        const reviewMarkup = a.pool.map((item, idx) => {
          const domain = DOMAINS.find((d) => d.id === item.domain);
          const selected = a.answers[idx];
          const isCorrect = selected === item.answer;
          const selectedText = selected !== null ? `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}` : 'No answer';
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;
          return `
            <article class="review-card" aria-labelledby="reviewQuestion-${idx}">
              <div class="review-head">
                <span>${domain.code} · ${BADGE_LABELS[item.badge]} · item ${idx + 1}</span>
                <span>${isCorrect ? 'Correct' : 'Incorrect'}</span>
              </div>
              <h3 id="reviewQuestion-${idx}" class="review-question">${item.question}</h3>
              <div class="review-line ${isCorrect ? 'correct-line' : 'wrong-line'}">Your answer: ${selectedText}</div>
              ${!isCorrect ? `<div class="review-line correct-line">Correct answer: ${correctText}</div>` : ''}
              <div class="review-line">${item.explanation}</div>
              ${item.docsNote ? `<div class="review-line">${item.docsNote}</div>` : ''}
            </article>
          `;
        }).join('');

        app.innerHTML = `
          <header>
            <div class="eyebrow">Results${a.autoSubmitted ? ' · auto-submitted at zero' : ''}</div>
            <h1 class="title" id="resultsHeading" tabindex="-1">Attempt complete.</h1>
          </header>

          <nav class="start-row" aria-label="Results actions">
            <button id="retryBtn" class="btn btn-primary" type="button">New attempt</button>
            <button id="configBtn" class="btn btn-secondary" type="button">Change configuration</button>
            <button id="exportPdfBtn" class="btn btn-secondary" type="button">Export as PDF</button>
          </nav>

          <section class="section" role="region" aria-label="Score summary" style="margin-bottom: 50px;">
            <h2 id="scoreSummaryHeading" class="section-label">Score summary</h2>
            <div class="score-wrap">
              <div class="score-ring" style="--pct:${pct};"><span>${pct}%</span></div>
              <div class="domain-breakdown">${breakdownMarkup}</div>
            </div>
          </section>

          <section class="section" role="region" aria-label="Item-by-item review">
            <h2 id="reviewHeading" class="section-label">Item-by-item review</h2>
            ${reviewMarkup}
          </section>
        `;

        document.getElementById('retryBtn').addEventListener('click', () => {
          state.attempt = null;
          state.view = 'exam';
          startAttempt();
        });

        document.getElementById('configBtn').addEventListener('click', () => {
          state.attempt = null;
          state.view = 'config';
          renderConfig();
        });

        document.getElementById('exportPdfBtn').addEventListener('click', () => {
          exportResultsToPdf(a, correctCount, total, pct, byDomain);
        });

        document.getElementById('resultsHeading').focus();
        announce(`Attempt complete. You scored ${correctCount} of ${total}, ${pct}%.`);
      }

      renderConfig();
    </script>
  </body>
</html>
