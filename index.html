      // material or to official Anthropic documentation.
      function isExamEligible(item) {
        return Boolean(item.sourceScenario) && item.sourceTier !== 'modelKnowledge';
      }

      const HISTORY_KEY = 'devFoundationPractice.itemHistory.v1';

      function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); }
        catch { return {}; }
      }

      function recordAnswer(itemId, correct) {
        const history = loadHistory();
        const entry = history[itemId] || { seen: 0, correct: 0 };
        entry.seen += 1;
        if (correct) entry.correct += 1;
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ ...history, [itemId]: entry }));
      }

      const ATTEMPT_KEY = 'devFoundationPractice.attempt.v1';
      const LAST_RESULTS_KEY = 'devFoundationPractice.lastResults.v1';

      // timerId is a live interval handle, not serializable/meaningful across reloads
      function saveAttempt() {
        const { timerId, ...serializable } = state.attempt;
        localStorage.setItem(ATTEMPT_KEY, JSON.stringify({ config, attempt: serializable }));
      }

      function loadSavedAttempt() {
        try { return JSON.parse(localStorage.getItem(ATTEMPT_KEY) || 'null'); }
        catch { return null; }
      }

      function clearSavedAttempt() {
        localStorage.removeItem(ATTEMPT_KEY);
      }

      // Kept separate from ATTEMPT_KEY so a finished attempt's results can be restored
      // after following a reference link out to a module page and back.
      function saveLastResults() {
        const { timerId, ...serializable } = state.attempt;
        localStorage.setItem(LAST_RESULTS_KEY, JSON.stringify({ config, attempt: serializable }));
      }

      function clearLastResults() {
        localStorage.removeItem(LAST_RESULTS_KEY);
      }

      // Wipes per-item history and any in-progress attempt, returning to a clean config screen
      function resetAllProgress() {
        if (!confirm('Clear all saved progress? This removes your item history and any in-progress attempt on this device.')) return;
        localStorage.removeItem(HISTORY_KEY);
        clearSavedAttempt();
        state.attempt = null;
        state.view = 'config';
        renderConfig();
        announce('All progress cleared.');
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(secureRandomFraction() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function secureRandomFraction() {
        return crypto.getRandomValues(new Uint32Array(1))[0] / (0xffffffff + 1);
      }

      function materialize(item, answerSlot) {
        const distractorOrder = shuffle(item.options.map((_, idx) => idx).filter((idx) => idx !== item.answer));
        const order = distractorOrder.slice();
        order.splice(answerSlot, 0, item.answer);
        return {
          ...item,
          options: order.map((idx) => item.options[idx]),
          answer: answerSlot
        };
      }

      function materializeBalanced(items) {
        const answerSlots = shuffle(items.map((_, idx) => idx % 5));
        return items.map((item, idx) => materialize(item, answerSlots[idx]));
      }

      function completeAnswerBlocks(items) {
        return items.slice(0, items.length - (items.length % 5));
      }

      function stratifiedDraw(bank, total, prioritizeHard) {
        const quotas = DOMAINS.map((d, index) => {
          const available = bank.filter((item) => item.domain === d.id).length;
          const exact = d.count * total / TOTAL_ITEMS;
          return { id: d.id, index, count: Math.floor(exact), remainder: exact % 1, available };
        });
        if (quotas.some((quota) => quota.count > quota.available)) throw new Error('Not enough scenario questions for the requested exam form.');
        let remaining = total - quotas.reduce((sum, quota) => sum + quota.count, 0);
        for (const quota of [...quotas].sort((a, b) => b.remainder - a.remainder || a.index - b.index)) {
          if (remaining === 0) break;
          if (quota.count < quota.available) {
            quota.count += 1;
            remaining -= 1;
          }
        }
        if (remaining !== 0) throw new Error('Not enough questions for the requested exam form.');
        let result = [];
        quotas.forEach((quota) => {
          const domainItems = bank.filter((item) => item.domain === quota.id);
          let ordered;
          if (prioritizeHard) {
            const hardItems = shuffle(domainItems.filter((i) => i.difficulty === 'hard'));
            const restItems = shuffle(domainItems.filter((i) => i.difficulty !== 'hard'));
            ordered = hardItems.concat(restItems);
          } else {
            ordered = shuffle(domainItems);
          }
          result = result.concat(ordered.slice(0, quota.count));
        });
        return result;
      }

      const EXAM_FORM_SIZE = Math.min(60, TOTAL_ITEMS);
      const EXAM_FORM_MINUTES = 120;
      const PASS_SCORE = 720;

      // Weights a per-domain percent-correct into a 0-1000 grade. A domain with no
      // attempted items drops out and its weight is redistributed proportionally
      // among the domains that were assessed.
      function computeWeightedScore(byDomainAll) {
        const assessed = byDomainAll.filter((d) => d.attempted > 0);
        const assessedWeight = assessed.reduce((sum, d) => sum + d.weight, 0);
        const fraction = assessedWeight
          ? assessed.reduce((sum, d) => sum + (d.correct / d.attempted) * (d.weight / assessedWeight), 0)
          : 0;
        const points = Math.round(fraction * 1000);
        return { points, pct: Math.round(fraction * 100), passed: points >= PASS_SCORE, assessed };
      }

      const config = {
        form: 'studySet',
        domainFocus: 'all',
        difficulty: 'mixed',
        evidentiary: 'allBadged',
        itemSelection: 'preferUnseen',
        feedback: 'perItem',
        clock: 'timed'
      };

      const state = { view: 'config', attempt: null };
      // Answer idx to focus after the next renderExam() rebuild, set by keyboard nav
      let pendingAnswerFocus = null;
      // Whether the question map panel is expanded; a UI preference, not part of attempt data
      let questionMapOpen = false;
      let questionMapFilter = 'overview';
      let questionMapWidth = 280;
      let questionMapFilterHeight = 220;
      let resultsFilter = 'all';

      function buildPool() {
        let pool = ITEM_BANK.slice();

        if (config.form === 'examForm') {
          pool = stratifiedDraw(ITEM_BANK.filter(isExamEligible), EXAM_FORM_SIZE, true);
        } else {
          if (config.domainFocus !== 'all') {
            pool = pool.filter((i) => i.domain === config.domainFocus);
          }
          if (config.evidentiary === 'guideOnly') {
            pool = pool.filter((i) => i.sourceTier === 'course');
          }

          if (config.form === 'hardDrill') {
            const hardItems = pool.filter((i) => i.difficulty === 'hard');
            const standardItems = shuffle(pool.filter((i) => i.difficulty !== 'hard'));
            const target = Math.max(10, hardItems.length);
            pool = hardItems.concat(standardItems).slice(0, Math.min(target, pool.length));
          } else if (config.form === 'studySet') {
            if (config.difficulty === 'standard') {
              // 'standard' includes recall-tier items; only hard items are excluded
              pool = pool.filter((i) => i.difficulty !== 'hard');
            } else if (config.difficulty === 'hardWeighted') {
              const hardItems = pool.filter((i) => i.difficulty === 'hard');
              const standardItems = pool.filter((i) => i.difficulty !== 'hard');
              pool = hardItems.concat(standardItems);
            }
          }
        }

        const history = loadHistory();
        if (config.itemSelection === 'preferUnseen') {
          pool = pool.slice().sort((a, b) => (history[a.id]?.seen || 0) - (history[b.id]?.seen || 0));
        }

        return shuffle(pool);
      }

      const app = document.getElementById('app');

      function formatClock(totalSeconds) {
        const m = Math.floor(Math.max(0, totalSeconds) / 60);
        const s = Math.max(0, totalSeconds) % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }

      const START_LABELS = { examForm: 'Start exam form', hardDrill: 'Start hard drill' };

      function sectionNote(show, text) {
        return show ? `<span class="section-note">${text}</span>` : '';
      }

      function renderOptionCards(cards, groupKey, selectedKey) {
        return cards.map((c) => `
          <button type="button" class="option-card ${selectedKey === c.key ? 'selected' : ''}" data-group="${groupKey}" data-key="${c.key}" aria-pressed="${selectedKey === c.key}">
            <span class="option-title">${c.title}</span>
            <span class="option-description">${c.desc}</span>
          </button>
        `).join('');
      }

      function renderOptionChips(cards, groupKey, selectedKey) {
        return cards.map((c) => `
          <button type="button" class="option-card ${selectedKey === c.key ? 'selected' : ''}" data-group="${groupKey}" data-key="${c.key}" aria-pressed="${selectedKey === c.key}">
            <span class="option-title">${c.code ? `${c.code}` : c.name}</span>
            ${c.code ? `<span class="option-description">${c.name}</span>` : ''}
          </button>
        `).join('');
      }

      function renderConfig() {
        const disabledStudyOnly = config.form === 'examForm';
        const disabledAttr = disabledStudyOnly ? 'disabled' : '';

        const domainBars = [...DOMAINS].sort((a, b) => b.pct - a.pct);
        const maxPct = Math.max(...domainBars.map((d) => d.pct));

        const domainBarsMarkup = domainBars.map((d) => `
          <div class="domain-bar-card">
            <div class="domain-bar-pct">${d.pct}%</div>
            <div class="domain-bar-name">${d.code} — ${d.name}</div>
            <div class="domain-bar-track">
              <div class="domain-bar-fill" style="width:${Math.round((d.pct / maxPct) * 100)}%"></div>
            </div>
          </div>
        `).join('');

        const formCards = [
          { key: 'examForm', title: 'Exam form', desc: `${EXAM_FORM_SIZE} scenario items · ${EXAM_FORM_MINUTES} min · 1000-point grade · hard-tier items prioritized` },
          { key: 'studySet', title: 'Study set', desc: 'The largest complete five-item block matching your domain, difficulty, and evidence filters' },
          { key: 'hardDrill', title: 'Hard drill', desc: 'Hard-tier items only, topped up with standard items if a domain runs short' }
        ];

        const domainChips = [{ key: 'all', code: '', name: 'All domains' }].concat(
          DOMAINS.map((d) => ({ key: d.id, code: d.code, name: d.name }))
        );

        const difficultyCards = [
          { key: 'standard', title: 'Standard', desc: 'Baseline items only' },
          { key: 'mixed', title: 'Mixed', desc: 'Roughly a fifth hard items, matching the overall bank' },
          { key: 'hardWeighted', title: 'Hard-weighted', desc: 'Every hard item available, topped up with standard' }
        ];

        const evidentiaryCards = [
          { key: 'allBadged', title: 'All items, badged', desc: 'Inferred and judgment-call items are labelled in place' },
          { key: 'guideOnly', title: 'Official course material only', desc: 'Exclude items drawn from Anthropic docs or model knowledge' }
        ];

        const itemSelectionCards = [
          { key: 'preferUnseen', title: 'Prefer unseen', desc: 'Draw items you have not answered before, when available' },
          { key: 'fullyRandom', title: 'Fully random', desc: 'Ignore attempt history' }
        ];

        const feedbackCards = [
          { key: 'perItem', title: 'Check per item', desc: 'Nothing is revealed on selection; check answer whenever you choose to, per item' },
          { key: 'end', title: 'Hold until the end', desc: 'No per-item checking; every explanation appears in the final review' }
        ];

        const clockCards = [
          { key: 'timed', title: 'Timed', desc: 'Counts down, auto-submits at zero' },
          { key: 'untimed', title: 'Untimed', desc: 'Counts up, no cutoff' }
        ];

        const startLabel = START_LABELS[config.form] || 'Start study set';

        app.innerHTML = `
          <header>
            <div class="eyebrow">Unofficial practice instrument · ${TOTAL_ITEMS} items · ${DOMAINS.length} study domains · ${TOTAL_HARD} hard-tier</div>
            <h1 class="title">Sit a scored mock built from your study modules.</h1>
            <p class="lede">
              These five study modules reproduce official-course content, plus clearly marked supplementary sections drawn from
              Anthropic documentation; the quiz is an unofficial practice tool, not an official mock exam.
              Use the official course and mock exams as primary preparation. Every item carries a chip naming where its substance
              came from, and the bars below show this question bank's distribution, which is built to the exam blueprint weights.
              Exam forms use a 120-minute countdown and report a 0–1000 grade, domain-weighted to the official exam blueprint
              (${DOMAINS.map((d) => `${d.code} ${d.weight}%`).join(' · ')}), with a pass mark of 720/1000. A domain with no attempted items has its
              weight redistributed proportionally among the others. The real exam reports a scaled score from 100–1,000 plus your
              percent-correct by domain, so treat this score as a readiness gauge rather than a prediction of your scaled score.
              Keys are checked against the module files in this repository. Where an item turns on a specific parameter, flag, or API constraint,
              a <strong>Docs note</strong> records the exact detail named in the modules. <strong>Unbadged</strong> means the modules state the answer
              directly. <strong>Inferred</strong> extends a documented principle to a case the modules do not directly address.
              <strong>Judgment call</strong> means the modules are silent on the deciding factor and the key reflects the author's reasoning.
            </p>
          </header>

          <section class="section" role="region" aria-label="Question bank distribution">
            <h2 id="domainCoverageHeading" class="section-label">Question bank distribution</h2>
            <div class="domain-bars">${domainBarsMarkup}</div>
          </section>

          <section class="section" role="region" aria-label="Form settings">
            <fieldset class="section-group">
              <legend id="formSectionHeading" class="section-label">Form</legend>
              <div class="option-grid">${renderOptionCards(formCards, 'form', config.form)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Domain focus settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="domainFocusSectionHeading" class="section-label">Domain focus <span class="section-note">study modes only — exam forms draw across all eight domains</span></legend>
              <div class="option-grid chips">${renderOptionChips(domainChips, 'domainFocus', config.domainFocus)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Difficulty settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="difficultySectionHeading" class="section-label">Difficulty mix</legend>
              <div class="option-grid">${renderOptionCards(difficultyCards, 'difficulty', config.difficulty)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Evidentiary basis settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="evidenceSectionHeading" class="section-label">Evidentiary basis</legend>
              <div class="option-grid">${renderOptionCards(evidentiaryCards, 'evidentiary', config.evidentiary)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Item selection settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="selectionSectionHeading" class="section-label">Item selection ${sectionNote(disabledStudyOnly, 'exam forms are always fully random')}</legend>
              <div class="option-grid">${renderOptionCards(itemSelectionCards, 'itemSelection', config.itemSelection)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Feedback settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="feedbackSectionHeading" class="section-label">Feedback ${sectionNote(disabledStudyOnly, 'exam forms always hold feedback until the end')}</legend>
              <div class="option-grid">${renderOptionCards(feedbackCards, 'feedback', config.feedback)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledAttr}" role="region" aria-label="Clock settings">
            <fieldset class="section-group" ${disabledAttr}>
              <legend id="clockSectionHeading" class="section-label">Clock ${sectionNote(disabledStudyOnly, 'exam forms are always timed')}</legend>
              <div class="option-grid">${renderOptionCards(clockCards, 'clock', config.clock)}</div>
            </fieldset>
          </section>

          <section class="start-row" role="region" aria-label="Start attempt">
            <button id="startBtn" class="btn btn-primary" type="button">${startLabel}</button>
            <button id="resetProgressBtn" class="btn btn-secondary" type="button">Clear progress &amp; reset session</button>
            <div class="start-note">
              Item and option order are shuffled on every attempt. Scores, per-item history, and an in-progress attempt persist between sittings in this browser; nothing leaves this device.
            </div>
          </section>
        `;

        const examLockedGroups = new Set(['clock', 'itemSelection', 'feedback']);
        app.querySelectorAll('.option-card[data-group]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (examLockedGroups.has(btn.dataset.group) && config.form === 'examForm') return;
            config[btn.dataset.group] = btn.dataset.key;
            // Exam forms are a proctored, fixed-time simulation — always timed, fully random, feedback held until the end
            if (btn.dataset.group === 'form' && config.form === 'examForm') {
              config.clock = 'timed';
              config.itemSelection = 'fullyRandom';
              config.feedback = 'end';
            }
            renderConfig();
          });
        });

        document.getElementById('startBtn').addEventListener('click', startAttempt);
        document.getElementById('resetProgressBtn').addEventListener('click', resetAllProgress);
      }

      function startAttempt() {
        const rawPool = config.form === 'examForm' ? buildPool() : completeAnswerBlocks(buildPool());
        const pool = materializeBalanced(rawPool);

        questionMapOpen = false;
        questionMapFilter = 'overview';
        resultsFilter = 'all';

        const startedAt = Date.now();
        const studySeconds = config.clock === 'timed' ? pool.length * 120 : 0;
        const totalSeconds = config.form === 'examForm' ? EXAM_FORM_MINUTES * 60 : studySeconds;

        state.attempt = {
          pool,
          index: 0,
          answers: new Array(pool.length).fill(null),
          flagged: new Array(pool.length).fill(false),
          checked: new Array(pool.length).fill(false),
          startedAt,
          deadlineAt: config.form === 'examForm' ? startedAt + totalSeconds * 1000 : null,
          remainingSeconds: totalSeconds,
          elapsedSeconds: 0,
          timerId: null,
          autoSubmitted: false
        };

        state.view = 'exam';
        renderExam();
        syncTimerInterval();
        saveAttempt();
      }

      // Exam form is proctored-style and keeps running in the background; study set and hard drill pause
      function shouldPauseOnBlur() {
        return config.form !== 'examForm';
      }

      function syncExamDeadline() {
        const a = state.attempt;
        if (!a || config.form !== 'examForm' || state.view !== 'exam') return false;
        a.remainingSeconds = Math.max(0, Math.ceil((a.deadlineAt - Date.now()) / 1000));
        if (a.remainingSeconds > 0) return false;
        a.autoSubmitted = true;
        announce('Time expired. Attempt submitted.');
        finishAttempt();
        return true;
      }

      // Starts or stops the interval to match tab visibility; also used to resume after a reload
      function syncTimerInterval() {
        const a = state.attempt;
        if (!a || a.autoSubmitted || !(config.clock === 'timed' || config.clock === 'untimed')) return;
        if (syncExamDeadline()) return;
        const timerEl = document.getElementById('timerDisplay');
        if (timerEl && config.form === 'examForm') timerEl.textContent = formatClock(a.remainingSeconds);
        // document.hidden only reflects tab switches; document.hasFocus() also catches OS-level window blur (e.g. alt-tab)
        const isBackgrounded = (document.hidden || !document.hasFocus()) && shouldPauseOnBlur();
        if (!isBackgrounded && !a.timerId) {
          a.timerId = setInterval(tickTimer, 1000);
        } else if (isBackgrounded && a.timerId) {
          clearInterval(a.timerId);
          a.timerId = null;
        }
      }

      document.addEventListener('visibilitychange', syncTimerInterval);
      window.addEventListener('blur', syncTimerInterval);
      window.addEventListener('focus', syncTimerInterval);

      function tickTimer() {
        const a = state.attempt;
        if (!a) return;

        if (config.form === 'examForm') {
          if (syncExamDeadline()) return;
        } else if (config.clock === 'timed') {
          a.remainingSeconds -= 1;
          if (a.remainingSeconds <= 0) {
            a.remainingSeconds = 0;
            a.autoSubmitted = true;
            clearInterval(a.timerId);
            announce('Time expired. Attempt submitted.');
            finishAttempt();
            return;
          }
        } else {
          a.elapsedSeconds += 1;
        }

        const timerEl = document.getElementById('timerDisplay');
        if (timerEl) {
          timerEl.textContent = config.clock === 'timed' ? formatClock(a.remainingSeconds) : formatClock(a.elapsedSeconds);
          timerEl.classList.toggle('low', config.clock === 'timed' && a.remainingSeconds <= 30);
        }
        saveAttempt();
      }

      function selectAnswer(idx) {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = idx;
        renderExam();
        saveAttempt();
      }

      function checkAnswer() {
        const a = state.attempt;
        if (a.checked[a.index] || a.answers[a.index] === null) return;
        const item = a.pool[a.index];
        a.checked[a.index] = true;
        const isCorrect = a.answers[a.index] === item.answer;
        recordAnswer(item.id, isCorrect);
        announce(isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`);
        renderExam();
        saveAttempt();
      }

      function clearSelection() {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = null;
        renderExam();
        saveAttempt();
      }

      function goNext() {
        const a = state.attempt;
        if (a.index < a.pool.length - 1) {
          a.index += 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
          saveAttempt();
        } else {
          requestSubmit();
        }
      }

      function goPrev() {
        const a = state.attempt;
        if (a.index > 0) {
          a.index -= 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
          saveAttempt();
        }
      }

      function toggleFlag() {
        const a = state.attempt;
        a.flagged[a.index] = !a.flagged[a.index];
        renderExam();
        saveAttempt();
      }

      function jumpToQuestion(index) {
        const a = state.attempt;
        if (index < 0 || index >= a.pool.length) return;
        a.index = index;
        renderExam();
        document.getElementById('questionHeading').focus();
        saveAttempt();
      }

      function toggleQuestionMap() {
        questionMapOpen = !questionMapOpen;
        renderExam();
      }

      function setQuestionMapFilter(filter) {
        questionMapFilter = filter;
        renderExam();
      }

      function requestSubmit() {
        const a = state.attempt;
        if (!a || state.view !== 'exam') return;
        const unanswered = a.answers.filter((answer) => answer === null).length;
        const flagged = a.flagged.filter(Boolean).length;
        if (confirm(`Submit this attempt? ${unanswered} unanswered and ${flagged} flagged for review. You cannot change answers after submission.`)) finishAttempt();
      }

      function finishAttempt() {
        if (state.view !== 'exam') return;
        const a = state.attempt;
        a.pool.forEach((item, idx) => {
          if (!a.checked[idx] && (config.form === 'examForm' || a.answers[idx] !== null)) {
            recordAnswer(item.id, a.answers[idx] === item.answer);
          }
        });
        if (a.timerId) clearInterval(a.timerId);
        clearSavedAttempt();
        state.view = 'results';
        renderResults();
        saveLastResults();
      }

      // Descriptor for whatever currently has focus, used to restore it after an innerHTML rebuild
      function captureFocusTarget() {
        if (pendingAnswerFocus !== null) {
          const idx = pendingAnswerFocus;
          pendingAnswerFocus = null;
          return { idx };
        }
        const activeEl = document.activeElement;
        if (!activeEl) return null;
        if (activeEl.classList && activeEl.classList.contains('answer-row')) {
          return { idx: Number(activeEl.dataset.idx) };
        }
        if (activeEl.id) return { id: activeEl.id };
        return null;
      }

      function restoreFocusTarget(focusTarget) {
        if (!focusTarget) return;
        if (focusTarget.idx !== undefined) {
          const row = app.querySelector(`.answer-row[data-idx="${focusTarget.idx}"]`) || app.querySelector('.answer-row[tabindex="0"]');
          if (row) row.focus();
        } else if (focusTarget.id) {
          const el = document.getElementById(focusTarget.id) || document.getElementById('nextBtn') || document.getElementById('questionHeading');
          if (el) el.focus();
        }
      }

      // Arrow keys move+select (roving tabindex), Home/End jump to the ends, Space/Enter select the focused option
      function resolveAnswerKeyIdx(e, idx, last) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') return idx === last ? 0 : idx + 1;
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') return idx === 0 ? last : idx - 1;
        if (e.key === 'Home') return 0;
        if (e.key === 'End') return last;
        if (e.key === ' ' || e.key === 'Enter') return idx;
        return null;
      }

      function renderAnswerRows(item, selected, checked, locked) {
        const tabbableIdx = selected !== null ? selected : 0;
        return item.options.map((opt, idx) => {
          const letter = String.fromCodePoint(65 + idx);
          const classes = ['answer-row'];
          if (locked) classes.push('locked');
          if (selected === idx) classes.push('selected');
          if (checked && idx === item.answer) classes.push('correct');
          if (checked && selected === idx && idx !== item.answer) classes.push('wrong');
          return `
            <div class="${classes.join(' ')}" data-idx="${idx}" role="radio" tabindex="${idx === tabbableIdx ? '0' : '-1'}" aria-checked="${selected === idx}" aria-label="Option ${letter}: ${opt}"${locked ? ' aria-disabled="true"' : ''}>
              <div class="answer-letter">${letter}</div>
              <div>${opt}</div>
            </div>
          `;
        }).join('');
      }

      function renderReferencesMarkup(item, fromResults) {
        if (!Array.isArray(item.references) || item.references.length === 0) return '';
        const links = item.references.map((ref) => {
          const badgeText = ref.type === 'web' ? 'Web' : 'Module';
          // Local module links carry a marker so the module page's back-link can return here.
          // Must be inserted before any #fragment, or it becomes part of the fragment instead of the query string.
          let href = ref.href;
          if (fromResults && ref.type !== 'web') {
            const hashIdx = href.indexOf('#');
            const base = hashIdx === -1 ? href : href.slice(0, hashIdx);
            const hash = hashIdx === -1 ? '' : href.slice(hashIdx);
            const separator = base.includes('?') ? '&' : '?';
            href = `${base}${separator}from=results${hash}`;
          }
          return `
            <li>
              <a class="ref-link" data-ref-type="${ref.type}" href="${href}" target="_blank" rel="noopener noreferrer">
                <span class="ref-badge">${badgeText}</span>
                <span>${ref.label}</span>
                <span class="sr-only">(opens in new tab)</span>
              </a>
            </li>
          `;
        }).join('');
        return `<ul class="ref-list" aria-label="Supporting references">${links}</ul>`;
      }

      function renderScenarioMarkup(item) {
        const scenario = SCENARIOS.get(item.sourceScenario?.n);
        if (!scenario) return '';
        return `
          <aside class="scenario-context" aria-label="Scenario ${item.sourceScenario.n}: ${scenario.title}">
            <p class="scenario-context-label">Scenario ${item.sourceScenario.n}</p>
            <h3>${scenario.title}</h3>
            <p>${scenario.description}</p>
          </aside>
        `;
      }

      function renderExplanationMarkup(item, selected, checked) {
        if (!checked) return '';
        const isCorrect = selected === item.answer;
        const headerText = isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`;
        const docsNoteMarkup = item.docsNote ? `<div class="docs-note-box"><strong>${item.docsNote}</strong></div>` : '';
        const referencesMarkup = renderReferencesMarkup(item);
        return `
          <section role="region" aria-label="Answer feedback">
            <div class="explanation-box ${isCorrect ? 'is-correct' : 'is-wrong'}" role="status" aria-live="polite" aria-atomic="true">
              <div class="explanation-label">${headerText}</div>
              <div>${item.explanation}</div>
            </div>
            ${docsNoteMarkup}
            ${referencesMarkup}
          </section>
        `;
      }

      function renderTimerMarkup(a) {
        if (config.clock === 'timed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time remaining">${formatClock(a.remainingSeconds)}</div>`;
        }
        if (config.clock === 'untimed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time elapsed">${formatClock(a.elapsedSeconds)}</div>`;
        }
        return '';
      }

      function renderCheckRowMarkup(manualMode, checked, selected) {
        if (!manualMode || checked) return '';
        const disabledAttr = selected === null ? 'disabled' : '';
        return `
          <div class="check-row">
            <button id="checkBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Check answer</button>
            <button id="clearBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Clear selection</button>
          </div>
        `;
      }

      function renderSubmitEarlyMarkup(a) {
        const remaining = a.pool.length - a.index - 1;
        if (remaining <= 0) return '';
        const questionWord = remaining !== 1 ? 'questions' : 'question';
        return `<button id="submitEarlyBtn" class="btn btn-secondary" type="button" title="Submit your exam now and view results (you have ${remaining} more ${questionWord} remaining)">Submit early</button>`;
      }

      function bindExamEvents(item, locked) {
        app.querySelectorAll('.answer-row').forEach((row) => {
          row.addEventListener('click', () => {
            if (locked) return;
            selectAnswer(Number(row.dataset.idx));
          });
        });

        app.querySelector('.answer-list').addEventListener('keydown', (e) => {
          const row = e.target.closest('.answer-row');
          if (!row || locked) return;
          const idx = Number(row.dataset.idx);
          const nextIdx = resolveAnswerKeyIdx(e, idx, item.options.length - 1);
          if (nextIdx === null) return;
          e.preventDefault();
          pendingAnswerFocus = nextIdx;
          selectAnswer(nextIdx);
        });

        document.getElementById('prevBtn').addEventListener('click', goPrev);
        document.getElementById('nextBtn').addEventListener('click', goNext);
        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn) checkBtn.addEventListener('click', checkAnswer);
        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearSelection);
        const submitEarlyBtn = document.getElementById('submitEarlyBtn');
        if (submitEarlyBtn) submitEarlyBtn.addEventListener('click', requestSubmit);
        const flagBtn = document.getElementById('flagBtn');
        if (flagBtn) flagBtn.addEventListener('click', toggleFlag);
        const questionMapToggle = document.getElementById('questionMapToggle');
        if (questionMapToggle) questionMapToggle.addEventListener('click', toggleQuestionMap);
        const questionMapClose = document.getElementById('questionMapClose');
        if (questionMapClose) questionMapClose.addEventListener('click', toggleQuestionMap);
        const navigatorSubmitBtn = document.getElementById('navigatorSubmitBtn');
        if (navigatorSubmitBtn) navigatorSubmitBtn.addEventListener('click', requestSubmit);
        const navigatorResizeHandle = document.getElementById('navigatorResizeHandle');
        if (navigatorResizeHandle) {
          const updateNavigatorWidth = (width) => {
            questionMapWidth = Math.round(Math.min(420, Math.max(230, width)));
            const layout = navigatorResizeHandle.closest('.exam-layout');
            if (layout) layout.style.setProperty('--navigator-width', `${questionMapWidth}px`);
          };
          navigatorResizeHandle.addEventListener('pointerdown', (event) => {
            if (window.matchMedia('(max-width: 1100px)').matches) return;
            event.preventDefault();
            const startX = event.clientX;
            const startWidth = questionMapWidth;
            navigatorResizeHandle.setPointerCapture(event.pointerId);
            const onPointerMove = (moveEvent) => updateNavigatorWidth(startWidth + moveEvent.clientX - startX);
            const onPointerUp = () => {
              navigatorResizeHandle.removeEventListener('pointermove', onPointerMove);
              navigatorResizeHandle.removeEventListener('pointerup', onPointerUp);
            };
            navigatorResizeHandle.addEventListener('pointermove', onPointerMove);
            navigatorResizeHandle.addEventListener('pointerup', onPointerUp);
          });
          navigatorResizeHandle.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') updateNavigatorWidth(questionMapWidth - 16);
            if (event.key === 'ArrowRight') updateNavigatorWidth(questionMapWidth + 16);
          });
        }
        const filterResizeHandle = document.getElementById('filterResizeHandle');
        if (filterResizeHandle) {
          const updateFilterHeight = (height) => {
            const navigator = filterResizeHandle.closest('.exam-navigator');
            const maxHeight = Math.max(120, (navigator?.clientHeight || 640) - 220);
            questionMapFilterHeight = Math.round(Math.min(maxHeight, Math.max(120, height)));
            if (navigator) navigator.style.setProperty('--filter-height', `${questionMapFilterHeight}px`);
            filterResizeHandle.setAttribute('aria-valuenow', String(questionMapFilterHeight));
          };
          filterResizeHandle.addEventListener('pointerdown', (event) => {
            if (window.matchMedia('(max-width: 1100px)').matches) return;
            event.preventDefault();
            const startY = event.clientY;
            const startHeight = questionMapFilterHeight;
            filterResizeHandle.setPointerCapture(event.pointerId);
            const onPointerMove = (moveEvent) => updateFilterHeight(startHeight + moveEvent.clientY - startY);
            const onPointerUp = () => {
              filterResizeHandle.removeEventListener('pointermove', onPointerMove);
              filterResizeHandle.removeEventListener('pointerup', onPointerUp);
            };
            filterResizeHandle.addEventListener('pointermove', onPointerMove);
            filterResizeHandle.addEventListener('pointerup', onPointerUp);
          });
          filterResizeHandle.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp') updateFilterHeight(questionMapFilterHeight - 16);
            if (event.key === 'ArrowDown') updateFilterHeight(questionMapFilterHeight + 16);
          });
        }
        app.querySelectorAll('[data-map-filter]').forEach((button) => {
          button.addEventListener('click', () => setQuestionMapFilter(button.dataset.mapFilter));
        });
        app.querySelectorAll('.question-jump').forEach((button) => {
          button.addEventListener('click', () => jumpToQuestion(Number(button.dataset.index)));
        });
      }

      function renderExam() {
        const a = state.attempt;
        const item = a.pool[a.index];
        const isExamForm = config.form === 'examForm';
        const domain = DOMAINS.find((d) => d.id === item.domain);
        const selected = a.answers[a.index];
        const manualMode = config.feedback === 'perItem';
        const checked = manualMode && a.checked[a.index];
        const locked = checked;

        const focusTarget = captureFocusTarget();

        const tierClass = item.sourceTier === 'course' ? '' : item.sourceTier;
        const answerRows = renderAnswerRows(item, selected, checked, locked);
        const explanationMarkup = renderExplanationMarkup(item, selected, checked);
        const timerMarkup = renderTimerMarkup(a);
        const checkRowMarkup = renderCheckRowMarkup(manualMode, checked, selected);
        const submitEarlyMarkup = renderSubmitEarlyMarkup(a);
        const isFlagged = a.flagged[a.index];
        const flagMarkup = `<button id="flagBtn" class="exam-flag-btn" type="button" aria-pressed="${isFlagged}"><span aria-hidden="true">${isFlagged ? '&#9733;' : '&#9734;'}</span>${isFlagged ? 'Flagged' : 'Flag'}</button>`;
        const questionMapToggleLabel = questionMapOpen ? 'Hide map' : 'Question map';
        const questionMapToggleMarkup = `<button id="questionMapToggle" class="exam-map-btn" type="button" aria-expanded="${questionMapOpen}" aria-controls="examNavigator"><span aria-hidden="true">&#9638;</span>${questionMapToggleLabel}</button>`;
        const answeredCount = a.answers.filter((answer) => answer !== null).length;
        const flaggedCount = a.flagged.filter(Boolean).length;
        const availableDomains = DOMAINS.filter((candidate) => a.pool.some((poolItem) => poolItem.domain === candidate.id));
        const currentFilter = questionMapFilter === 'flagged' || questionMapFilter === 'overview' || (!isExamForm && availableDomains.some((candidate) => candidate.id === questionMapFilter))
          ? questionMapFilter
          : 'overview';
        const visibleQuestionIndexes = a.pool.reduce((indexes, poolItem, idx) => {
          if (currentFilter === 'overview' || (currentFilter === 'flagged' && a.flagged[idx]) || (!isExamForm && poolItem.domain === currentFilter)) indexes.push(idx);
          return indexes;
        }, []);
        const currentFilterLabel = (() => {
          if (currentFilter === 'overview') return 'All questions';
          if (currentFilter === 'flagged') return 'Flagged questions';
          return availableDomains.find((candidate) => candidate.id === currentFilter).name;
        })();
        const navigatorFilters = [
          { id: 'overview', label: 'Overview', count: a.pool.length },
          { id: 'flagged', label: 'Flagged', count: flaggedCount },
          ...(!isExamForm ? availableDomains.map((candidate) => ({
            id: candidate.id,
            label: candidate.code,
            count: a.pool.filter((poolItem) => poolItem.domain === candidate.id).length
          })) : [])
        ];
        const questionNavigatorMarkup = `
          <aside class="exam-navigator ${questionMapOpen ? 'is-open' : ''}" id="examNavigator" aria-label="Exam navigator" style="--filter-height:${isExamForm ? 96 : questionMapFilterHeight}px">
            <div class="exam-navigator-head">
              <div>
                <p class="exam-navigator-kicker">Exam navigator</p>
                <h2>${a.pool.length - answeredCount} questions remaining</h2>
              </div>
              <button id="questionMapClose" class="exam-navigator-close" type="button" aria-label="Close question map">&times;</button>
            </div>
            <div class="exam-filter-list ${isExamForm ? 'is-compact' : ''}" role="tablist" aria-label="Filter questions">
              ${navigatorFilters.map((filter) => `<button type="button" class="exam-filter ${currentFilter === filter.id ? 'active' : ''}" data-map-filter="${filter.id}" role="tab" aria-selected="${currentFilter === filter.id}"><span>${filter.label}</span><span class="exam-filter-count">${filter.count}</span></button>`).join('')}
              ${!isExamForm ? `<div id="filterResizeHandle" class="exam-filter-resize-handle" role="separator" aria-label="Resize question filters" aria-orientation="horizontal" aria-valuemin="120" aria-valuenow="${questionMapFilterHeight}" tabindex="0"></div>` : ''}
            </div>
            <div class="exam-navigator-summary">
              <span>${currentFilterLabel}</span>
              <span>${visibleQuestionIndexes.length} shown</span>
            </div>
            <div class="question-grid exam-navigator-grid">${visibleQuestionIndexes.length ? visibleQuestionIndexes.map((idx) => `
              <button type="button" class="question-jump ${a.answers[idx] !== null ? 'answered' : ''} ${a.flagged[idx] ? 'flagged' : ''} ${idx === a.index ? 'current' : ''}" data-index="${idx}" aria-label="Question ${idx + 1}: ${a.answers[idx] === null ? 'unanswered' : 'answered'}${a.flagged[idx] ? ', flagged' : ''}" ${idx === a.index ? 'aria-current="step"' : ''}>${idx + 1}</button>
            `).join('') : '<p class="exam-filter-empty">No questions match this filter.</p>'}</div>
            <button id="navigatorSubmitBtn" class="exam-navigator-submit" type="button">Review &amp; submit</button>
            <div id="navigatorResizeHandle" class="exam-navigator-resize-handle" role="separator" aria-label="Resize exam navigator" aria-orientation="vertical" tabindex="0"></div>
          </aside>`;
        // Decorative per-question dots only make sense for reasonably short pools; longer pools rely on the progress bar instead.
        const dotsMarkup = a.pool.length <= 40
          ? `<div class="exam-dots" aria-hidden="true">${a.pool.map((_, idx) => `<span class="exam-dot ${idx === a.index ? 'current' : ''} ${a.answers[idx] !== null ? 'answered' : ''}"></span>`).join('')}</div>`
          : '<div class="exam-dots"></div>';

        app.innerHTML = `
          <div class="exam-layout" style="--navigator-width:${questionMapWidth}px">
          ${questionNavigatorMarkup}
          <main class="exam-main">
          <section class="exam-shell" role="region" aria-label="Question ${a.index + 1} of ${a.pool.length}">
            <h1 id="questionRegionHeading" class="sr-only">Question ${a.index + 1} of ${a.pool.length}</h1>
            <header class="exam-header">
              <div class="exam-header-meta">
                <span class="badge-tag ${tierClass}">${SOURCE_TIER_LABELS[item.sourceTier]}</span>
              </div>
              <div class="exam-header-right">
                ${timerMarkup}
                ${flagMarkup}
                ${questionMapToggleMarkup}
              </div>
            </header>

            <div class="progress-track" role="progressbar" aria-valuenow="${a.index + 1}" aria-valuemin="1" aria-valuemax="${a.pool.length}" aria-valuetext="Question ${a.index + 1} of ${a.pool.length}"><div class="progress-fill" style="width:${((a.index + 1) / a.pool.length) * 100}%"></div></div>

            <div class="exam-card">
              <span class="exam-watermark" aria-hidden="true">Q${String(a.index + 1).padStart(2, '0')}</span>
              <div class="exam-card-meta">
                <span class="exam-count">Question ${a.index + 1} of ${a.pool.length}</span>
                ${!isExamForm ? `<span class="exam-domain">${domain.name}</span>` : ''}
              </div>

              ${!isExamForm ? renderScenarioMarkup(item) : ''}
              <h2 id="questionHeading" class="question-text" tabindex="-1">${item.question}</h2>

              <section role="region" aria-label="Answer options">
                <div class="answer-list" role="radiogroup" aria-labelledby="questionHeading">${answerRows}</div>
              </section>
            </div>

            ${explanationMarkup}
          </section>

          <nav class="exam-bottom-nav" aria-label="Question navigation">
            <button id="prevBtn" class="exam-nav-btn" type="button" ${a.index === 0 ? 'disabled' : ''}><span aria-hidden="true">&larr;</span><span class="exam-nav-label">Previous</span></button>
            ${dotsMarkup}
            <button id="nextBtn" class="exam-nav-btn exam-nav-btn-primary" type="button"><span class="exam-nav-label">${a.index === a.pool.length - 1 ? 'Finish' : 'Next'}</span><span aria-hidden="true">&rarr;</span></button>
          </nav>
          <div class="exam-secondary-row">
            ${submitEarlyMarkup}
            ${checkRowMarkup}
          </div>
          </main>
          </div>
        `;

        bindExamEvents(item, locked);
        restoreFocusTarget(focusTarget);
      }

      function answerStatus(selected, answer) {
        if (selected === null) return 'Unanswered';
        return selected === answer ? 'Correct' : 'Incorrect';
      }

      // Builds a text-based (selectable) PDF via jsPDF, loaded from CDN in <head>,
      // styled to echo the live results page: colored text, bordered cards, and bar graphics.
      function exportResultsToPdf(reviewed, correctCount, total, points, pct, byDomain, passed) {
        if (!window.jspdf) {
          alert('PDF export could not load. Check your internet connection and try again.');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'letter' });
        const marginX = 48;
        const marginBottom = 48;
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const maxWidth = pageWidth - marginX * 2;
        let y = 56;

        // Palette mirrors the light-theme CSS custom properties so the PDF reads like the live page.
        const COLOR = {
          text: [20, 22, 26],
          muted: [107, 114, 128],
          muted2: [154, 161, 172],
          accent: [37, 99, 235],
          accentSolid: [29, 78, 216],
          accentBg: [238, 244, 255],
          good: [22, 163, 74],
          goodSolid: [21, 128, 61],
          goodBg: [234, 251, 241],
          bad: [220, 38, 38],
          badSolid: [185, 28, 28],
          badBg: [253, 236, 236],
          border: [227, 229, 234],
          borderStrong: [200, 205, 214],
        };

        const ensureSpace = (needed) => {
          if (y + needed > pageHeight - marginBottom) {
            doc.addPage();
            y = 56;
          }
        };

        const setFont = (size, bold) => {
          doc.setFontSize(size);
          doc.setFont('helvetica', bold ? 'bold' : 'normal');
        };

        const measure = (text, size, width, bold) => {
          setFont(size, bold);
          return doc.splitTextToSize(String(text), width);
        };

        const writeLines = (text, size, opts = {}) => {
          setFont(size, opts.bold);
          doc.setTextColor(...(opts.color || COLOR.text));
          const lines = doc.splitTextToSize(String(text), opts.width || maxWidth);
          const lh = size * 1.4;
          lines.forEach((line) => {
            ensureSpace(lh);
            doc.text(line, opts.x || marginX, y);
            y += lh;
          });
          doc.setTextColor(...COLOR.text);
        };

        // A rounded horizontal meter bar, matching .progress-track/.domain-bar-track visuals.
        const drawBar = (x, barY, w, h, pctValue, fillColor) => {
          const r = h / 2;
          doc.setFillColor(...COLOR.border);
          doc.roundedRect(x, barY, w, h, r, r, 'F');
          const fillW = Math.max(h, (w * Math.min(100, Math.max(0, pctValue))) / 100);
          doc.setFillColor(...fillColor);
          doc.roundedRect(x, barY, fillW, h, r, r, 'F');
        };

        // ---- Header ----
        writeLines('Anthropic Developer Foundation Study Quiz', 16, { bold: true });
        writeLines(`Results \u00b7 ${new Date().toLocaleString()}`, 10, { color: COLOR.muted });
        y += 10;

        // ---- Score summary ----
        writeLines('SCORE SUMMARY', 9, { bold: true, color: COLOR.muted2 });
        y += 4;
        ensureSpace(34);
        setFont(28, true);
        doc.setTextColor(...COLOR.accentSolid);
        doc.text(`${points} / 1000`, marginX, y + 22);
        setFont(12, true);
        doc.setTextColor(...(passed ? COLOR.goodSolid : COLOR.badSolid));
        doc.text(passed ? 'PASS' : 'BELOW PASS MARK (720)', marginX + 185, y + 12);
        doc.setTextColor(...COLOR.text);
        doc.text(`${pct}% · ${correctCount} / ${total} correct`, marginX + 185, y + 28);
        y += 34;
        drawBar(marginX, y, maxWidth, 8, pct, COLOR.accent);
        y += 26;

        writeLines('Domain-weighted grade: each domain\'s percent correct is multiplied by its exam weight, redistributed proportionally when a domain has no attempted items. Treat this as a readiness gauge, not a predicted scaled score.', 8.5, { color: COLOR.muted });
        y += 10;

        byDomain.forEach((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          ensureSpace(30);
          setFont(9.5, false);
          doc.setTextColor(...COLOR.muted);
          doc.text(`${d.code} \u00b7 ${d.name} (${d.weight}% weight)`, marginX, y);
          setFont(9.5, true);
          doc.setTextColor(...COLOR.text);
          doc.text(`${d.correct}/${d.attempted} (${domainPct}%)`, marginX + maxWidth, y, { align: 'right' });
          y += 8;
          drawBar(marginX, y, maxWidth, 6, domainPct, COLOR.accent);
          y += 20;
        });

        y += 10;
        writeLines('ITEM-BY-ITEM REVIEW', 9, { bold: true, color: COLOR.muted2 });
        y += 6;

        // ---- Review cards ----
        const pad = 14;
        const innerWidth = maxWidth - pad * 2;

        reviewed.forEach(({ item, idx, selected }) => {
          const domain = DOMAINS.find((dm) => dm.id === item.domain);
          const isCorrect = selected === item.answer;
          const selectedText = selected === null ? 'Unanswered' : `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}`;
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;

          const headLine = `${domain.code} \u00b7 ${SOURCE_TIER_LABELS[item.sourceTier]} \u00b7 item ${idx + 1}${state.attempt.flagged?.[idx] ? ' \u00b7 flagged' : ''}`;
          const statusLine = answerStatus(selected, item.answer);
          const questionLines = measure(item.question, 11.5, innerWidth, true);
          const yourAnswerLines = measure(`Your answer: ${selectedText}`, 10, innerWidth, false);
          const correctAnswerLines = !isCorrect ? measure(`Correct answer: ${correctText}`, 10, innerWidth, false) : [];
          const explanationLines = measure(item.explanation, 10, innerWidth, false);
          const docsNoteLines = item.docsNote ? measure(item.docsNote, 10, innerWidth, false) : [];

          const lh11 = 11.5 * 1.4;
          const lh10 = 10 * 1.4;
          const cardHeight =
            pad +
            10 * 1.3 + 8 +
            questionLines.length * lh11 + 8 +
            yourAnswerLines.length * lh10 +
            correctAnswerLines.length * lh10 +
            (explanationLines.length ? explanationLines.length * lh10 + 6 : 0) +
            (docsNoteLines.length ? docsNoteLines.length * lh10 + 4 : 0) +
            pad;

          // Keep a whole card together: if it can't fit on the remainder of the page, start a fresh page.
          if (y + cardHeight > pageHeight - marginBottom && cardHeight <= pageHeight - marginBottom - 56) {
            doc.addPage();
            y = 56;
          }

          const cardTop = y;
          let cy = y + pad;

          setFont(8.5, true);
          doc.setTextColor(...COLOR.muted2);
          doc.text(headLine.toUpperCase(), marginX + pad, cy);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          doc.text(statusLine, marginX + maxWidth - pad, cy, { align: 'right' });
          cy += 8 + 8;

          setFont(11.5, true);
          doc.setTextColor(...COLOR.text);
          questionLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh11; });
          cy += 4;

          setFont(10, false);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          yourAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });

          if (!isCorrect) {
            doc.setTextColor(...COLOR.goodSolid);
            correctAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (explanationLines.length) {
            cy += 6;
            setFont(10, false);
            doc.setTextColor(...COLOR.text);
            explanationLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (docsNoteLines.length) {
            cy += 4;
            setFont(10, false);
            doc.setTextColor(...COLOR.muted);
            docsNoteLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          doc.setDrawColor(...COLOR.border);
          doc.setLineWidth(1);
          doc.roundedRect(marginX, cardTop, maxWidth, cardHeight, 6, 6, 'S');
          doc.setTextColor(...COLOR.text);

          y = cardTop + cardHeight + 10;
        });

        doc.save(`quiz-results-${new Date().toISOString().slice(0, 10)}.pdf`);
      }

      function renderResults() {
        const a = state.attempt;
        const reviewed = a.pool.map((item, idx) => ({ item, idx, selected: a.answers[idx] }));
        const graded = config.form === 'examForm' ? reviewed : reviewed.filter(({ selected }) => selected !== null);
        const total = graded.length;
        const correctCount = graded.reduce((acc, { item, selected }) => acc + (selected === item.answer ? 1 : 0), 0);

        const byDomainAll = DOMAINS.map((d) => {
          const items = graded.filter(({ item }) => item.domain === d.id);
          const correct = items.reduce((acc, { item, selected }) => acc + (selected === item.answer ? 1 : 0), 0);
          return { ...d, attempted: items.length, correct };
        });
        const { points, pct, passed, assessed: byDomain } = computeWeightedScore(byDomainAll);

        const breakdownMarkup = byDomain.map((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          return `
            <div class="breakdown-row">
              <div class="name">${d.code} · ${d.name} <span class="section-note">${d.weight}% weight</span></div>
              <div class="track"><div class="fill" style="width:${domainPct}%"></div></div>
              <div class="num">${d.correct}/${d.attempted}</div>
            </div>
          `;
        }).join('');

        const resultFilters = [
          { id: 'all', label: 'All items' },
          { id: 'flagged', label: 'Flagged' },
          { id: 'wrong', label: 'Wrong answers' },
          { id: 'right', label: 'Right answers' }
        ];
        const currentResultsFilter = resultFilters.some((filter) => filter.id === resultsFilter) ? resultsFilter : 'all';
        const visibleReviewed = reviewed.filter(({ item, idx, selected }) => {
          if (currentResultsFilter === 'flagged') return Boolean(a.flagged?.[idx]);
          if (currentResultsFilter === 'wrong') return selected !== null && selected !== item.answer;
          if (currentResultsFilter === 'right') return selected === item.answer;
          return true;
        });
        const filterCount = (filter) => reviewed.filter(({ item, idx, selected }) => {
          if (filter.id === 'flagged') return Boolean(a.flagged?.[idx]);
          if (filter.id === 'wrong') return selected !== null && selected !== item.answer;
          if (filter.id === 'right') return selected === item.answer;
          return true;
        }).length;
        const reviewMarkup = visibleReviewed.map(({ item, idx, selected }) => {
          const domain = DOMAINS.find((d) => d.id === item.domain);
          const isCorrect = selected === item.answer;
          const selectedText = selected === null ? 'Unanswered' : `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}`;
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;
          const status = answerStatus(selected, item.answer);
          return `
            <article class="review-card" aria-labelledby="reviewQuestion-${idx}">
              <div class="review-head">
                <span>${domain.code} · ${SOURCE_TIER_LABELS[item.sourceTier]} · item ${idx + 1}${a.flagged?.[idx] ? ' · flagged' : ''}</span>
                <span>${status}</span>
              </div>
              <h3 id="reviewQuestion-${idx}" class="review-question">${item.question}</h3>
              <div class="review-line ${isCorrect ? 'correct-line' : 'wrong-line'}">Your answer: ${selectedText}</div>
              ${!isCorrect ? `<div class="review-line correct-line">Correct answer: ${correctText}</div>` : ''}
              <div class="review-line">${item.explanation}</div>
              ${item.docsNote ? `<div class="review-line">${item.docsNote}</div>` : ''}
              ${renderReferencesMarkup(item, true)}
            </article>
          `;
        }).join('');

        app.innerHTML = `
          <header>
            <div class="eyebrow">Results${a.autoSubmitted ? ' · auto-submitted at zero' : ''}</div>
            <h1 class="title" id="resultsHeading" tabindex="-1">Attempt complete.</h1>
          </header>

          <nav class="start-row" aria-label="Results actions">
            <button id="retryBtn" class="btn btn-primary" type="button">New attempt</button>
            <button id="configBtn" class="btn btn-secondary" type="button">Change configuration</button>
            <button id="exportPdfBtn" class="btn btn-secondary" type="button">Export as PDF</button>
          </nav>

          <section class="section" role="region" aria-label="Score summary" style="margin-bottom: 50px;">
            <h2 id="scoreSummaryHeading" class="section-label">Score summary</h2>
            <div class="score-wrap">
              <div class="score-ring" style="--pct:${pct};"><span>${points}</span></div>
              <div class="score-caption">/ 1000 · ${pct}% · <strong style="color: var(${passed ? '--good' : '--bad'});">${passed ? 'Pass' : 'Below pass mark'}</strong> (720 needed)<br>${correctCount} / ${total} correct overall
                <p style="margin: 8px 0 0;">Domain-weighted grade: each domain's percent correct is multiplied by its exam weight. A domain with no attempted items here has its weight redistributed proportionally among the others. The real exam reports a scaled score from 100–1,000 plus percent-correct by domain, so treat this as a readiness gauge, not a predicted scaled score.</p>
              </div>
              <div class="domain-breakdown">${breakdownMarkup}</div>
            </div>
          </section>

          <section class="section" role="region" aria-label="Item-by-item review">
            <h2 id="reviewHeading" class="section-label">Item-by-item review</h2>
            <div class="results-filter" role="tablist" aria-label="Filter review items">
              ${resultFilters.map((filter) => `<button type="button" data-results-filter="${filter.id}" role="tab" aria-selected="${currentResultsFilter === filter.id}">${filter.label} (${filterCount(filter)})</button>`).join('')}
            </div>
            ${reviewMarkup || '<p class="review-filter-empty">No items match this filter.</p>'}
          </section>
        `;

        document.getElementById('retryBtn').addEventListener('click', () => {
          clearLastResults();
          state.attempt = null;
          state.view = 'exam';
          startAttempt();
        });

        document.getElementById('configBtn').addEventListener('click', () => {
          clearLastResults();
          state.attempt = null;
          state.view = 'config';
          clearSavedAttempt();
          renderConfig();
        });

        document.getElementById('exportPdfBtn').addEventListener('click', () => {
          exportResultsToPdf(reviewed, correctCount, total, points, pct, byDomain, passed);
        });

        app.querySelectorAll('[data-results-filter]').forEach((button) => {
          button.addEventListener('click', () => {
            resultsFilter = button.dataset.resultsFilter;
            renderResults();
          });
        });

        document.getElementById('resultsHeading').focus();
        announce(`Attempt complete. You scored ${points} of 1000 points, ${passed ? 'a pass' : 'below the 720 pass mark'}, ${correctCount} of ${total} correct, ${pct}%.`);
      }

      // Restores an in-progress attempt from a prior session, otherwise starts at config
      function resumeSavedAttempt() {
        const saved = loadSavedAttempt();
        if (!saved || !saved.attempt) return false;
        try {
          Object.assign(config, saved.config);
          if (config.form === 'examForm' && (!Number.isFinite(saved.attempt.deadlineAt) || saved.attempt.deadlineAt <= saved.attempt.startedAt)) {
            clearSavedAttempt();
            state.attempt = null;
            state.view = 'config';
            announce('An older exam attempt cannot be resumed. Start a new exam form.');
            return false;
          }
          state.attempt = { ...saved.attempt, timerId: null };
          state.attempt.flagged ||= new Array(state.attempt.pool.length).fill(false);
          state.view = 'exam';
          if (syncExamDeadline()) return true;
          renderExam();
          syncTimerInterval();
          return true;
        } catch {
          // A saved attempt from an incompatible/older shape must not brick the whole app
          clearSavedAttempt();
          state.attempt = null;
          state.view = 'config';
          return false;
        }
      }

      // A reference link out to a module page tags its "Back to quiz" link with ?view=results;
      // if we still have the results that were open at the time, restore that view instead of config.
      function restoreLastResultsFromQuery() {
        if (new URLSearchParams(location.search).get('view') !== 'results') return false;
        try {
          const saved = JSON.parse(localStorage.getItem(LAST_RESULTS_KEY) || 'null');
          if (!saved || !saved.attempt) return false;
          Object.assign(config, saved.config);
          state.attempt = { ...saved.attempt, timerId: null };
          state.view = 'results';
          renderResults();
          return true;
        } catch {
          clearLastResults();
          return false;
        }
      }

      if (!restoreLastResultsFromQuery() && !resumeSavedAttempt()) {
        renderConfig();
      }
    </script>
  </body>
</html>
