          explanation: "Agentic loops are one of the shapes where reasoning earns its cost: a reasoning pass before a plan reduces wrong-tool selection downstream, so the budget belongs on the planning step rather than on every call. Classification, extraction, and format conversion are the cases to leave it off entirely, and the carry-back rule for thinking blocks applies in every tool-use loop regardless of where the reasoning happens." },
        { id: 'd4-19', domain: 'd4', difficulty: 'standard', badge: 'unbadged',
          question: "What does a prompt for visual analysis need that an equivalent text prompt does not?",
          options: ["Instructions for handling ambiguity such as overlapping objects, depth, and partial occlusion", "A restatement of the task after the image block, since content placed before an image is weighted less", "A description of the image's subject, since the model cannot establish the subject on its own", "An explicit resolution statement, so the model knows what scale the description should apply to", "A separate request per object, since one response cannot describe several objects reliably"],
          answer: 0,
          explanation: "The same techniques apply, and a bare instruction to describe an image produces shallow output for the same reason a bare text prompt does. What differs is that images carry ambiguity text cannot: overlapping objects, depth and spatial relationships, partial occlusion. A concrete rule such as describing overlapping objects separately and noting the overlap is the kind of constraint a text-only prompt would never need." },
        { id: 'd4-20', domain: 'd4', difficulty: 'standard', badge: 'unbadged',
          question: "The same reference PDF is sent on many requests and across several turns of one conversation. Which delivery method fits, and why?",
          options: ["Inline base64, because encoding the bytes locally avoids depending on any separate call", "An upload referenced by its returned identifier, because the upload is paid once and later requests carry no payload", "A public URL, because fetching at request time keeps the payload out of the conversation history", "Inline base64 with caching enabled, because a cached payload is not billed again on later requests", "A signed URL with a short expiry, because an expiring link limits how long the document is exposed"],
          answer: 1,
          explanation: "Uploading once and referencing the returned file identifier means every later request carries the ID instead of the bytes, so payload overhead drops to near zero even as history grows. Inline base64 sends the full encoded payload with every request, which multiplies the cost of a reused asset, and a URL adds a dependency that it be stable, public, and reachable at request time, which rules out anything behind auth or signed with a short expiry." },
        { id: 'd4-21', domain: 'd4', difficulty: 'recall', badge: 'unbadged',
          question: "What does a PDF content block require beyond its type and its source?",
          options: ["A name field identifying the document, which the block will not validate without", "A page range, because a document block is processed one span of pages at a time", "Nothing further; a readable title and additional context are both optional fields", "A media type declared outside the source object, alongside the block's own type", "A text block immediately before it, because a document cannot open a user turn"],
          answer: 2,
          explanation: "For PDFs the block type is document rather than image, and the source follows the same pattern as an image: base64, a URL, or an uploaded file identifier. There is no required name field. The block accepts an optional title for a readable document name and an optional context field for extra metadata, and all the other mechanics, including token cost and asset reuse, work as they do for images." },
        { id: 'd4-22', domain: 'd4', difficulty: 'hard', badge: 'inferred',
          question: "An agent must hand its own final answer to a parser in a fixed shape and also guarantee that the arguments it passes to a function are valid. What does that require?",
          options: ["One JSON schema supplied once, since a single constraint governs both responses and tool arguments", "The strict flag alone, since a strictly validated tool call also constrains the response that follows", "A response format constraint alone, since tool arguments are validated against the input schema already", "Both mechanisms: a response format constraint for the answer, and the strict flag on the tool definition", "Neither, since a schema constraint applies to one request and cannot hold across a multi-step loop"],
          answer: 3,
          explanation: "The two structured-output mechanisms constrain different parts of what the model returns, and they can be used on their own or together in the same request. The response format constraint governs the final response your code consumes, while the strict flag on a tool definition validates the arguments Claude sends to that tool before your function runs. Neither substitutes for the other, and an ordinary input schema on its own does not guarantee the arguments conform to it." },

        // D5 — Context & Reliability (expansion)
        { id: 'd5-19', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: "In a retrieval index, what goes wrong at each end of the chunk-size decision?",
          options: ["Small chunks raise embedding cost, while large chunks lower recall because fewer chunks are compared", "Small chunks return too many results to fit in context, while large chunks are rejected by the index", "Small chunks lose document titles, while large chunks lose the ordering the source material had", "Small chunks are matched lexically, while large chunks are matched semantically and less precisely", "Small chunks lack the surrounding context to be useful, while large chunks dilute the match with unrelated text"],
          answer: 4,
          explanation: "Chunking decides what a unit of retrievable context is. Split too small and a chunk lacks the surrounding context to be useful; split too large and one chunk dilutes the match with unrelated text. Sentence- or section-based chunking with a little overlap is a reasonable default, and the overlap matters because a fact that crosses a boundary would otherwise be split apart and become hard to retrieve." },
        { id: 'd5-20', domain: 'd5', difficulty: 'hard', badge: 'unbadged',
          question: "A query naming a specific identifier returns chunks that read as related but do not contain it. What is the mechanism, and the usual mitigation?",
          options: ["Similarity search returns semantically close text, so a lexical match is sometimes run alongside it", "The chunks were assembled in the wrong order, so a re-ranking pass before assembly resolves it", "The identifier was split across a chunk boundary, so removing the overlap between chunks resolves it", "The index is stale, so re-embedding the corpus on a schedule is what keeps identifiers findable", "The query was too short to embed meaningfully, so expanding it with synonyms resolves it"],
          answer: 0,
          explanation: "The embedding match decides which chunks come back and it works by similarity search, so it retrieves content that is semantically close rather than content containing an exact term. A more semantically similar result can outrank the chunk holding the identifier you need, which is why a lexical match is sometimes run alongside the semantic one. The assembly step is a separate failure point, where retrieved chunks have to reach the model in the structure the prompt expects." },
        { id: 'd5-21', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: "An agent keeps losing task-critical state through compaction in sessions it otherwise handles well. Where does that usually originate?",
          options: ["In the compaction threshold, which fired before enough history had accumulated to summarize", "In the summarizer prompt, which is what decides everything the agent will still know afterwards", "In the tool results, which are excluded from any summary because they are not conversation text", "In the context window, which discards the oldest turns once a summary has been written", "In the system prompt, which is replaced by the summary rather than carried alongside it"],
          answer: 1,
          explanation: "When you implement compaction yourself, the summarizer prompt you write determines what the agent knows on subsequent turns. Asking it to summarize the conversation so far preserves far less than asking it to preserve all file paths modified, all decisions made, and any errors encountered with their resolutions. Task-critical state loss from an under-specified summarizer is one of the most common sources of multi-session agent failure, not an edge case." },
        { id: 'd5-22', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: "How can an application measure context pressure before a request goes out rather than after it fails?",
          options: ["Read the usage figures on the previous response and extrapolate them to the pending request", "Turn on caching and read the cache-write size, which reports the length of the prefix processed", "Send the same request body to the token-counting endpoint, which returns a count without running inference", "Submit the request with a minimal output limit first and inspect the stop reason it returns", "Estimate from a characters-per-token ratio, which holds across models and content types"],
          answer: 2,
          explanation: "The token-counting endpoint takes the same request body as a messages call and returns the token count without running inference. Use it in development to check that context-budget assumptions hold against real tool outputs rather than short test fixtures, and in production to gate requests that would exceed the window before they error. Characters-per-token averages are model-dependent and are not a substitute for a measurement." },
        { id: 'd5-23', domain: 'd5', difficulty: 'standard', badge: 'docsNote',
          question: "A service sets a low temperature to make a classifier repeatable, and the request starts failing after a move to a newer model. What is going on, and what replaces the lever?",
          options: ["Temperature is capped per model tier, so the value has to be raised into the supported range", "Temperature moved into the output configuration, so the same value works once it is relocated", "Sampling parameters are rejected whenever reasoning is enabled, so disabling reasoning restores the lever", "The newest models do not accept non-default sampling parameters, and behavior is steered through prompting instead", "Temperature applies only to streamed requests, so the parameter is invalid on a single-shot call"],
          answer: 3,
          explanation: "Sampling controls are model-dependent, and the newest Claude models do not accept non-default sampling parameters: supplying one is an error, and behavior is steered through prompting instead. Even where temperature is accepted, a low value makes output more repeatable without guaranteeing identical results across calls, which is why tests assert on properties that must hold rather than on exact text.",
          docsNote: "Doc detail named in the modules: setting temperature, top_p, or top_k on those models returns a 400 error. Confirm current parameter support in the API reference at build time, since this behavior changed between model generations." },
        { id: 'd5-24', domain: 'd5', difficulty: 'recall', badge: 'unbadged',
          question: "A batch of several thousand classification requests finishes. How should each result be matched back to its input?",
          options: ["By the per-request identifier supplied at submission, since results return in arbitrary order", "By position, since results come back in the order the requests were submitted in", "By re-running any result whose input cannot be inferred from the response content", "By the batch identifier, which is stamped on each result alongside its sequence number", "By submission timestamp, which is recorded per request and preserved through processing"],
          answer: 0,
          explanation: "Batch results return in arbitrary order rather than the order the requests were submitted in, so position is not a usable key. Each request carries its own identifier field, and that is what results are matched back on. The batch identifier names the whole job rather than any individual request inside it." },
        { id: 'd5-25', domain: 'd5', difficulty: 'hard', badge: 'judgment',
          question: "Why define the retry budget and latency ceiling before cost optimization rather than alongside it?",
          options: ["Because a floor defined later cannot be applied retroactively to changes already shipped", "Because cost pressure is visible daily while reliability failures read as noise, so the louder pressure wins if cost goes first", "Because a latency ceiling has to be measured on the chosen model, which fixes the cost baseline anyway", "Because reliability constraints are contractual while cost targets are internal and can be renegotiated", "Because optimizing cost first invalidates the eval baseline the reliability floor is measured against"],
          answer: 1,
          explanation: "Cost and reliability create opposing pressures, and cost is the louder one: a high bill appears on a dashboard every day, while a reliability problem appears as occasional failures easy to dismiss as noise until they accumulate into an incident. Setting the floor first makes reliability the fixed constraint and cost the thing optimized underneath it. A pinned baseline score is what makes the floor checkable, so a cost-saving change that drops below it fails the gate before it ships." },
        { id: 'd5-26', domain: 'd5', difficulty: 'hard', badge: 'unbadged',
          question: "An eval's average score is unchanged after a prompt change. What can that still be hiding, and what surfaces it?",
          options: ["A latency regression, which per-case timings expose while the score does not", "A grader that stopped running, which a comparison against the pinned baseline exposes", "A change that fixed some cases and broke others, which the per-case breakdown shows immediately", "A dataset that shrank, which the count of graded cases exposes alongside the average", "A judge drifting toward a middle score, which re-calibrating against human labels exposes"],
          answer: 2,
          explanation: "A steady average can conceal a change that fixed three cases and broke three others, and the per-case view shows that immediately while the average conceals it. The per-case output is also what tells you the failure category: a formatting failure points at the output instructions, a factual miss on retrieved content points at the retrieval step, and a failure that appears only on long input points at context handling." },
        { id: 'd5-27', domain: 'd5', difficulty: 'hard', badge: 'docsNote',
          question: "Given how cache writes and cache reads are billed, when does prompt caching actually reduce spend?",
          options: ["When the cached prefix changes rarely, since a write is billed at the same rate as ordinary input", "When the prefix is short, since the write premium scales with the number of tokens stored", "When the breakpoint sits after the user message, so the whole request including the question is reused", "When reads outnumber writes, since a write costs a premium over base input and a read a fraction of it", "Whenever caching is left on, since the system amortizes each write across every later request"],
          answer: 3,
          explanation: "Cache writes are billed at a premium over base input tokens while cache reads cost a fraction of standard input, so the economics only work when reads outnumber writes. That is why caching fits long, stable, frequently reused prefixes such as a fixed system prompt or a large tool schema, and why a prefix reused once an hour under the default lifetime pays the write cost again for no read benefit.",
          docsNote: "Doc detail named in the modules: writes are billed at 1.25x base input for the five-minute lifetime and 2x for the one-hour option, while reads cost roughly 0.1x. Confirm the current multipliers and the minimum cacheable prefix length before modelling cost." },
        { id: 'd5-28', domain: 'd5', difficulty: 'standard', badge: 'unbadged',
          question: "A call returns a success status with a stop reason showing the model declined the request. How should the error path treat it?",
          options: ["As retriable with backoff, since a later attempt at the same request may be judged differently", "As a malformed request, since a refusal means the input violated the schema being enforced", "As valid output, since the status code shows the call completed and the response is well formed", "As a tool error, returned to the model with the error flag set so it can choose another approach", "As fail-fast: raise it to the caller and log it, because it is a content decision rather than a transient error"],
          answer: 4,
          explanation: "A refusal arrives with a success status and its own stop reason, and it reflects a content decision rather than a transient failure, so it is fail-fast: raise it to the caller and log it rather than retrying silently or treating it as valid output. It is also why code checks the stop reason before assuming a response parses, since a schema constraint does not guarantee that every response matches the schema." }
      ];

      DOMAINS.forEach((d) => {
        d.count = ITEM_BANK.filter((i) => i.domain === d.id).length;
        d.hardCount = ITEM_BANK.filter((i) => i.domain === d.id && i.difficulty === 'hard').length;
      });
      const TOTAL_ITEMS = ITEM_BANK.length;
      const TOTAL_HARD = ITEM_BANK.filter((i) => i.difficulty === 'hard').length;
      DOMAINS.forEach((d) => { d.pct = Math.round((d.count / TOTAL_ITEMS) * 100); });

      const HISTORY_KEY = 'devFoundationPractice.itemHistory.v1';

      function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); }
        catch { return {}; }
      }

      function recordAnswer(itemId, correct) {
        const history = loadHistory();
        const entry = history[itemId] || { seen: 0, correct: 0 };
        entry.seen += 1;
        if (correct) entry.correct += 1;
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ ...history, [itemId]: entry }));
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function materialize(item, answerSlot) {
        const distractorOrder = shuffle(item.options.map((_, idx) => idx).filter((idx) => idx !== item.answer));
        const order = distractorOrder.slice();
        order.splice(answerSlot, 0, item.answer);
        return {
          ...item,
          options: order.map((idx) => item.options[idx]),
          answer: answerSlot
        };
      }

      function materializeBalanced(items) {
        const answerSlots = shuffle(items.map((_, idx) => idx % 5));
        return items.map((item, idx) => materialize(item, answerSlots[idx]));
      }

      function completeAnswerBlocks(items) {
        return items.slice(0, items.length - (items.length % 5));
      }

      function stratifiedDraw(bank, total, prioritizeHard) {
        let result = [];
        DOMAINS.forEach((d) => {
          const share = Math.max(1, Math.round((d.count / bank.length) * total));
          const domainItems = bank.filter((i) => i.domain === d.id);
          let ordered;
          if (prioritizeHard) {
            const hardItems = shuffle(domainItems.filter((i) => i.difficulty === 'hard'));
            const restItems = shuffle(domainItems.filter((i) => i.difficulty !== 'hard'));
            ordered = hardItems.concat(restItems);
          } else {
            ordered = shuffle(domainItems);
          }
          result = result.concat(ordered.slice(0, Math.min(share, ordered.length)));
        });
        return result;
      }

      const EXAM_FORM_SIZE = Math.min(60, TOTAL_ITEMS);
      const EXAM_FORM_MINUTES = 120;

      const config = {
        form: 'studySet',
        domainFocus: 'all',
        difficulty: 'mixed',
        evidentiary: 'allBadged',
        itemSelection: 'preferUnseen',
        feedback: 'perItem',
        clock: 'timed'
      };

      const state = { view: 'config', attempt: null };
      // Answer idx to focus after the next renderExam() rebuild, set by keyboard nav
      let pendingAnswerFocus = null;

      function buildPool() {
        let pool = ITEM_BANK.slice();

        if (config.form === 'examForm') {
          pool = stratifiedDraw(ITEM_BANK, EXAM_FORM_SIZE, true);
        } else {
          if (config.domainFocus !== 'all') {
            pool = pool.filter((i) => i.domain === config.domainFocus);
          }
          if (config.evidentiary === 'guideOnly') {
            pool = pool.filter((i) => i.badge === 'unbadged' || i.badge === 'docsNote');
          }

          if (config.form === 'hardDrill') {
            const hardItems = pool.filter((i) => i.difficulty === 'hard');
            const standardItems = shuffle(pool.filter((i) => i.difficulty !== 'hard'));
            const target = Math.max(10, hardItems.length);
            pool = hardItems.concat(standardItems).slice(0, Math.min(target, pool.length));
          } else if (config.form === 'studySet') {
            if (config.difficulty === 'standard') {
              // 'standard' includes recall-tier items; only hard items are excluded
              pool = pool.filter((i) => i.difficulty !== 'hard');
            } else if (config.difficulty === 'hardWeighted') {
              const hardItems = pool.filter((i) => i.difficulty === 'hard');
              const standardItems = pool.filter((i) => i.difficulty !== 'hard');
              pool = hardItems.concat(standardItems);
            }
          }
        }

        const history = loadHistory();
        if (config.itemSelection === 'preferUnseen') {
          pool = pool.slice().sort((a, b) => (history[a.id]?.seen || 0) - (history[b.id]?.seen || 0));
        }

        return shuffle(pool);
      }

      const app = document.getElementById('app');

      function formatClock(totalSeconds) {
        const m = Math.floor(Math.max(0, totalSeconds) / 60);
        const s = Math.max(0, totalSeconds) % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }

      function renderConfig() {
        const disabledStudyOnly = config.form === 'examForm';

        const domainBars = [...DOMAINS].sort((a, b) => b.pct - a.pct);
        const maxPct = Math.max(...domainBars.map((d) => d.pct));

        const domainBarsMarkup = domainBars.map((d) => `
          <div class="domain-bar-card">
            <div class="domain-bar-pct">${d.pct}%</div>
            <div class="domain-bar-name">${d.code} — ${d.name}</div>
            <div class="domain-bar-track">
              <div class="domain-bar-fill" style="width:${Math.round((d.pct / maxPct) * 100)}%"></div>
            </div>
          </div>
        `).join('');

        const formCards = [
          { key: 'examForm', title: 'Exam form', desc: `${EXAM_FORM_SIZE} items · ${EXAM_FORM_MINUTES} min · stratified across all 5 domains, hard-tier items prioritized` },
          { key: 'studySet', title: 'Study set', desc: 'The largest complete five-item block matching your domain, difficulty, and evidence filters' },
          { key: 'hardDrill', title: 'Hard drill', desc: 'Hard-tier items only, topped up with standard items if a domain runs short' }
        ];

        const domainChips = [{ key: 'all', code: '', name: 'All domains' }].concat(
          DOMAINS.map((d) => ({ key: d.id, code: d.code, name: d.name }))
        );

        const difficultyCards = [
          { key: 'standard', title: 'Standard', desc: 'Baseline items only' },
          { key: 'mixed', title: 'Mixed', desc: 'Roughly a fifth hard items, matching the overall bank' },
          { key: 'hardWeighted', title: 'Hard-weighted', desc: 'Every hard item available, topped up with standard' }
        ];

        const evidentiaryCards = [
          { key: 'allBadged', title: 'All items, badged', desc: 'Inferred and judgment-call items are labelled in place' },
          { key: 'guideOnly', title: 'Module-documented only', desc: 'Exclude anything the module text does not settle directly' }
        ];

        const itemSelectionCards = [
          { key: 'preferUnseen', title: 'Prefer unseen', desc: 'Draw items you have not answered before, when available' },
          { key: 'fullyRandom', title: 'Fully random', desc: 'Ignore attempt history' }
        ];

        const feedbackCards = [
          { key: 'perItem', title: 'Check per item', desc: 'Nothing is revealed on selection; check answer whenever you choose to, per item' },
          { key: 'end', title: 'Hold until the end', desc: 'No per-item checking; every explanation appears in the final review' }
        ];

        const clockCards = [
          { key: 'timed', title: 'Timed', desc: 'Counts down, auto-submits at zero' },
          { key: 'untimed', title: 'Untimed', desc: 'Counts up, no cutoff' }
        ];

        const renderCards = (cards, groupKey, selectedKey) => cards.map((c) => `
          <button type="button" class="option-card ${selectedKey === c.key ? 'selected' : ''}" data-group="${groupKey}" data-key="${c.key}" aria-pressed="${selectedKey === c.key}">
            <span class="option-title">${c.title}</span>
            <span class="option-description">${c.desc}</span>
          </button>
        `).join('');

        const renderChips = (cards, groupKey, selectedKey) => cards.map((c) => `
          <button type="button" class="option-card ${selectedKey === c.key ? 'selected' : ''}" data-group="${groupKey}" data-key="${c.key}" aria-pressed="${selectedKey === c.key}">
            <span class="option-title">${c.code ? `${c.code}` : c.name}</span>
            ${c.code ? `<span class="option-description">${c.name}</span>` : ''}
          </button>
        `).join('');

        let startLabel = 'Start study set';
        if (config.form === 'examForm') startLabel = 'Start exam form';
        else if (config.form === 'hardDrill') startLabel = 'Start hard drill';

        app.innerHTML = `
          <header>
            <div class="eyebrow">Unofficial practice instrument · ${TOTAL_ITEMS} items · 5 study domains · ${TOTAL_HARD} hard-tier</div>
            <h1 class="title">Sit a scored mock built from your study modules.</h1>
            <p class="lede">
              An attempt draws items from the five study domains below, weighted to match how much of the module content each one covers.
              Keys are checked against the module files in this repository. Where an item turns on a specific parameter, flag, or API constraint,
              a <strong>Docs note</strong> records the exact detail named in the modules. <strong>Unbadged</strong> means the modules state the answer
              directly. <strong>Inferred</strong> extends a documented principle to a case the modules do not directly address.
              <strong>Judgment call</strong> means the modules are silent on the deciding factor and the key reflects the author's reasoning.
            </p>
          </header>

          <section class="section" role="region" aria-label="Domain coverage">
            <h2 id="domainCoverageHeading" class="section-label">Domain coverage</h2>
            <div class="domain-bars">${domainBarsMarkup}</div>
          </section>

          <section class="section" role="region" aria-label="Form settings">
            <fieldset class="section-group">
              <legend id="formSectionHeading" class="section-label">Form</legend>
              <div class="option-grid">${renderCards(formCards, 'form', config.form)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledStudyOnly ? 'disabled' : ''}" role="region" aria-label="Domain focus settings">
            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="domainFocusSectionHeading" class="section-label">Domain focus <span class="section-note">study modes only — exam forms always follow the full blueprint</span></legend>
              <div class="option-grid chips">${renderChips(domainChips, 'domainFocus', config.domainFocus)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledStudyOnly ? 'disabled' : ''}" role="region" aria-label="Difficulty settings">
            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="difficultySectionHeading" class="section-label">Difficulty mix</legend>
              <div class="option-grid">${renderCards(difficultyCards, 'difficulty', config.difficulty)}</div>
            </fieldset>
          </section>

          <section class="section ${disabledStudyOnly ? 'disabled' : ''}" role="region" aria-label="Evidentiary basis settings">
            <fieldset class="section-group" ${disabledStudyOnly ? 'disabled' : ''}>
              <legend id="evidenceSectionHeading" class="section-label">Evidentiary basis</legend>
              <div class="option-grid">${renderCards(evidentiaryCards, 'evidentiary', config.evidentiary)}</div>
            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Item selection settings">
            <fieldset class="section-group">
              <legend id="selectionSectionHeading" class="section-label">Item selection</legend>
              <div class="option-grid">${renderCards(itemSelectionCards, 'itemSelection', config.itemSelection)}</div>
            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Feedback settings">
            <fieldset class="section-group">
              <legend id="feedbackSectionHeading" class="section-label">Feedback</legend>
              <div class="option-grid">${renderCards(feedbackCards, 'feedback', config.feedback)}</div>
            </fieldset>
          </section>

          <section class="section" role="region" aria-label="Clock settings">
            <fieldset class="section-group">
              <legend id="clockSectionHeading" class="section-label">Clock</legend>
              <div class="option-grid">${renderCards(clockCards, 'clock', config.clock)}</div>
            </fieldset>
          </section>

          <section class="start-row" role="region" aria-label="Start attempt">
            <button id="startBtn" class="btn btn-primary" type="button">${startLabel}</button>
            <div class="start-note">
              Item and option order are shuffled on every attempt. Scores and per-item history persist between sittings in this browser; nothing leaves this device.
            </div>
          </section>
        `;

        app.querySelectorAll('.option-card[data-group]').forEach((btn) => {
          btn.addEventListener('click', () => {
            config[btn.dataset.group] = btn.dataset.key;
            renderConfig();
          });
        });

        document.getElementById('startBtn').addEventListener('click', startAttempt);
      }

      function startAttempt() {
        const rawPool = completeAnswerBlocks(buildPool());
        const pool = materializeBalanced(rawPool);

        const totalSeconds = config.clock === 'timed' ? pool.length * 120 : 0;

        state.attempt = {
          pool,
          index: 0,
          answers: new Array(pool.length).fill(null),
          checked: new Array(pool.length).fill(false),
          startedAt: Date.now(),
          remainingSeconds: totalSeconds,
          elapsedSeconds: 0,
          timerId: null,
          autoSubmitted: false
        };

        state.view = 'exam';
        renderExam();

        if (config.clock === 'timed' || config.clock === 'untimed') {
          state.attempt.timerId = setInterval(tickTimer, 1000);
        }
      }

      function tickTimer() {
        const a = state.attempt;
        if (!a) return;

        if (config.clock === 'timed') {
          a.remainingSeconds -= 1;
          if (a.remainingSeconds <= 0) {
            a.remainingSeconds = 0;
            a.autoSubmitted = true;
            clearInterval(a.timerId);
            announce('Time expired. Attempt submitted.');
            finishAttempt();
            return;
          }
        } else {
          a.elapsedSeconds += 1;
        }

        const timerEl = document.getElementById('timerDisplay');
        if (timerEl) {
          timerEl.textContent = config.clock === 'timed' ? formatClock(a.remainingSeconds) : formatClock(a.elapsedSeconds);
          timerEl.classList.toggle('low', config.clock === 'timed' && a.remainingSeconds <= 30);
        }
      }

      function selectAnswer(idx) {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = idx;
        renderExam();
      }

      function checkAnswer() {
        const a = state.attempt;
        if (a.checked[a.index] || a.answers[a.index] === null) return;
        const item = a.pool[a.index];
        a.checked[a.index] = true;
        const isCorrect = a.answers[a.index] === item.answer;
        recordAnswer(item.id, isCorrect);
        announce(isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`);
        renderExam();
      }

      function clearSelection() {
        const a = state.attempt;
        if (a.checked[a.index]) return;
        a.answers[a.index] = null;
        renderExam();
      }

      function goNext() {
        const a = state.attempt;
        if (a.index < a.pool.length - 1) {
          a.index += 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
        } else {
          finishAttempt();
        }
      }

      function goPrev() {
        const a = state.attempt;
        if (a.index > 0) {
          a.index -= 1;
          announce(`Item ${a.index + 1} of ${a.pool.length}`);
          renderExam();
        }
      }

      function finishAttempt() {
        const a = state.attempt;
        a.pool.forEach((item, idx) => {
          if (!a.checked[idx]) recordAnswer(item.id, a.answers[idx] === item.answer);
        });
        if (a.timerId) clearInterval(a.timerId);
        state.view = 'results';
        renderResults();
      }

      // Descriptor for whatever currently has focus, used to restore it after an innerHTML rebuild
      function captureFocusTarget() {
        if (pendingAnswerFocus !== null) {
          const idx = pendingAnswerFocus;
          pendingAnswerFocus = null;
          return { idx };
        }
        const activeEl = document.activeElement;
        if (!activeEl) return null;
        if (activeEl.classList && activeEl.classList.contains('answer-row')) {
          return { idx: Number(activeEl.dataset.idx) };
        }
        if (activeEl.id) return { id: activeEl.id };
        return null;
      }

      function restoreFocusTarget(focusTarget) {
        if (!focusTarget) return;
        if (focusTarget.idx !== undefined) {
          const row = app.querySelector(`.answer-row[data-idx="${focusTarget.idx}"]`) || app.querySelector('.answer-row[tabindex="0"]');
          if (row) row.focus();
        } else if (focusTarget.id) {
          const el = document.getElementById(focusTarget.id) || document.getElementById('nextBtn') || document.getElementById('questionHeading');
          if (el) el.focus();
        }
      }

      // Arrow keys move+select (roving tabindex), Home/End jump to the ends, Space/Enter select the focused option
      function resolveAnswerKeyIdx(e, idx, last) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') return idx === last ? 0 : idx + 1;
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') return idx === 0 ? last : idx - 1;
        if (e.key === 'Home') return 0;
        if (e.key === 'End') return last;
        if (e.key === ' ' || e.key === 'Enter') return idx;
        return null;
      }

      function renderAnswerRows(item, selected, checked, locked) {
        const tabbableIdx = selected !== null ? selected : 0;
        return item.options.map((opt, idx) => {
          const letter = String.fromCodePoint(65 + idx);
          const classes = ['answer-row'];
          if (locked) classes.push('locked');
          if (selected === idx) classes.push('selected');
          if (checked && idx === item.answer) classes.push('correct');
          if (checked && selected === idx && idx !== item.answer) classes.push('wrong');
          return `
            <div class="${classes.join(' ')}" data-idx="${idx}" role="radio" tabindex="${idx === tabbableIdx ? '0' : '-1'}" aria-checked="${selected === idx}" aria-label="Option ${letter}: ${opt}"${locked ? ' aria-disabled="true"' : ''}>
              <div class="answer-letter">${letter}</div>
              <div>${opt}</div>
            </div>
          `;
        }).join('');
      }

      function renderExplanationMarkup(item, selected, checked) {
        if (!checked) return '';
        const isCorrect = selected === item.answer;
        const headerText = isCorrect ? 'Correct' : `Incorrect — correct answer: ${String.fromCodePoint(65 + item.answer)}`;
        const docsNoteMarkup = item.docsNote ? `<div class="docs-note-box"><strong>${item.docsNote}</strong></div>` : '';
        return `
          <section role="region" aria-label="Answer feedback">
            <div class="explanation-box ${isCorrect ? 'is-correct' : 'is-wrong'}" role="status" aria-live="polite" aria-atomic="true">
              <div class="explanation-label">${headerText}</div>
              <div>${item.explanation}</div>
            </div>
            ${docsNoteMarkup}
          </section>
        `;
      }

      function renderTimerMarkup(a) {
        if (config.clock === 'timed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time remaining">${formatClock(a.remainingSeconds)}</div>`;
        }
        if (config.clock === 'untimed') {
          return `<div class="timer" id="timerDisplay" role="timer" aria-label="Time elapsed">${formatClock(a.elapsedSeconds)}</div>`;
        }
        return '';
      }

      function renderCheckRowMarkup(manualMode, checked, selected) {
        if (!manualMode || checked) return '';
        const disabledAttr = selected === null ? 'disabled' : '';
        return `
          <div class="check-row">
            <button id="checkBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Check answer</button>
            <button id="clearBtn" class="btn btn-secondary" type="button" ${disabledAttr}>Clear selection</button>
          </div>
        `;
      }

      function bindExamEvents(item, locked) {
        app.querySelectorAll('.answer-row').forEach((row) => {
          row.addEventListener('click', () => {
            if (locked) return;
            selectAnswer(Number(row.dataset.idx));
          });
        });

        app.querySelector('.answer-list').addEventListener('keydown', (e) => {
          const row = e.target.closest('.answer-row');
          if (!row || locked) return;
          const idx = Number(row.dataset.idx);
          const nextIdx = resolveAnswerKeyIdx(e, idx, item.options.length - 1);
          if (nextIdx === null) return;
          e.preventDefault();
          pendingAnswerFocus = nextIdx;
          selectAnswer(nextIdx);
        });

        document.getElementById('prevBtn').addEventListener('click', goPrev);
        document.getElementById('nextBtn').addEventListener('click', goNext);
        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn) checkBtn.addEventListener('click', checkAnswer);
        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearSelection);
      }

      function renderExam() {
        const a = state.attempt;
        const item = a.pool[a.index];
        const domain = DOMAINS.find((d) => d.id === item.domain);
        const selected = a.answers[a.index];
        const manualMode = config.feedback === 'perItem';
        const checked = manualMode && a.checked[a.index];
        const locked = checked;

        const focusTarget = captureFocusTarget();

        const badgeClass = item.badge === 'unbadged' ? '' : item.badge;
        const answerRows = renderAnswerRows(item, selected, checked, locked);
        const explanationMarkup = renderExplanationMarkup(item, selected, checked);
        const timerMarkup = renderTimerMarkup(a);
        const checkRowMarkup = renderCheckRowMarkup(manualMode, checked, selected);

        app.innerHTML = `
          <section role="region" aria-label="Question ${a.index + 1} of ${a.pool.length}">
            <h1 id="questionRegionHeading" class="sr-only">Question ${a.index + 1} of ${a.pool.length}</h1>
            <div class="eyebrow">${domain.code} · ${domain.name}</div>
            <div class="exam-topbar">
              <span class="badge-tag ${badgeClass}">${BADGE_LABELS[item.badge]}</span>
              <div style="display:flex; align-items:center; gap:14px;">
                <span style="color:var(--muted-2); font-size:0.85rem;">Item ${a.index + 1} of ${a.pool.length}</span>
                ${timerMarkup}
              </div>
            </div>

            <div class="progress-track" role="progressbar" aria-valuenow="${a.index + 1}" aria-valuemin="1" aria-valuemax="${a.pool.length}" aria-valuetext="Question ${a.index + 1} of ${a.pool.length}"><div class="progress-fill" style="width:${((a.index + 1) / a.pool.length) * 100}%"></div></div>

            <h2 id="questionHeading" class="question-text" tabindex="-1">${item.question}</h2>

            <section role="region" aria-label="Answer options">
              <div class="answer-list" role="radiogroup" aria-labelledby="questionHeading">${answerRows}</div>
            </section>

            ${explanationMarkup}
          </section>

          <nav class="nav-row" aria-label="Question navigation">
            <div class="check-row">
              <button id="prevBtn" class="btn btn-secondary" type="button" ${a.index === 0 ? 'disabled' : ''}>Previous</button>
              <button id="nextBtn" class="btn btn-primary" type="button">${a.index === a.pool.length - 1 ? 'Finish' : 'Next'}</button>
            </div>
            ${checkRowMarkup}
          </nav>
        `;

        bindExamEvents(item, locked);
        restoreFocusTarget(focusTarget);
      }

      // Builds a text-based (selectable) PDF via jsPDF, loaded from CDN in <head>,
      // styled to echo the live results page: colored text, bordered cards, and bar graphics.
      function exportResultsToPdf(a, correctCount, total, pct, byDomain) {
        if (!window.jspdf) {
          alert('PDF export could not load. Check your internet connection and try again.');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'letter' });
        const marginX = 48;
        const marginBottom = 48;
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const maxWidth = pageWidth - marginX * 2;
        let y = 56;

        // Palette mirrors the light-theme CSS custom properties so the PDF reads like the live page.
        const COLOR = {
          text: [20, 22, 26],
          muted: [107, 114, 128],
          muted2: [154, 161, 172],
          accent: [37, 99, 235],
          accentSolid: [29, 78, 216],
          accentBg: [238, 244, 255],
          good: [22, 163, 74],
          goodSolid: [21, 128, 61],
          goodBg: [234, 251, 241],
          bad: [220, 38, 38],
          badSolid: [185, 28, 28],
          badBg: [253, 236, 236],
          border: [227, 229, 234],
          borderStrong: [200, 205, 214],
        };

        const ensureSpace = (needed) => {
          if (y + needed > pageHeight - marginBottom) {
            doc.addPage();
            y = 56;
          }
        };

        const setFont = (size, bold) => {
          doc.setFontSize(size);
          doc.setFont('helvetica', bold ? 'bold' : 'normal');
        };

        const measure = (text, size, width, bold) => {
          setFont(size, bold);
          return doc.splitTextToSize(String(text), width);
        };

        const writeLines = (text, size, opts = {}) => {
          setFont(size, opts.bold);
          doc.setTextColor(...(opts.color || COLOR.text));
          const lines = doc.splitTextToSize(String(text), opts.width || maxWidth);
          const lh = size * 1.4;
          lines.forEach((line) => {
            ensureSpace(lh);
            doc.text(line, opts.x || marginX, y);
            y += lh;
          });
          doc.setTextColor(...COLOR.text);
        };

        // A rounded horizontal meter bar, matching .progress-track/.domain-bar-track visuals.
        const drawBar = (x, barY, w, h, pctValue, fillColor) => {
          const r = h / 2;
          doc.setFillColor(...COLOR.border);
          doc.roundedRect(x, barY, w, h, r, r, 'F');
          const fillW = Math.max(h, (w * Math.min(100, Math.max(0, pctValue))) / 100);
          doc.setFillColor(...fillColor);
          doc.roundedRect(x, barY, fillW, h, r, r, 'F');
        };

        // ---- Header ----
        writeLines('Anthropic Developer Foundation Study Quiz', 16, { bold: true });
        writeLines(`Results \u00b7 ${new Date().toLocaleString()}`, 10, { color: COLOR.muted });
        y += 10;

        // ---- Score summary ----
        writeLines('SCORE SUMMARY', 9, { bold: true, color: COLOR.muted2 });
        y += 4;
        ensureSpace(34);
        setFont(28, true);
        doc.setTextColor(...COLOR.accentSolid);
        doc.text(`${pct}%`, marginX, y + 22);
        setFont(12, true);
        doc.setTextColor(...COLOR.text);
        doc.text(`${correctCount} / ${total} correct`, marginX + 90, y + 18);
        y += 34;
        drawBar(marginX, y, maxWidth, 8, pct, COLOR.accent);
        y += 26;

        byDomain.forEach((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          ensureSpace(30);
          setFont(9.5, false);
          doc.setTextColor(...COLOR.muted);
          doc.text(`${d.code} \u00b7 ${d.name}`, marginX, y);
          setFont(9.5, true);
          doc.setTextColor(...COLOR.text);
          doc.text(`${d.correct}/${d.attempted} (${domainPct}%)`, marginX + maxWidth, y, { align: 'right' });
          y += 8;
          drawBar(marginX, y, maxWidth, 6, domainPct, COLOR.accent);
          y += 20;
        });

        y += 10;
        writeLines('ITEM-BY-ITEM REVIEW', 9, { bold: true, color: COLOR.muted2 });
        y += 6;

        // ---- Review cards ----
        const pad = 14;
        const innerWidth = maxWidth - pad * 2;

        a.pool.forEach((item, idx) => {
          const domain = DOMAINS.find((dm) => dm.id === item.domain);
          const selected = a.answers[idx];
          const isCorrect = selected === item.answer;
          const selectedText = selected !== null ? `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}` : 'No answer';
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;

          const headLine = `${domain.code} \u00b7 ${BADGE_LABELS[item.badge]} \u00b7 item ${idx + 1}`;
          const statusLine = isCorrect ? 'Correct' : 'Incorrect';
          const questionLines = measure(item.question, 11.5, innerWidth, true);
          const yourAnswerLines = measure(`Your answer: ${selectedText}`, 10, innerWidth, false);
          const correctAnswerLines = !isCorrect ? measure(`Correct answer: ${correctText}`, 10, innerWidth, false) : [];
          const explanationLines = measure(item.explanation, 10, innerWidth, false);
          const docsNoteLines = item.docsNote ? measure(item.docsNote, 10, innerWidth, false) : [];

          const lh11 = 11.5 * 1.4;
          const lh10 = 10 * 1.4;
          const cardHeight =
            pad +
            10 * 1.3 + 8 +
            questionLines.length * lh11 + 8 +
            yourAnswerLines.length * lh10 +
            correctAnswerLines.length * lh10 +
            (explanationLines.length ? explanationLines.length * lh10 + 6 : 0) +
            (docsNoteLines.length ? docsNoteLines.length * lh10 + 4 : 0) +
            pad;

          // Keep a whole card together: if it can't fit on the remainder of the page, start a fresh page.
          if (y + cardHeight > pageHeight - marginBottom && cardHeight <= pageHeight - marginBottom - 56) {
            doc.addPage();
            y = 56;
          }

          const cardTop = y;
          let cy = y + pad;

          setFont(8.5, true);
          doc.setTextColor(...COLOR.muted2);
          doc.text(headLine.toUpperCase(), marginX + pad, cy);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          doc.text(statusLine, marginX + maxWidth - pad, cy, { align: 'right' });
          cy += 8 + 8;

          setFont(11.5, true);
          doc.setTextColor(...COLOR.text);
          questionLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh11; });
          cy += 4;

          setFont(10, false);
          doc.setTextColor(...(isCorrect ? COLOR.goodSolid : COLOR.badSolid));
          yourAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });

          if (!isCorrect) {
            doc.setTextColor(...COLOR.goodSolid);
            correctAnswerLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (explanationLines.length) {
            cy += 6;
            setFont(10, false);
            doc.setTextColor(...COLOR.text);
            explanationLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          if (docsNoteLines.length) {
            cy += 4;
            setFont(10, false);
            doc.setTextColor(...COLOR.muted);
            docsNoteLines.forEach((line) => { doc.text(line, marginX + pad, cy); cy += lh10; });
          }

          doc.setDrawColor(...COLOR.border);
          doc.setLineWidth(1);
          doc.roundedRect(marginX, cardTop, maxWidth, cardHeight, 6, 6, 'S');
          doc.setTextColor(...COLOR.text);

          y = cardTop + cardHeight + 10;
        });

        doc.save(`quiz-results-${new Date().toISOString().slice(0, 10)}.pdf`);
      }

      function renderResults() {
        const a = state.attempt;
        const total = a.pool.length;
        const correctCount = a.pool.reduce((acc, item, idx) => acc + (a.answers[idx] === item.answer ? 1 : 0), 0);
        const pct = Math.round((correctCount / total) * 100) || 0;

        const byDomain = DOMAINS.map((d) => {
          const items = a.pool.map((item, idx) => ({ item, idx })).filter(({ item }) => item.domain === d.id);
          const correct = items.reduce((acc, { item, idx }) => acc + (a.answers[idx] === item.answer ? 1 : 0), 0);
          return { ...d, attempted: items.length, correct };
        }).filter((d) => d.attempted > 0);

        const breakdownMarkup = byDomain.map((d) => {
          const domainPct = Math.round((d.correct / d.attempted) * 100) || 0;
          return `
            <div class="breakdown-row">
              <div class="name">${d.code} · ${d.name}</div>
              <div class="track"><div class="fill" style="width:${domainPct}%"></div></div>
              <div class="num">${d.correct}/${d.attempted}</div>
            </div>
          `;
        }).join('');

        const reviewMarkup = a.pool.map((item, idx) => {
          const domain = DOMAINS.find((d) => d.id === item.domain);
          const selected = a.answers[idx];
          const isCorrect = selected === item.answer;
          const selectedText = selected !== null ? `${String.fromCodePoint(65 + selected)}) ${item.options[selected]}` : 'No answer';
          const correctText = `${String.fromCodePoint(65 + item.answer)}) ${item.options[item.answer]}`;
          return `
            <article class="review-card" aria-labelledby="reviewQuestion-${idx}">
              <div class="review-head">
                <span>${domain.code} · ${BADGE_LABELS[item.badge]} · item ${idx + 1}</span>
                <span>${isCorrect ? 'Correct' : 'Incorrect'}</span>
              </div>
              <h3 id="reviewQuestion-${idx}" class="review-question">${item.question}</h3>
              <div class="review-line ${isCorrect ? 'correct-line' : 'wrong-line'}">Your answer: ${selectedText}</div>
              ${!isCorrect ? `<div class="review-line correct-line">Correct answer: ${correctText}</div>` : ''}
              <div class="review-line">${item.explanation}</div>
              ${item.docsNote ? `<div class="review-line">${item.docsNote}</div>` : ''}
            </article>
          `;
        }).join('');

        app.innerHTML = `
          <header>
            <div class="eyebrow">Results${a.autoSubmitted ? ' · auto-submitted at zero' : ''}</div>
            <h1 class="title" id="resultsHeading" tabindex="-1">Attempt complete.</h1>
          </header>

          <nav class="start-row" aria-label="Results actions">
            <button id="retryBtn" class="btn btn-primary" type="button">New attempt</button>
            <button id="configBtn" class="btn btn-secondary" type="button">Change configuration</button>
            <button id="exportPdfBtn" class="btn btn-secondary" type="button">Export as PDF</button>
          </nav>

          <section class="section" role="region" aria-label="Score summary" style="margin-bottom: 50px;">
            <h2 id="scoreSummaryHeading" class="section-label">Score summary</h2>
            <div class="score-wrap">
              <div class="score-ring" style="--pct:${pct};"><span>${pct}%</span></div>
              <div class="domain-breakdown">${breakdownMarkup}</div>
            </div>
          </section>

          <section class="section" role="region" aria-label="Item-by-item review">
            <h2 id="reviewHeading" class="section-label">Item-by-item review</h2>
            ${reviewMarkup}
          </section>
        `;

        document.getElementById('retryBtn').addEventListener('click', () => {
          state.attempt = null;
          state.view = 'exam';
          startAttempt();
        });

        document.getElementById('configBtn').addEventListener('click', () => {
          state.attempt = null;
          state.view = 'config';
          renderConfig();
        });

        document.getElementById('exportPdfBtn').addEventListener('click', () => {
          exportResultsToPdf(a, correctCount, total, pct, byDomain);
        });

        document.getElementById('resultsHeading').focus();
        announce(`Attempt complete. You scored ${correctCount} of ${total}, ${pct}%.`);
      }

      renderConfig();
    </script>
  </body>
</html>
